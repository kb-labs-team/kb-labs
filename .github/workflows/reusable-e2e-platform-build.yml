name: Reusable — Prepare E2E platform bundle

on:
  workflow_call:
    inputs:
      artifact-name:
        description: 'Artifact name consumed by the E2E matrix shards'
        type: string
        required: true
      cache-mode:
        description: 'restore reads the master-written caches (never writes); off for authoritative main, nightly, and release lanes'
        type: string
        default: restore

permissions:
  contents: read

env:
  COMPOSE_FILE: e2e/docker-compose.yml:e2e/docker-compose.ci.yml
  COMPOSE_PROJECT_NAME: kb-e2e-platform-prepare

jobs:
  build:
    name: E2E prepare / build once
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Start prepare metrics
        run: date +%s > /tmp/e2e-prepare-start

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          # kb-devkit builds every Go module in the workspace (including
          # kb-deploy/kb-monitor, which require go 1.26 as of #435), not just
          # kb-create — go-version-file only pins to one module's directive
          # and silently under-provisions the toolchain for the rest.
          go-version: '1.26.8'
          cache: false

      - name: Set up pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24'
      - uses: ./.github/actions/pnpm-store
        if: inputs.cache-mode != 'off'

      - name: Build Go tools (kb-devkit, kb-dev)
        run: |
          (cd tools/kb-devkit && CGO_ENABLED=0 go build -o kb-devkit . && chmod +x kb-devkit)
          (cd tools/kb-dev    && CGO_ENABLED=0 go build -o kb-dev    . && chmod +x kb-dev)

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Restore kb-devkit build cache
        uses: ./.github/actions/devkit-cas
        with:
          mode: ${{ inputs.cache-mode }}

      - name: Build all packages (topological order)
        run: |
          if [ "${{ inputs.cache-mode }}" = "off" ]; then
            ./tools/kb-devkit/kb-devkit run build --no-cache
          else
            pnpm build
          fi

      - name: Pack @kb-labs/* packages
        run: bash e2e/scripts/pack-all.sh

      - name: Verify packed package set
        run: |
          count=$(find e2e/packages -maxdepth 1 -type f -name '*.tgz' | wc -l | tr -d ' ')
          echo "Packed tarballs: $count"
          test "$count" -ge 100
          bash e2e/scripts/validate-packed-packages.sh "$GITHUB_WORKSPACE/e2e/packages"

      - name: Pre-pull BuildKit image
        run: |
          for i in 1 2 3; do
            docker pull moby/buildkit:buildx-stable-1 && break
            echo "Attempt $i failed, retrying in 15s…"
            sleep 15
          done

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e
        timeout-minutes: 5

      - name: Install GoReleaser for candidate binaries
        uses: ./.github/actions/install-goreleaser
      - name: Prepare platform candidate binaries
        run: bash e2e/platform/prepare-container-binaries.sh
      - name: Verify release-index preparation from GoReleaser output
        run: node --test scripts/release-binary-manifest.preflight.mjs

      - name: Build platform image
        run: |
          cache_args=()
          if [ "${{ inputs.cache-mode }}" = "restore" ]; then
            cache_args=(--cache-from "type=gha,scope=e2e-platform")
          fi
          docker buildx build \
            "${cache_args[@]}" \
            --load -t kb-e2e-ci-platform:latest --build-arg "SOURCE_REVISION=$GITHUB_SHA" -f e2e/platform/Dockerfile .

      - name: Build publisher image
        uses: ./.github/actions/build-publisher
        with:
          cache-from: ${{ inputs.cache-mode == 'restore' && 'type=gha,scope=e2e-publisher' || '' }}

      - name: Prepare Verdaccio storage permissions
        run: |
          mkdir -p e2e/.verdaccio-storage
          sudo chown -R 10001:65533 e2e/.verdaccio-storage

      - name: Start Verdaccio
        run: docker compose up -d verdaccio

      - name: Wait for Verdaccio
        run: |
          for i in $(seq 1 30); do
            if docker compose ps verdaccio | grep -q healthy; then
              echo "Verdaccio healthy after $((i * 2))s"
              exit 0
            fi
            sleep 2
          done
          docker compose logs verdaccio
          exit 1

      - name: Publish packages once
        run: docker compose run --rm publisher

      - name: Stop Verdaccio without deleting snapshot
        if: always()
        run: docker compose down --remove-orphans || true

      - name: Restore snapshot ownership
        if: always()
        run: sudo chown -R "$(id -u):$(id -g)" e2e/.verdaccio-storage || true

      - name: Create immutable E2E files bundle
        run: |
          find . -path '*/node_modules/*' -prune -o -type d -name dist -print > /tmp/dist-paths
          tar czf /tmp/e2e-files.tar.gz \
            .kb/devkit \
            tools/kb-devkit/kb-devkit \
            tools/kb-dev/kb-dev \
            e2e/packages \
            e2e/.verdaccio-storage \
            -T /tmp/dist-paths

      - name: Save immutable Docker images
        run: docker save kb-e2e-ci-platform:latest kb-e2e-ci-publisher:latest > /tmp/e2e-images.tar

      - name: Emit bundle metrics
        run: |
          started=$(cat /tmp/e2e-prepare-start)
          elapsed=$(( $(date +%s) - started ))
          tarball_count=$(find e2e/packages -maxdepth 1 -type f -name '*.tgz' | wc -l | tr -d ' ')
          tarball_digest=$(find e2e/packages -maxdepth 1 -type f -name '*.tgz' -exec sha256sum {} \; | LC_ALL=C sort | sha256sum | awk '{print $1}')
          cas_size=$(du -sh .kb/devkit 2>/dev/null | awk '{print $1}' || true)
          jq -n \
            --arg source_sha "$GITHUB_SHA" \
            --arg cache_mode "${{ inputs.cache-mode }}" \
            --arg tarball_digest "$tarball_digest" \
            --argjson elapsed_seconds "$elapsed" \
            --argjson tarball_count "$tarball_count" \
            --arg cas_size "${cas_size:-0}" \
            '{source_sha: $source_sha, cache_mode: $cache_mode, elapsed_seconds: $elapsed_seconds, tarball_count: $tarball_count, tarball_digest: $tarball_digest, devkit_cas_size: $cas_size}' \
            | tee /tmp/e2e-bundle-metadata.json
          {
            echo '### E2E prepare metrics'
            echo ''
            echo '| Metric | Value |'
            echo '|---|---:|'
            echo "| Cache mode | ${{ inputs.cache-mode }} |"
            echo "| Prepare elapsed | ${elapsed}s |"
            echo "| Packed tarballs | $tarball_count |"
            echo "| Tarball digest | \`$tarball_digest\` |"
            echo "| kb-devkit CAS size | ${cas_size:-0} |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload immutable E2E bundle
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: ${{ inputs.artifact-name }}
          path: |
            /tmp/e2e-files.tar.gz
            /tmp/e2e-images.tar
            /tmp/e2e-bundle-metadata.json
          retention-days: 1
          compression-level: 0
