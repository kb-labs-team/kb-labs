name: Journey installed PTY procfs diagnostic

on:
  workflow_dispatch:
    inputs:
      producer_run_id:
        description: Actions run containing journey-build-candidate
        required: true
        default: '44135591916'
        type: string
      run_journey:
        description: Run the local S-040.1 journey with safe procfs diagnostics
        required: true
        default: false
        type: boolean
  push:
    branches:
      - 'verify/*'
    paths:
      - '.github/workflows/journey-pty-procfs-artifact-smoke.yml'
      - 'e2e/journey/**'
      - 'e2e/docker-compose.yml'
      - 'e2e/compose-owner.sh'

permissions:
  actions: read
  contents: read

jobs:
  installed-procfs-readiness:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      PRODUCER_SHA: '921204c9971e361bb06b70f6b6e273bf0b50a2ad'
      PRODUCER_INPUT: .journey/batch-input/producer
      DIAGNOSTIC_OUTPUT: .journey/pty-procfs-diagnostic
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Download the producer candidate artifact
        uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16
        with:
          name: journey-build-candidate
          path: ${{ env.PRODUCER_INPUT }}
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ github.event.inputs.producer_run_id || '44135591916' }}
      - name: Verify producer identity and archive digest before execution
        id: candidate-identity
        run: |
          python3 e2e/journey/batch_summary.py verify-run \
            "$PRODUCER_INPUT/shared/run.json" "$PRODUCER_SHA"
          python3 e2e/journey/batch_summary.py verify-candidate \
            "$PRODUCER_INPUT/shared/batch-metadata.json" \
            "$PRODUCER_INPUT/shared/build-candidate.tar"
      - name: Create and verify runner-owned report bind mount target
        id: reports-owner-before
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$DIAGNOSTIC_OUTPUT"
          python3 e2e/journey/report_directory_guard.py prepare \
            .journey/reports "$DIAGNOSTIC_OUTPUT/reports-owner.log"
      - name: Diagnose the installed wizard's PTY procfs access
        run: e2e/journey/pty-procfs-artifact-smoke.sh "$PRODUCER_INPUT"
      - name: Verify report owner after the Compose probe
        id: reports-owner-after-probe
        if: ${{ always() && steps.reports-owner-before.outcome == 'success' }}
        shell: bash
        run: |
          python3 e2e/journey/report_directory_guard.py check \
            .journey/reports "$DIAGNOSTIC_OUTPUT/reports-owner.log" --phase after-probe
      - name: Restore producer source and overlay safe diagnostics
        id: diagnostic-source
        if: ${{ always() && inputs.run_journey && steps.candidate-identity.outcome == 'success' && steps.reports-owner-after-probe.outcome == 'success' }}
        shell: bash
        run: |
          diagnostic_commit="$(git rev-parse HEAD)"
          cp e2e/journey/invocations.py "$RUNNER_TEMP/diagnostic-invocations.py"
          cp e2e/journey/report_directory_guard.py "$RUNNER_TEMP/diagnostic-report-directory-guard.py"
          git checkout --detach "$PRODUCER_SHA"
          cp "$RUNNER_TEMP/diagnostic-invocations.py" e2e/journey/invocations.py
          cp "$RUNNER_TEMP/diagnostic-report-directory-guard.py" e2e/journey/report_directory_guard.py
          printf 'Producer source SHA: %s\nDiagnostic patch SHA: %s\n' "$PRODUCER_SHA" "$diagnostic_commit"
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86
        if: ${{ always() && inputs.run_journey && steps.diagnostic-source.outcome == 'success' }}
        with:
          run_install: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        if: ${{ always() && inputs.run_journey && steps.diagnostic-source.outcome == 'success' }}
        with:
          node-version-file: package.json
          cache: pnpm
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        if: ${{ always() && inputs.run_journey && steps.diagnostic-source.outcome == 'success' }}
        with:
          go-version: '1.26.8'
          cache-dependency-path: tools/kb-devkit/go.sum
      - name: Install workspace dependencies
        if: ${{ always() && inputs.run_journey && steps.diagnostic-source.outcome == 'success' }}
        run: corepack pnpm install --frozen-lockfile
      - name: Run only affected local case S-040.1
        if: ${{ always() && inputs.run_journey && steps.diagnostic-source.outcome == 'success' }}
        run: e2e/journey/batch.sh mode local "$PRODUCER_INPUT" "$DIAGNOSTIC_OUTPUT" --cases S-040.1
      - name: Record report owner after one-case run
        if: ${{ always() && inputs.run_journey && steps.diagnostic-source.outcome == 'success' }}
        shell: bash
        run: |
          python3 e2e/journey/report_directory_guard.py check \
            .journey/reports "$DIAGNOSTIC_OUTPUT/reports-owner.log" --phase after-one-case
      - name: Upload report ownership evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: journey-pty-procfs-report-ownership
          path: ${{ env.DIAGNOSTIC_OUTPUT }}/reports-owner.log
          if-no-files-found: warn
          retention-days: 30
      - name: Upload one-case diagnostics
        if: ${{ always() && inputs.run_journey }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: journey-pty-procfs-one-case
          path: ${{ env.DIAGNOSTIC_OUTPUT }}
          if-no-files-found: warn
          retention-days: 30
