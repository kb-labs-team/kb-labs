name: Docs Bot

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: docs-bot-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  build-tools:
    uses: ./.github/workflows/build-go-tools.yml

  # ── Structural audit — fails CI on violations ──────────────────────────────
  # Errors (missing files, bad naming, depth violations) block merge via
  # branch protection "Require status checks to pass".
  # Warnings are printed to the log but do not fail the job.
  docs-audit:
    needs: build-tools
    name: Doc conventions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: go-tools
          path: tools-bin/
      - name: Install kb-devkit
        run: |
          chmod +x tools-bin/kb-devkit
          cp tools-bin/kb-devkit tools/kb-devkit/kb-devkit

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86
        with: { run_install: false }

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24'
          cache: pnpm

      - name: Install docs workspace dependencies
        run: pnpm install --frozen-lockfile --filter @kb-labs/docs-site

      - name: Run docs-audit through kb-devkit
        run: ./tools/kb-devkit/kb-devkit check --only docs-audit

      - name: Check generated docs sources and deprecated CLI examples
        run: ./tools/kb-devkit/kb-devkit check --only docs-source-check

  # ── Staleness check — posts reminder threads, never blocks merge ───────────
  # Inline threads on changed files tell the author which doc pages to verify.
  # Threads are resolved manually after updating or confirming no change needed.
  docs-staleness:
    name: Doc staleness
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24'

      - name: Get changed files
        id: changed
        run: |
          BASE=${{ github.event.pull_request.base.sha }}
          HEAD=${{ github.event.pull_request.head.sha }}
          git diff --name-only "$BASE"..."$HEAD" > "$RUNNER_TEMP/docs-changed-files"

      - name: Run docs-staleness
        id: staleness
        working-directory: sites/web/apps/docs
        run: |
          node scripts/docs-staleness.mjs < "$RUNNER_TEMP/docs-changed-files" > /tmp/staleness.json

      - name: Post staleness comment
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3
        with:
          script: |
            const staleness = JSON.parse(require('fs').readFileSync('/tmp/staleness.json', 'utf8'));
            const { affected } = staleness;

            const pr    = context.payload.pull_request.number;
            const owner = context.repo.owner;
            const repo  = context.repo.repo;
            const BOT_MARKER    = '<!-- docs-bot-v1 -->';
            const REVIEW_MARKER = '<!-- docs-bot-review-v1 -->';

            // ── Build comment body ───────────────────────────────────────────
            let body;
            if (affected.length === 0) {
              body = [
                BOT_MARKER,
                '## 📚 Docs Bot',
                '',
                '✅ No doc pages affected by this change.',
              ].join('\n');
            } else {
              const riskIcon = { high: '🔴', medium: '🟡', low: '🟢' };
              const rows = affected.map(a => {
                const icon  = riskIcon[a.stalenessRisk] ?? '🟡';
                const files = a.matchedFiles.slice(0, 3).map(f => `\`${f}\``).join(', ');
                const more  = a.matchedFiles.length > 3 ? ` +${a.matchedFiles.length - 3}` : '';
                return `| ${icon} | \`${a.slug}\` | [open](https://docs.kblabs.ru${a.docPath}) | ${files}${more} |`;
              }).join('\n');

              body = [
                BOT_MARKER,
                '<!-- docs-agent-review-queue:v1 -->',
                '## 📚 Docs Bot',
                '',
                `**${affected.length} doc page(s) are candidates for review.** Exact source references take precedence over broad ownership zones. Resolve each inline thread after updating the page or confirming it remains accurate.`,
                '',
                '| Risk | Doc page | Link | Changed files |',
                '|------|----------|------|---------------|',
                rows,
                '',
                '### Agent review queue',
                '',
                'For each entry, compare the changed source with the guide, update stale prose or examples, and leave an explicit no-change reason when the page remains accurate.',
                '',
                ...affected.map(a => {
                  const sourceRefs = a.sourceReferences?.length
                    ? `; generated references: ${a.sourceReferences.map(ref => `\`${ref}\``).join(', ')}`
                    : '';
                  const confidence = a.matchKind === 'exact' ? 'exact source link' : `ownership zone \`${a.matchedOwner}\``;
                  return `- **${a.slug}** (${confidence}) — review source files: ${a.matchedFiles.map(f => `\`${f}\``).join(', ')}${sourceRefs}`;
                }),
                '',
                `_[CONVENTIONS.md](https://github.com/${owner}/${repo}/blob/master/sites/web/apps/docs/CONVENTIONS.md)_`,
              ].join('\n');
            }

            // ── Fetch all issue comments once ────────────────────────────────
            const allComments = await github.rest.issues.listComments({ owner, repo, issue_number: pr, per_page: 100 });

            // ── Post or update main comment ──────────────────────────────────
            const existing = allComments.data.find(c => c.body?.includes(BOT_MARKER) && !c.body?.includes(REVIEW_MARKER));
            let summaryId;
            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
              summaryId = existing.id;
            } else {
              const created = await github.rest.issues.createComment({ owner, repo, issue_number: pr, body });
              summaryId = created.data.id;
            }

            if (affected.length === 0) return;

            // ── Clean up old bot inline threads + review bodies ──────────────
            const existingThreads = await github.rest.pulls.listReviewComments({ owner, repo, pull_number: pr, per_page: 100 });

            await Promise.all([
              ...existingThreads.data
                .filter(c => c.body?.includes(BOT_MARKER))
                .map(c => github.rest.pulls.deleteReviewComment({ owner, repo, comment_id: c.id }).catch(() => {})),
              ...allComments.data
                .filter(c => c.id !== summaryId && c.body?.includes(REVIEW_MARKER))
                .map(c => github.rest.issues.deleteComment({ owner, repo, comment_id: c.id }).catch(() => {})),
            ]);

            // ── Post inline threads (cap 5, highest risk first) ──────────────
            const MAX_INLINE = 5;
            const prFiles = await github.rest.pulls.listFiles({ owner, repo, pull_number: pr });
            const prFileSet = new Set(prFiles.data.map(f => f.filename));
            const threads = [];

            for (const page of affected.slice(0, MAX_INLINE)) {
              const targetFile = page.matchedFiles.find(f => prFileSet.has(f));
              if (!targetFile) continue;

              const prFile = prFiles.data.find(f => f.filename === targetFile);
              if (!prFile?.patch) continue;

              const patchLines = prFile.patch.split('\n');
              const position = Math.max(1, patchLines.reduce((last, line, idx) =>
                line.startsWith('+') ? idx : last, 1));

              threads.push({
                path: targetFile,
                position,
                body: [
                  `📚 **Check doc page:** [\`${page.slug}\`](https://docs.kblabs.ru${page.docPath})`,
                  '',
                  page.matchKind === 'exact'
                    ? `This page has an explicit generated reference to this source (${(page.sourceReferences ?? []).map(ref => `\`${ref}\``).join(', ')}). Verify related surrounding guidance, then resolve this thread.`
                    : `This file matches ownership zone \`${page.matchedOwner}\` (a review hint, not proof of a direct dependency). Verify whether the page is affected, then resolve this thread.`,
                  '',
                  `_Risk: **${page.stalenessRisk}** · [Edit](https://github.com/${owner}/${repo}/edit/master/sites/web/apps/docs/content/en/${page.slug}.mdx)_`,
                  BOT_MARKER,
                ].join('\n'),
              });
            }

            if (threads.length === 0) return;

            const hiddenCount = affected.length - threads.length;
            const hiddenNote = hiddenCount > 0 ? ` (+${hiddenCount} more in comment above)` : '';

            await github.rest.pulls.createReview({
              owner, repo, pull_number: pr,
              event: 'COMMENT',
              body: `${REVIEW_MARKER}\n📚 **${threads.length} doc page(s) to verify** — see inline threads.${hiddenNote}`,
              comments: threads,
            }).catch(err => {
              console.warn('Inline threads failed, comment already posted:', err.message);
            });

            console.log(`Staleness: ${affected.length} affected pages, ${threads.length} inline threads posted.`);
