name: Reusable — Playwright E2E suite

# Shared Playwright + Docker setup used by e2e-auth and e2e-oauth.
# Extracts the common phases:
#
#   Build toolchain → Install deps → Build packages → Build Studio →
#   Playwright install → Pack .tgz → Docker images → (idp-stub) →
#   Verdaccio → Publish → Studio volume → Start platform → (studio-https|studio) →
#   (/etc/hosts) → Run suite → Artifacts → Cleanup

on:
  workflow_call:
    inputs:
      checkout-ref:
        description: Immutable source revision for an asynchronous caller
        type: string
        default: ''
      suite:
        description: 'Suite name used in artifact names (auth or oauth)'
        type: string
        required: true
      compose-files:
        description: 'Colon-separated list of compose files (value of COMPOSE_FILE)'
        type: string
        required: true
      compose-project:
        description: 'COMPOSE_PROJECT_NAME — must be unique per concurrent run'
        type: string
        required: true
      run-command:
        description: 'Shell command to execute the test suite'
        type: string
        required: true
      report-dir:
        description: 'Playwright report output directory'
        type: string
        default: 'e2e/auth/report'
      artifact-prefix:
        description: 'Prefix for uploaded artifact names'
        type: string
        required: true
      studio:
        description: 'Build Studio SPA and populate the studio-dist volume'
        type: boolean
        default: true
      studio-https:
        description: 'Start studio-https container instead of plain studio nginx'
        type: boolean
        default: false
      idp:
        description: 'Build and start the oidc-idp stub container'
        type: boolean
        default: false
      hosts-entry:
        description: 'Line to append to /etc/hosts (empty = skip)'
        type: string
        default: ''
      cache-mode:
        description: 'read-write for fast PR lanes; off for authoritative lanes'
        type: string
        default: read-write
      prebuilt-artifact:
        description: 'Optional immutable E2E bundle from the prepare job; skips duplicate platform builds'
        type: string
        default: ''
      health-steps:
        description: 'Max 5-second polling iterations before failing platform startup'
        type: number
        default: 120

permissions:
  contents: read

jobs:
  e2e:
    name: E2E / ${{ inputs.suite }}
    # Playwright 1.59.1 does not yet support ubuntu-26.04, which is now
    # behind ubuntu-latest on GitHub-hosted runners. Keep browser runs on the
    # supported Ubuntu 24.04 image until Playwright adds 26.04 support.
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    env:
      COMPOSE_FILE: ${{ inputs.compose-files }}:e2e/docker-compose.platform.yml
      COMPOSE_PROJECT_NAME: ${{ inputs.compose-project }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.checkout-ref || github.sha }}
          persist-credentials: false
      - name: Verify checkout revision
        env:
          EXPECTED_SHA: ${{ inputs.checkout-ref }}
        run: |
          actual=$(git rev-parse HEAD)
          if [ -n "$EXPECTED_SHA" ]; then test "$actual" = "$EXPECTED_SHA"; fi
          echo "SOURCE_REVISION=$actual" >> "$GITHUB_ENV"

      # ── Build toolchain ──────────────────────────────────────────────────────

      - name: Set up Go
        if: inputs.prebuilt-artifact == ''
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          # kb-devkit builds every Go module in the workspace (including
          # kb-deploy/kb-monitor, which require go 1.26 as of #435), not just
          # kb-create — go-version-file only pins to one module's directive
          # and silently under-provisions the toolchain for the rest.
          go-version: '1.26.11'
          cache-dependency-path: |
            tools/kb-create/go.sum
            tools/kb-dev/go.sum
          cache: ${{ inputs.cache-mode == 'read-write' }}

      - name: Set up pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24'
          cache: ${{ inputs.cache-mode == 'read-write' && 'pnpm' || '' }}

      # The committed binaries in tools/ are macOS builds; rebuild for linux/amd64.
      - name: Build Go tools (kb-devkit, kb-dev)
        if: inputs.prebuilt-artifact == ''
        run: |
          (cd tools/kb-devkit && CGO_ENABLED=0 go build -o kb-devkit . && chmod +x kb-devkit)
          (cd tools/kb-dev    && CGO_ENABLED=0 go build -o kb-dev    . && chmod +x kb-dev)

      # ── Restore or build the immutable platform inputs ────────────────────────

      - name: Restore immutable prebuilt E2E bundle
        if: inputs.prebuilt-artifact != ''
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: ${{ inputs.prebuilt-artifact }}
          path: /tmp/e2e-prebuilt

      - name: Verify immutable E2E bundle source
        if: ${{ (inputs.prebuilt-artifact != '') && inputs.checkout-ref != '' }}
        env:
          EXPECTED_SHA: ${{ inputs.checkout-ref }}
        run: |
          jq -e --arg sha "$EXPECTED_SHA" '.source_sha == $sha' /tmp/e2e-prebuilt/e2e-bundle-metadata.json > /dev/null
          (cd /tmp/e2e-prebuilt && sha256sum -c e2e-bundle.sha256)
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"

      - name: Extract immutable prebuilt E2E bundle
        if: inputs.prebuilt-artifact != ''
        run: |
          tar xzf /tmp/e2e-prebuilt/e2e-files.tar.gz
          if [ -f /tmp/e2e-prebuilt/e2e-images.tar ]; then
            docker load --input /tmp/e2e-prebuilt/e2e-images.tar
          fi
          chmod +x tools/kb-devkit/kb-devkit tools/kb-dev/kb-dev

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Restore kb-devkit build cache
        if: inputs.prebuilt-artifact == ''
        uses: ./.github/actions/devkit-cas
        with:
          mode: ${{ (github.ref == 'refs/heads/master' || inputs.cache-mode == 'off') && 'off' || 'read-only' }}
          namespace: e2e-playwright

      - name: Build all packages
        if: inputs.prebuilt-artifact == ''
        run: |
          if [ "${{ inputs.cache-mode }}" = "off" ]; then
            ./tools/kb-devkit/kb-devkit run build --no-cache
          else
            pnpm build
          fi

      # ── Build Studio SPA (optional) ──────────────────────────────────────────

      - name: Build Studio
        if: inputs.studio == true && inputs.prebuilt-artifact == ''
        run: pnpm --filter @kb-labs/studio-app build

      # ── Install Playwright ───────────────────────────────────────────────────

      - name: Install Playwright browsers
        run: cd e2e/auth && pnpm exec playwright install chromium --with-deps

      # ── Pack + publish to Verdaccio ──────────────────────────────────────────

      - name: Pack @kb-labs/* packages
        if: inputs.prebuilt-artifact == ''
        run: bash e2e/scripts/pack-all.sh

      # ── Docker layer caching ─────────────────────────────────────────────────

      - name: Set up Docker Buildx
        if: inputs.prebuilt-artifact == '' || inputs.idp == true
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e

      - name: Install GoReleaser for candidate binaries
        if: inputs.prebuilt-artifact == ''
        uses: ./.github/actions/install-goreleaser
      - name: Prepare platform candidate binaries
        if: inputs.prebuilt-artifact == ''
        run: bash e2e/platform/prepare-container-binaries.sh

      - name: Build platform image
        if: inputs.prebuilt-artifact == ''
        run: |
          cache_args=()
          if [ "${{ inputs.cache-mode }}" = "read-write" ]; then
            cache_args=(--cache-from "type=gha,scope=e2e-platform" --cache-to "type=gha,mode=max,scope=e2e-platform")
          fi
          docker buildx build \
            "${cache_args[@]}" \
            --load \
            -t kb-e2e-ci-platform:latest \
            --build-arg "SOURCE_REVISION=$SOURCE_REVISION" -f e2e/platform/Dockerfile .

      - name: Build publisher image
        if: inputs.prebuilt-artifact == ''
        uses: ./.github/actions/build-publisher
        with:
          cache-from: ${{ inputs.cache-mode == 'read-write' && 'type=gha,scope=e2e-publisher' || '' }}
          cache-to: ${{ inputs.cache-mode == 'read-write' && 'type=gha,mode=max,scope=e2e-publisher' || '' }}

      # ── Build idp-stub image (optional) ──────────────────────────────────────

      - name: Build idp-stub image
        if: inputs.idp == true
        run: |
          cache_args=()
          if [ "${{ inputs.cache-mode }}" = "read-write" ]; then
            cache_args=(--cache-from "type=gha,scope=e2e-idp" --cache-to "type=gha,mode=max,scope=e2e-idp")
          fi
          docker buildx build \
            "${cache_args[@]}" \
            --load \
            -t kb-e2e-oidc-idp:latest \
            -f e2e/oidc-idp/Dockerfile \
            e2e/oidc-idp

      # ── Start Verdaccio + publish packages ───────────────────────────────────

      - name: Prepare Verdaccio storage permissions
        run: |
          mkdir -p e2e/.verdaccio-storage
          sudo chown -R 10001:65533 e2e/.verdaccio-storage

      - name: Start Verdaccio
        run: docker compose up -d verdaccio

      - name: Wait for Verdaccio to be healthy
        run: |
          for i in $(seq 1 30); do
            if docker compose ps verdaccio | grep -q "healthy"; then
              echo "Verdaccio healthy after $((i * 2))s"; break
            fi
            sleep 2
          done

      - name: Publish packages to Verdaccio
        if: inputs.prebuilt-artifact == ''
        run: docker compose run --rm publisher

      # ── Populate Studio dist volume (optional) ───────────────────────────────

      - name: Prepare Studio dist volume
        if: inputs.studio == true
        run: |
          docker volume create ${{ inputs.compose-project }}_studio-dist
          docker run --rm \
            -v "$(pwd)/studio/app/dist:/src:ro" \
            -v "${{ inputs.compose-project }}_studio-dist:/dest" \
            busybox sh -c "cp -r /src/. /dest/"

      # ── Start idp-stub (optional) ────────────────────────────────────────────

      - name: Start upstream OIDC IdP
        if: inputs.idp == true
        run: docker compose up -d --no-build idp-stub

      - name: Wait for idp-stub to be healthy
        if: inputs.idp == true
        run: |
          for i in $(seq 1 24); do
            if docker compose ps idp-stub | grep -q "healthy"; then
              echo "idp-stub healthy after $((i * 5))s"; break
            fi
            if [ "$i" -eq 24 ]; then
              echo "idp-stub failed to start — emitting allowlisted log summary"
              docker compose logs --no-color idp-stub 2>/dev/null | tail -c 1048576 | python3 e2e/scripts/summarize_safe_log.py --stdin --source idp-stub
              exit 1
            fi
            sleep 5
          done

      # ── Start platform ───────────────────────────────────────────────────────

      - name: Start platform
        run: docker compose up -d --no-build platform

      - name: Wait for gateway to be healthy
        run: |
          echo "Waiting for gateway (up to $(( ${{ inputs.health-steps }} * 5 / 60 )) min)..."
          for i in $(seq 1 ${{ inputs.health-steps }}); do
            if docker compose exec -T platform test -f /tmp/kb-e2e-ready && \
              curl -sf http://localhost:4000/health > /dev/null 2>&1; then
              echo "Gateway ready after $((i * 5))s"; break
            fi
            if [ "$i" = "${{ inputs.health-steps }}" ] ||
              [ -n "$(docker compose ps --all --status exited --quiet platform)" ]; then
              echo "Gateway failed to start — emitting allowlisted log summary"
              docker compose logs --no-color platform 2>/dev/null | tail -c 1048576 | python3 e2e/scripts/summarize_safe_log.py --stdin --source platform-startup
              exit 1
            fi
            sleep 5
          done

      # ── Start studio-https or plain studio nginx ─────────────────────────────

      - name: Start studio-https proxy
        if: inputs.studio-https == true
        run: docker compose up -d studio-https

      - name: Wait for studio-https to be healthy
        if: inputs.studio-https == true
        run: |
          for i in $(seq 1 20); do
            if docker compose ps studio-https | grep -q "healthy"; then
              echo "studio-https healthy after $((i * 3))s"; break
            fi
            if [ "$i" -eq 20 ]; then
              echo "studio-https failed to start — emitting allowlisted log summary"
              docker compose logs --no-color studio-https 2>/dev/null | tail -c 1048576 | python3 e2e/scripts/summarize_safe_log.py --stdin --source studio-https
              exit 1
            fi
            sleep 3
          done

      - name: Start Studio nginx proxy
        if: inputs.studio-https == false
        run: docker compose up -d studio

      - name: Wait for Studio nginx to be healthy
        if: inputs.studio-https == false
        run: |
          for i in $(seq 1 20); do
            if docker compose ps studio | grep -q "healthy"; then
              echo "Studio nginx healthy after $((i * 3))s"; break
            fi
            if [ "$i" -eq 20 ]; then
              echo "Studio nginx failed to start — emitting allowlisted log summary"
              docker compose logs --no-color studio 2>/dev/null | tail -c 1048576 | python3 e2e/scripts/summarize_safe_log.py --stdin --source studio
              exit 1
            fi
            sleep 3
          done

      # ── /etc/hosts entry (optional) ──────────────────────────────────────────

      - name: Add hosts entry
        if: inputs.hosts-entry != ''
        run: echo "${{ inputs.hosts-entry }}" | sudo tee -a /etc/hosts

      # ── Run test suite ───────────────────────────────────────────────────────

      - name: Run ${{ inputs.suite }} E2E tests
        run: ${{ inputs.run-command }}
        env:
          STUDIO_URL: http://localhost:4001
          GATEWAY_URL: http://localhost:4001
          OAUTH_STUDIO_URL: https://kb-cloud.kblabs.ru
          ADMIN_EMAIL: admin@kb-cloud.test
          ADMIN_PASSWORD: AdminPass123!
          TENANT_ID: kb-cloud
          AUTH_ACCESS_TTL_SEC: "5"
          AUTH_REFRESH_TTL_SEC: "15"
          AUTH_INVITE_TTL_MS: "604800000"
          CI: "true"
          KB_DEBUG: "true"

      # ── Artifacts ────────────────────────────────────────────────────────────

      - name: Project container diagnostics
        if: always()
        run: |
          mkdir -p /tmp/e2e-${{ inputs.suite }}-logs
          docker compose logs --no-color 2>/dev/null | tail -c 1048576 | python3 e2e/scripts/summarize_safe_log.py --stdin --source compose > "/tmp/e2e-${{ inputs.suite }}-logs/compose-log-summary.json" || true
          docker compose ps -a -q 2>/dev/null | xargs -r docker inspect 2>/dev/null | jq '[.[] | .State as $state | {state: {status: ($state.Status as $status | if (["created", "restarting", "running", "removing", "paused", "exited", "dead"] | index($status)) then $status else "unknown" end), running: ($state.Running == true), exitCode: (if (($state.ExitCode | type) == "number" and $state.ExitCode >= 0 and $state.ExitCode <= 255) then $state.ExitCode else null end), oomKilled: ($state.OOMKilled == true)}, restartCount: (if (.RestartCount | type) == "number" and .RestartCount >= 0 and .RestartCount <= 100000 then .RestartCount else 0 end)}] | {containerCount: length, runningCount: (map(select(.state.running == true)) | length), stoppedCount: (map(select(.state.running == false)) | length), oomKilledCount: (map(select(.state.oomKilled == true)) | length), restartCount: (map(.restartCount) | add // 0), exitCodes: (map(.state.exitCode | select(. != null)) | group_by(.) | map({code: .[0], count: length}))]' \
            > "/tmp/e2e-${{ inputs.suite }}-logs/compose-inspect-summary.json" 2>/dev/null || true
          docker stats --no-stream --all --format '{{json .}}' 2>/dev/null | python3 e2e/scripts/summarize-safe-resources.py \
            > "/tmp/e2e-${{ inputs.suite }}-logs/docker-stats-summary.json" || true
          docker compose exec -T platform python3 /workspace/e2e-host/scripts/summarize_safe_log.py --command status > "/tmp/e2e-${{ inputs.suite }}-logs/kb-create-status.json" 2>/dev/null || true
          docker compose exec -T platform python3 /workspace/e2e-host/scripts/summarize_safe_log.py --command doctor > "/tmp/e2e-${{ inputs.suite }}-logs/kb-create-doctor.json" 2>/dev/null || true
          for name in host.log host.jsonl launcher.log supervisor.log; do
            docker compose exec -T platform python3 /workspace/e2e-host/scripts/summarize_safe_log.py \
              --file "/workspace/kb-e2e/installer/host/$name" --source "$name" \
              > "/tmp/e2e-${{ inputs.suite }}-logs/$name.summary.json" 2>/dev/null || true
          done

      - name: Upload safe platform diagnostic summaries
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: e2e-${{ inputs.suite }}-platform-logs-${{ github.run_id }}
          path: /tmp/e2e-${{ inputs.suite }}-logs/
          retention-days: 14

      - name: Project E2E diagnostics onto allowlist
        if: always()
        env:
          E2E_REPORT_DIR: ${{ inputs.report-dir }}
          E2E_SUITE: ${{ inputs.suite }}
        run: python3 e2e/scripts/summarize-safe-e2e-diagnostics.py "$E2E_REPORT_DIR/diagnostics" > "/tmp/e2e-diagnostics-$E2E_SUITE-summary.json" || true

      - name: Project KB_DEBUG diagnostic snapshot
        if: always()
        env:
          E2E_SUITE: ${{ inputs.suite }}
        run: python3 e2e/scripts/summarize_safe_log.py --file /tmp/kb-e2e-diag.json --source kb-e2e-diag > "/tmp/kb-e2e-diag-$E2E_SUITE-summary.json" || true
      - name: Upload safe KB_DEBUG diagnostic summary
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: kb-e2e-diag-${{ github.run_id }}-${{ inputs.suite }}
          path: /tmp/kb-e2e-diag-${{ inputs.suite }}-summary.json
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: playwright-report-${{ inputs.artifact-prefix }}-${{ github.run_id }}
          path: |
            ${{ inputs.report-dir }}
            !${{ inputs.report-dir }}/diagnostics/**
          retention-days: 14

      - name: Upload E2E diagnostic dossiers
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: e2e-diagnostics-safe-${{ inputs.artifact-prefix }}-${{ github.run_id }}
          path: /tmp/e2e-diagnostics-${{ inputs.suite }}-summary.json
          if-no-files-found: ignore
          retention-days: 14

      # ── Cleanup ──────────────────────────────────────────────────────────────

      - name: Cleanup
        if: always()
        run: docker compose down --volumes --remove-orphans

      - name: Restore Verdaccio storage ownership for cache save
        if: always()
        run: |
          if [ -d e2e/.verdaccio-storage ]; then
            sudo chown -R "$(id -u):$(id -g)" e2e/.verdaccio-storage
          fi
