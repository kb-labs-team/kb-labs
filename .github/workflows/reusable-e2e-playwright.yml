name: Reusable — Playwright E2E suite

# Shared Playwright + Docker setup used by e2e-auth and e2e-oauth.
# Extracts the common phases:
#
#   Build toolchain → Install deps → Build packages → Build Studio →
#   Playwright install → Pack .tgz → Docker images → (idp-stub) →
#   Verdaccio → Publish → Studio volume → Start platform → (studio-https|studio) →
#   (/etc/hosts) → Run suite → Artifacts → Cleanup

on:
  workflow_call:
    inputs:
      suite:
        description: 'Suite name used in artifact names (auth or oauth)'
        type: string
        required: true
      compose-files:
        description: 'Colon-separated list of compose files (value of COMPOSE_FILE)'
        type: string
        required: true
      compose-project:
        description: 'COMPOSE_PROJECT_NAME — must be unique per concurrent run'
        type: string
        required: true
      run-command:
        description: 'Shell command to execute the test suite'
        type: string
        required: true
      report-dir:
        description: 'Playwright report output directory'
        type: string
        default: 'e2e/auth/report'
      artifact-prefix:
        description: 'Prefix for uploaded artifact names'
        type: string
        required: true
      studio:
        description: 'Build Studio SPA and populate the studio-dist volume'
        type: boolean
        default: true
      studio-https:
        description: 'Start studio-https container instead of plain studio nginx'
        type: boolean
        default: false
      idp:
        description: 'Build and start the oidc-idp stub container'
        type: boolean
        default: false
      hosts-entry:
        description: 'Line to append to /etc/hosts (empty = skip)'
        type: string
        default: ''
      cache-mode:
        description: 'read-write for fast PR lanes; off for authoritative lanes'
        type: string
        default: read-write
      prebuilt-artifact:
        description: 'Optional immutable E2E bundle from the prepare job; skips duplicate platform builds'
        type: string
        default: ''
      health-steps:
        description: 'Max 5-second polling iterations before failing platform startup'
        type: number
        default: 120

permissions:
  contents: read

jobs:
  e2e:
    name: E2E / ${{ inputs.suite }}
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      COMPOSE_FILE: ${{ inputs.compose-files }}
      COMPOSE_PROJECT_NAME: ${{ inputs.compose-project }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      # ── Build toolchain ──────────────────────────────────────────────────────

      - name: Set up Go
        if: inputs.prebuilt-artifact == ''
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          # kb-devkit builds every Go module in the workspace (including
          # kb-deploy/kb-monitor, which require go 1.26 as of #435), not just
          # kb-create — go-version-file only pins to one module's directive
          # and silently under-provisions the toolchain for the rest.
          go-version: '1.26.8'
          cache-dependency-path: |
            tools/kb-create/go.sum
            tools/kb-dev/go.sum
          cache: ${{ inputs.cache-mode == 'read-write' }}

      - name: Set up pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24'
          cache: ${{ inputs.cache-mode == 'read-write' && 'pnpm' || '' }}

      # The committed binaries in tools/ are macOS builds; rebuild for linux/amd64.
      - name: Build Go tools (kb-devkit, kb-dev)
        if: inputs.prebuilt-artifact == ''
        run: |
          (cd tools/kb-devkit && CGO_ENABLED=0 go build -o kb-devkit . && chmod +x kb-devkit)
          (cd tools/kb-dev    && CGO_ENABLED=0 go build -o kb-dev    . && chmod +x kb-dev)

      # ── Restore or build the immutable platform inputs ────────────────────────

      - name: Restore immutable prebuilt E2E bundle
        if: inputs.prebuilt-artifact != ''
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: ${{ inputs.prebuilt-artifact }}
          path: /tmp/e2e-prebuilt

      - name: Extract immutable prebuilt E2E bundle
        if: inputs.prebuilt-artifact != ''
        run: |
          tar xzf /tmp/e2e-prebuilt/e2e-files.tar.gz
          if [ -f /tmp/e2e-prebuilt/e2e-images.tar ]; then
            docker load --input /tmp/e2e-prebuilt/e2e-images.tar
          fi
          chmod +x tools/kb-devkit/kb-devkit tools/kb-dev/kb-dev

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Restore kb-devkit build cache
        if: inputs.prebuilt-artifact == ''
        uses: ./.github/actions/devkit-cas
        with:
          mode: ${{ inputs.cache-mode }}

      - name: Build all packages
        if: inputs.prebuilt-artifact == ''
        run: |
          if [ "${{ inputs.cache-mode }}" = "off" ]; then
            ./tools/kb-devkit/kb-devkit run build --no-cache
          else
            pnpm build
          fi

      # ── Build Studio SPA (optional) ──────────────────────────────────────────

      - name: Build Studio
        if: inputs.studio == true && inputs.prebuilt-artifact == ''
        run: pnpm --filter @kb-labs/studio-app build

      # ── Install Playwright ───────────────────────────────────────────────────

      - name: Install Playwright browsers
        run: cd e2e/auth && pnpm exec playwright install chromium --with-deps

      # ── Pack + publish to Verdaccio ──────────────────────────────────────────

      - name: Pack @kb-labs/* packages
        if: inputs.prebuilt-artifact == ''
        run: bash e2e/scripts/pack-all.sh

      # ── Docker layer caching ─────────────────────────────────────────────────

      - name: Set up Docker Buildx
        if: inputs.prebuilt-artifact == '' || inputs.idp == true
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e

      - name: Install GoReleaser for candidate binaries
        if: inputs.prebuilt-artifact == ''
        uses: ./.github/actions/install-goreleaser
      - name: Prepare platform candidate binaries
        if: inputs.prebuilt-artifact == ''
        run: bash e2e/platform/prepare-container-binaries.sh

      - name: Build platform image
        if: inputs.prebuilt-artifact == ''
        run: |
          cache_args=()
          if [ "${{ inputs.cache-mode }}" = "read-write" ]; then
            cache_args=(--cache-from "type=gha,scope=e2e-platform" --cache-to "type=gha,mode=max,scope=e2e-platform")
          fi
          docker buildx build \
            "${cache_args[@]}" \
            --load \
            -t kb-e2e-ci-platform:latest \
            --build-arg "SOURCE_REVISION=$GITHUB_SHA" -f e2e/platform/Dockerfile .

      - name: Build publisher image
        if: inputs.prebuilt-artifact == ''
        uses: ./.github/actions/build-publisher
        with:
          cache-from: ${{ inputs.cache-mode == 'read-write' && 'type=gha,scope=e2e-publisher' || '' }}
          cache-to: ${{ inputs.cache-mode == 'read-write' && 'type=gha,mode=max,scope=e2e-publisher' || '' }}

      # ── Build idp-stub image (optional) ──────────────────────────────────────

      - name: Build idp-stub image
        if: inputs.idp == true
        run: |
          cache_args=()
          if [ "${{ inputs.cache-mode }}" = "read-write" ]; then
            cache_args=(--cache-from "type=gha,scope=e2e-idp" --cache-to "type=gha,mode=max,scope=e2e-idp")
          fi
          docker buildx build \
            "${cache_args[@]}" \
            --load \
            -t kb-e2e-oidc-idp:latest \
            -f e2e/oidc-idp/Dockerfile \
            e2e/oidc-idp

      # ── Start Verdaccio + publish packages ───────────────────────────────────

      - name: Prepare Verdaccio storage permissions
        run: |
          mkdir -p e2e/.verdaccio-storage
          sudo chown -R 10001:65533 e2e/.verdaccio-storage

      - name: Start Verdaccio
        run: docker compose up -d verdaccio

      - name: Wait for Verdaccio to be healthy
        run: |
          for i in $(seq 1 30); do
            if docker compose ps verdaccio | grep -q "healthy"; then
              echo "Verdaccio healthy after $((i * 2))s"; break
            fi
            sleep 2
          done

      - name: Publish packages to Verdaccio
        if: inputs.prebuilt-artifact == ''
        run: docker compose run --rm publisher

      # ── Populate Studio dist volume (optional) ───────────────────────────────

      - name: Prepare Studio dist volume
        if: inputs.studio == true
        run: |
          docker volume create ${{ inputs.compose-project }}_studio-dist
          docker run --rm \
            -v "$(pwd)/studio/app/dist:/src:ro" \
            -v "${{ inputs.compose-project }}_studio-dist:/dest" \
            busybox sh -c "cp -r /src/. /dest/"

      # ── Start idp-stub (optional) ────────────────────────────────────────────

      - name: Start upstream OIDC IdP
        if: inputs.idp == true
        run: docker compose up -d --no-build idp-stub

      - name: Wait for idp-stub to be healthy
        if: inputs.idp == true
        run: |
          for i in $(seq 1 24); do
            if docker compose ps idp-stub | grep -q "healthy"; then
              echo "idp-stub healthy after $((i * 5))s"; break
            fi
            if [ "$i" -eq 24 ]; then
              echo "idp-stub failed to start — dumping logs"
              docker compose logs idp-stub | tail -100
              exit 1
            fi
            sleep 5
          done

      # ── Start platform ───────────────────────────────────────────────────────

      - name: Start platform
        run: docker compose up -d --no-build platform

      - name: Wait for gateway to be healthy
        run: |
          echo "Waiting for gateway (up to $(( ${{ inputs.health-steps }} * 5 / 60 )) min)..."
          for i in $(seq 1 ${{ inputs.health-steps }}); do
            if curl -sf http://localhost:4000/health > /dev/null 2>&1; then
              echo "Gateway ready after $((i * 5))s"; break
            fi
            if [ "$i" = "${{ inputs.health-steps }}" ]; then
              echo "Gateway failed to start — dumping logs"
              docker compose logs platform | tail -100
              exit 1
            fi
            sleep 5
          done

      # ── Start studio-https or plain studio nginx ─────────────────────────────

      - name: Start studio-https proxy
        if: inputs.studio-https == true
        run: docker compose up -d studio-https

      - name: Wait for studio-https to be healthy
        if: inputs.studio-https == true
        run: |
          for i in $(seq 1 20); do
            if docker compose ps studio-https | grep -q "healthy"; then
              echo "studio-https healthy after $((i * 3))s"; break
            fi
            if [ "$i" -eq 20 ]; then
              echo "studio-https failed to start — dumping logs"
              docker compose logs studio-https | tail -50
              exit 1
            fi
            sleep 3
          done

      - name: Start Studio nginx proxy
        if: inputs.studio-https == false
        run: docker compose up -d studio

      - name: Wait for Studio nginx to be healthy
        if: inputs.studio-https == false
        run: |
          for i in $(seq 1 20); do
            if docker compose ps studio | grep -q "healthy"; then
              echo "Studio nginx healthy after $((i * 3))s"; break
            fi
            if [ "$i" -eq 20 ]; then
              echo "Studio nginx failed to start — dumping logs"
              docker compose logs studio | tail -50
              exit 1
            fi
            sleep 3
          done

      # ── /etc/hosts entry (optional) ──────────────────────────────────────────

      - name: Add hosts entry
        if: inputs.hosts-entry != ''
        run: echo "${{ inputs.hosts-entry }}" | sudo tee -a /etc/hosts

      # ── Run test suite ───────────────────────────────────────────────────────

      - name: Run ${{ inputs.suite }} E2E tests
        run: ${{ inputs.run-command }}
        env:
          STUDIO_URL: http://localhost:4001
          GATEWAY_URL: http://localhost:4001
          OAUTH_STUDIO_URL: https://kb-cloud.kblabs.ru
          ADMIN_EMAIL: admin@kb-cloud.test
          ADMIN_PASSWORD: AdminPass123!
          TENANT_ID: kb-cloud
          AUTH_ACCESS_TTL_SEC: "5"
          AUTH_REFRESH_TTL_SEC: "15"
          AUTH_INVITE_TTL_MS: "604800000"
          CI: "true"
          KB_DEBUG: "true"

      # ── Artifacts ────────────────────────────────────────────────────────────

      - name: Dump container logs
        if: always()
        run: |
          mkdir -p /tmp/e2e-${{ inputs.suite }}-logs
          docker compose logs --no-color > /tmp/e2e-${{ inputs.suite }}-logs/all-services.log 2>&1 || true
          docker compose ps > /tmp/e2e-${{ inputs.suite }}-logs/ps.txt 2>&1 || true
          docker compose ps -a --format json > /tmp/e2e-${{ inputs.suite }}-logs/compose-ps.json 2>&1 || true
          docker compose ps -a -q | xargs -r docker inspect > /tmp/e2e-${{ inputs.suite }}-logs/compose-inspect.json 2>&1 || true
          docker stats --no-stream --all --format '{{json .}}' > /tmp/e2e-${{ inputs.suite }}-logs/docker-stats.jsonl 2>&1 || true
          docker compose exec -T platform sh -c 'kb-dev status --json' > /tmp/e2e-${{ inputs.suite }}-logs/kb-dev-status.json 2>&1 || true
          docker compose exec -T platform sh -c 'kb-dev diagnose --json' > /tmp/e2e-${{ inputs.suite }}-logs/kb-dev-diagnose.json 2>&1 || true
          for service in $(jq -r '.services // {} | keys[]' "/tmp/e2e-${{ inputs.suite }}-logs/kb-dev-status.json" 2>/dev/null || true); do
            docker compose exec -T platform sh -c "kb-dev logs $service --all" \
              > "/tmp/e2e-${{ inputs.suite }}-logs/$service.log" 2>&1 || true
          done
          while IFS=$'\t' read -r name url; do
            [ -n "$name" ] || continue
            curl -sS --max-time 5 "$url/metrics" > "/tmp/e2e-${{ inputs.suite }}-logs/$name.prom" 2>&1 || true
          done < <(jq -r '.services // {} | to_entries[] | select((.value.url // "") | startswith("http")) | [.key, .value.url] | @tsv' "/tmp/e2e-${{ inputs.suite }}-logs/kb-dev-status.json" 2>/dev/null || true)

      - name: Upload platform logs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: e2e-${{ inputs.suite }}-platform-logs-${{ github.run_id }}
          path: /tmp/e2e-${{ inputs.suite }}-logs/
          retention-days: 14

      - name: Upload KB_DEBUG diagnostic snapshot
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: kb-e2e-diag-${{ github.run_id }}-${{ inputs.suite }}
          path: /tmp/kb-e2e-diag.json
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: playwright-report-${{ inputs.artifact-prefix }}-${{ github.run_id }}
          path: ${{ inputs.report-dir }}
          retention-days: 14

      - name: Upload E2E diagnostic dossiers
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: e2e-diagnostics-${{ inputs.artifact-prefix }}-${{ github.run_id }}
          path: ${{ inputs.report-dir }}/diagnostics/
          if-no-files-found: ignore
          retention-days: 14

      # ── Cleanup ──────────────────────────────────────────────────────────────

      - name: Cleanup
        if: always()
        run: docker compose down --volumes --remove-orphans

      - name: Restore Verdaccio storage ownership for cache save
        if: always()
        run: |
          if [ -d e2e/.verdaccio-storage ]; then
            sudo chown -R "$(id -u):$(id -g)" e2e/.verdaccio-storage
          fi
