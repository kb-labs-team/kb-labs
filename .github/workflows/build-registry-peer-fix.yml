name: Build Registry SDK peer fix image

on:
  push:
    branches:
      - 'verify/registry-peer-fix-image'

permissions:
  actions: read
  contents: read

env:
  SOURCE_SHA: d708bdb8aa5d7be0513146fd935df59ac30dbc9e
  REGISTRY_IMAGE: ghcr.io/kb-labs-team/kb-marketplace-registry:d708bdb8aa5d7be0513146fd935df59ac30dbc9e
  STATE_IMAGE: ghcr.io/kb-labs-team/kb-state-daemon:7b8240395009fc3a055916bb4cef00c1821bf4b3

jobs:
  registry-image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ env.SOURCE_SHA }}

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86
        with:
          run_install: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
          cache: pnpm

      - name: Install workspace dependencies from cached pnpm store
        run: pnpm install --frozen-lockfile

      - name: Build only Registry and its workspace dependency closure
        run: pnpm --filter '@kb-labs/marketplace-registry-app...' build

      - name: Prepare Registry production tree and verify adapter imports
        run: |
          set -euo pipefail
          pnpm --filter @kb-labs/marketplace-registry-app --prod --config.inject-workspace-packages=true deploy .kb/deploy/marketplace-registry-app
          node tools/release/generate-platform-image-default.mjs
          cd .kb/deploy/marketplace-registry-app
          node --input-type=module -e "await import('@kb-labs/sdk'); await import('@kb-labs/adapters-fs'); await import('@kb-labs/adapters-state-broker'); await import('@kb-labs/marketplace-registry-core')"

      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e

      - name: Build Registry image for linux/amd64
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a
        with:
          context: .
          file: services/marketplace-registry/app/Dockerfile
          platforms: linux/amd64
          load: true
          tags: ${{ env.REGISTRY_IMAGE }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ env.SOURCE_SHA }}
            org.opencontainers.image.version=${{ env.SOURCE_SHA }}

      - name: Smoke Registry runtime imports
        run: >-
          docker run --rm --entrypoint node "$REGISTRY_IMAGE"
          --input-type=module -e "await import('@kb-labs/sdk'); await import('@kb-labs/adapters-fs'); await import('@kb-labs/adapters-state-broker'); await import('@kb-labs/marketplace-registry-core')"

      - name: Export Registry image with verified identity
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/registry-image"
          mkdir -p "$out"
          archive="$out/kb-marketplace-registry.tar.gz"
          image_id="$(docker image inspect --format '{{.Id}}' "$REGISTRY_IMAGE")"
          docker save "$REGISTRY_IMAGE" | gzip -1 > "$archive"
          gzip -t "$archive"
          manifest="$(tar -xOzf "$archive" manifest.json)"
          config_file="$(printf '%s' "$manifest" | jq -er '.[0].Config')"
          repo_tag="$(printf '%s' "$manifest" | jq -er --arg ref "$REGISTRY_IMAGE" '.[0].RepoTags[] | select(. == $ref)')"
          config_digest="sha256:$(tar -xOzf "$archive" "$config_file" | sha256sum | cut -d ' ' -f 1)"
          case "$config_file" in
            blobs/sha256/*) declared="sha256:${config_file##*/}" ;;
            *.json) declared="sha256:${config_file%.json}" ;;
            *) echo "Unsupported Docker archive config path: $config_file" >&2; exit 1 ;;
          esac
          test "$repo_tag" = "$REGISTRY_IMAGE"
          test "$config_digest" = "$declared"
          docker image rm "$REGISTRY_IMAGE" >/dev/null
          docker load --input "$archive" >/dev/null
          test "$(docker image inspect --format '{{.Id}}' "$REGISTRY_IMAGE")" = "$image_id"
          (cd "$out" && sha256sum kb-marketplace-registry.tar.gz > kb-marketplace-registry.tar.gz.sha256)
          archive_sha="$(sha256sum "$archive" | cut -d ' ' -f 1)"
          jq -n \
            --arg image "$REGISTRY_IMAGE" \
            --arg source_sha "$SOURCE_SHA" \
            --arg image_id "$image_id" \
            --arg config_digest "$config_digest" \
            --arg archive_sha "$archive_sha" \
            --arg run_id "$GITHUB_RUN_ID" \
            --arg run_url "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" \
            '{schemaVersion:1,image:$image,sourceSHA:$source_sha,platform:"linux/amd64",imageID:$image_id,configDigest:$config_digest,archiveSHA256:$archive_sha,runID:$run_id,runURL:$run_url}' \
            > "$out/kb-marketplace-registry.identity.json"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: kb-marketplace-registry-peer-fix-d708bdb8aa5d7be0513146fd935df59ac30dbc9e
          path: ${{ runner.temp }}/registry-image/
          if-no-files-found: error
          retention-days: 7

  verify-registry:
    needs: registry-image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ env.SOURCE_SHA }}

      - name: Download Registry image artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: kb-marketplace-registry-peer-fix-d708bdb8aa5d7be0513146fd935df59ac30dbc9e
          path: ${{ runner.temp }}/registry-artifact

      - name: Download already verified State image artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: kb-state-daemon-7b8240395009fc3a055916bb4cef00c1821bf4b3
          repository: kb-labs-team/kb-labs
          run-id: 45459847914
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/state-artifact

      - name: Verify archive identity and load images in a clean Docker daemon
        run: |
          set -euo pipefail
          verify_load() {
            local dir="$1" name="$2" ref="$3" source_sha="$4"
            cd "$dir"
            local archive="${name}.tar.gz" identity="${name}.identity.json"
            sha256sum -c "${archive}.sha256"
            test "$(jq -r '.image' "$identity")" = "$ref"
            test "$(jq -r '.sourceSHA' "$identity")" = "$source_sha"
            test "$(jq -r '.platform' "$identity")" = linux/amd64
            test "$(sha256sum "$archive" | cut -d ' ' -f 1)" = "$(jq -r '.archiveSHA256' "$identity")"
            local manifest config_file config_digest declared repo_tag
            manifest="$(tar -xOzf "$archive" manifest.json)"
            config_file="$(printf '%s' "$manifest" | jq -er '.[0].Config')"
            repo_tag="$(printf '%s' "$manifest" | jq -er --arg image "$ref" '.[0].RepoTags[] | select(. == $image)')"
            test "$repo_tag" = "$ref"
            config_digest="sha256:$(tar -xOzf "$archive" "$config_file" | sha256sum | cut -d ' ' -f 1)"
            case "$config_file" in
              blobs/sha256/*) declared="sha256:${config_file##*/}" ;;
              *.json) declared="sha256:${config_file%.json}" ;;
              *) echo "Unsupported Docker archive config path: $config_file" >&2; return 1 ;;
            esac
            test "$config_digest" = "$declared"
            test "$config_digest" = "$(jq -r '.configDigest' "$identity")"
            docker load --input "$archive" >/dev/null
            test "$(docker image inspect --format '{{.Id}}' "$ref")" = "$(jq -r '.imageID' "$identity")"
          }
          verify_load "$RUNNER_TEMP/registry-artifact" kb-marketplace-registry "$REGISTRY_IMAGE" "$SOURCE_SHA"
          verify_load "$RUNNER_TEMP/state-artifact" kb-state-daemon "$STATE_IMAGE" 7b8240395009fc3a055916bb4cef00c1821bf4b3

      - name: Start Registry with FS and StateBroker adapters, check /health
        run: |
          set -euo pipefail
          network='registry-peer-smoke'
          state='registry-peer-smoke-state'
          registry='registry-peer-smoke-registry'
          data='registry-peer-smoke-data'
          smoke_secret="$(openssl rand -hex 32)"
          signing_key="$(node --input-type=module -e "import { generateKeyPairSync } from 'node:crypto'; const { privateKey } = generateKeyPairSync('ed25519'); process.stdout.write(privateKey.export({ type: 'pkcs8', format: 'pem' }));")"
          cleanup() {
            docker rm -f "$registry" "$state" >/dev/null 2>&1 || true
            docker network rm "$network" >/dev/null 2>&1 || true
            docker volume rm "$data" >/dev/null 2>&1 || true
          }
          dump_diagnostics() {
            docker ps -a --no-trunc >&2 || true
            docker logs "$registry" >&2 || true
            docker logs "$state" >&2 || true
          }
          trap cleanup EXIT
          docker network create "$network" >/dev/null
          docker volume create "$data" >/dev/null
          docker run --detach --name "$state" --network "$network" --network-alias kb-state-daemon \
            --env KB_STATE_DAEMON_HOST=0.0.0.0 --env KB_STATE_DAEMON_PORT=7777 \
            --env KB_STATE_DAEMON_DATA_ROOT=/tmp/state-smoke "$STATE_IMAGE" >/dev/null
          docker run --detach --name "$registry" --network "$network" --publish 127.0.0.1:5071:5071/tcp \
            --volume "$data:/app/.kb/data" \
            --volume "$GITHUB_WORKSPACE/ops/marketplace-registry/registry.override.json:/app/.kb/kb.config.override.json:ro" \
            --env GATEWAY_INTERNAL_SECRET="$smoke_secret" --env KB_REGISTRY_HOST=0.0.0.0 \
            --env KB_REGISTRY_PORT=5071 --env KB_REGISTRY_URL=http://127.0.0.1:5071 \
            --env KB_STATE_DAEMON_URL=http://kb-state-daemon:7777 --env KB_REGISTRY_SIGNING_KEY="$signing_key" \
            "$REGISTRY_IMAGE" >/dev/null
          healthy=false
          for _ in $(seq 1 45); do
            if curl --fail --silent --header "x-internal-secret: $smoke_secret" \
              http://127.0.0.1:5071/health > "$RUNNER_TEMP/registry-health.json"; then
              healthy=true
              break
            fi
            sleep 1
          done
          if [ "$healthy" != true ]; then dump_diagnostics; exit 1; fi
          jq -e '.status == "ok" or .data.status == "ok"' "$RUNNER_TEMP/registry-health.json" >/dev/null
          docker exec "$registry" node --input-type=module -e "await import('@kb-labs/sdk'); await import('@kb-labs/adapters-fs'); await import('@kb-labs/adapters-state-broker')"
          docker exec "$registry" sh -c 'test -d /app/.kb/data/registry-storage'
