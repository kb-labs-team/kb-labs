name: Deploy

on:
  push:
    branches: [master]
    paths:
      - 'sites/web/**'
      - 'services/gateway/**'
      - 'services/marketplace-registry/**'
      - 'adapters/openai/**'
      - 'adapters/redis/**'
      - 'adapters/sqlite/**'
      - 'adapters/pino/**'
      - 'adapters/fs/**'
      - 'adapters/log-sqlite/**'
      - 'adapters/log-ringbuffer/**'
      - 'adapters/eventbus-cache/**'
      - 'core/**'
      - 'shared/**'
      - 'tools/kb-deploy/**'
      - '.kb/deploy.yaml'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:
    inputs:
      target:
        description: 'Target to deploy (leave empty for affected)'
        required: false
        default: ''
      rollback-sha:
        description: 'Git SHA to deploy instead of HEAD (leave empty for HEAD)'
        required: false
        default: ''

permissions:
  contents: read
  packages: write  # required for docker push to ghcr.io

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0  # full history for multi-commit push diff

      - name: Pin to rollback SHA
        if: inputs.rollback-sha != ''
        run: git checkout ${{ inputs.rollback-sha }}

      - name: Restore deploy state
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: .kb/deploy/state.json
          key: deploy-state-${{ github.ref_name }}-${{ github.sha }}
          restore-keys: |
            deploy-state-${{ github.ref_name }}-
            deploy-state-

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version: '1.26.8'
          cache-dependency-path: tools/kb-deploy/go.sum

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version: '1.26.8'
          cache-dependency-path: tools/kb-devkit/go.sum

      - name: Build kb-devkit
        run: go build -o kb-devkit .
        working-directory: tools/kb-devkit

      - name: Build kb-deploy
        run: make build
        working-directory: tools/kb-deploy

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: ./tools/kb-devkit/kb-devkit run build

      - name: Deploy gateway-app (pnpm deploy)
        run: pnpm deploy --filter @kb-labs/gateway-app --prod --legacy .kb/deploy/gateway-app

      - name: Deploy marketplace-registry-app (pnpm deploy)
        run: pnpm deploy --filter @kb-labs/marketplace-registry-app --prod --legacy .kb/deploy/marketplace-registry-app

      - name: Capture pre-deploy images (for rollback)
        id: pre_deploy
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_KEY: ${{ secrets.SSH_KEY }}
        run: |
          echo "$SSH_KEY" > /tmp/deploy_key && chmod 600 /tmp/deploy_key
          SSH="ssh -i /tmp/deploy_key -o StrictHostKeyChecking=no ${SSH_USER}@${SSH_HOST}"
          WEB=$($SSH         "docker inspect kb-labs-web                  --format '{{.Config.Image}}' 2>/dev/null || true")
          DOCS=$($SSH        "docker inspect kb-labs-docs                 --format '{{.Config.Image}}' 2>/dev/null || true")
          GATEWAY=$($SSH     "docker inspect kb-gateway                   --format '{{.Config.Image}}' 2>/dev/null || true")
          MARKETPLACE=$($SSH "docker inspect kb-marketplace-registry      --format '{{.Config.Image}}' 2>/dev/null || true")
          echo "web=${WEB}"               >> "$GITHUB_OUTPUT"
          echo "docs=${DOCS}"             >> "$GITHUB_OUTPUT"
          echo "gateway=${GATEWAY}"       >> "$GITHUB_OUTPUT"
          echo "marketplace=${MARKETPLACE}" >> "$GITHUB_OUTPUT"
          echo "Pre-deploy: web=${WEB} docs=${DOCS} gateway=${GATEWAY} marketplace=${MARKETPLACE}"
          rm -f /tmp/deploy_key

      - name: Login to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Deploy
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_KEY: ${{ secrets.SSH_KEY }}
          KB_DEPLOY_BASE_REF: ${{ github.event.before }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ -n "${{ inputs.target }}" ]; then
            ./tools/kb-deploy/kb-deploy run ${{ inputs.target }}
          else
            ./tools/kb-deploy/kb-deploy run
          fi

      - name: Show status
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_KEY: ${{ secrets.SSH_KEY }}
        run: ./tools/kb-deploy/kb-deploy status

      - name: Smoke test
        id: smoke
        continue-on-error: true
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_KEY: ${{ secrets.SSH_KEY }}
        run: |
          echo "$SSH_KEY" > /tmp/deploy_key && chmod 600 /tmp/deploy_key
          SSH="ssh -i /tmp/deploy_key -o StrictHostKeyChecking=no ${SSH_USER}@${SSH_HOST}"

          echo "Waiting 30s for containers to be ready..."
          sleep 30

          check() {
            local name=$1 url=$2
            for i in 1 2 3; do
              $SSH "curl -sf --max-time 10 '${url}' > /dev/null" \
                && echo "${name}: OK" && return 0
              echo "${name}: attempt ${i}/3 failed, retrying in 10s..."
              sleep 10
            done
            echo "::error::${name} smoke test failed — ${url} did not return 200"
            return 1
          }

          FAILED=0
          check "web"         "http://localhost:3000/"        || FAILED=1
          check "docs"        "http://localhost:3001/"        || FAILED=1
          check "gateway"     "http://localhost:4000/health"  || FAILED=1
          check "marketplace" "http://localhost:5071/health"  || FAILED=1
          rm -f /tmp/deploy_key
          exit $FAILED

      - name: Cleanup unused images on server
        if: steps.smoke.outcome == 'success'
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_KEY: ${{ secrets.SSH_KEY }}
        run: |
          echo "$SSH_KEY" > /tmp/deploy_key && chmod 600 /tmp/deploy_key
          ssh -i /tmp/deploy_key -o StrictHostKeyChecking=no "${SSH_USER}@${SSH_HOST}" \
            "docker image prune -af"
          rm -f /tmp/deploy_key

      - name: Rollback on smoke failure
        if: steps.smoke.outcome == 'failure'
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_KEY: ${{ secrets.SSH_KEY }}
          WEB_IMAGE:         ${{ steps.pre_deploy.outputs.web }}
          DOCS_IMAGE:        ${{ steps.pre_deploy.outputs.docs }}
          GATEWAY_IMAGE:     ${{ steps.pre_deploy.outputs.gateway }}
          MARKETPLACE_IMAGE: ${{ steps.pre_deploy.outputs.marketplace }}
        run: |
          echo "$SSH_KEY" > /tmp/deploy_key && chmod 600 /tmp/deploy_key
          SSH="ssh -i /tmp/deploy_key -o StrictHostKeyChecking=no ${SSH_USER}@${SSH_HOST}"

          rollback() {
            local container=$1 image=$2 port=$3
            if [ -z "$image" ]; then
              echo "No pre-deploy image for ${container}, skipping rollback"
              return
            fi
            echo "Rolling back ${container} → ${image}"
            $SSH "docker pull '${image}' \
              && docker stop '${container}' \
              && docker rm   '${container}' \
              && docker run -d \
                   --name '${container}' \
                   --restart unless-stopped \
                   -p '${port}:${port}' \
                   '${image}'"
          }

          rollback "kb-labs-web"             "$WEB_IMAGE"         3000
          rollback "kb-labs-docs"            "$DOCS_IMAGE"        3001
          rollback "kb-gateway"              "$GATEWAY_IMAGE"     4000
          rollback "kb-marketplace-registry" "$MARKETPLACE_IMAGE" 5071

          rm -f /tmp/deploy_key
          echo "::error::Smoke test failed — rolled back all services to pre-deploy images"
          exit 1

      - name: Save deploy state
        if: always()
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: .kb/deploy/state.json
          key: deploy-state-${{ github.ref_name }}-${{ github.sha }}
