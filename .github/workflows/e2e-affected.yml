name: Affected E2E

# CI(PR) calls this workflow with its affected plan. Manual dispatch remains
# available to maintainers for reruns and CI evidence replay.
on:
  workflow_call:
    inputs:
      generic-suites:
        description: JSON array of Docker suite names selected by CI(PR)
        required: true
        type: string
      has-auth:
        description: Whether the plan selected auth and OAuth suites
        required: true
        type: string
      checkout-ref:
        description: Exact source commit to test
        required: true
        type: string
  workflow_dispatch:
    inputs:
      pr-number:
        description: Pull request number to evaluate
        required: false
        type: string
      replay-run-id:
        description: Completed Actions run to replay into CI evidence (no E2E is started)
        required: false
        type: string
permissions:
  contents: read
  pull-requests: read

jobs:
  discover:
    if: >-
      github.event_name == 'workflow_call' ||
      (github.event_name == 'workflow_dispatch' && inputs.replay-run-id == '')
    runs-on: ubuntu-latest
    outputs:
      generic: ${{ github.event_name == 'workflow_call' && inputs.generic-suites || steps.matrix.outputs.generic }}
      has-auth: ${{ github.event_name == 'workflow_call' && inputs.has-auth || steps.matrix.outputs.has-auth }}
      pr-number: ${{ steps.pr.outputs.number }}
      checkout-ref: ${{ github.event_name == 'workflow_call' && inputs.checkout-ref || steps.pr.outputs.head }}
    steps:
      - name: Resolve pull request refs
        if: github.event_name != 'workflow_call'
        id: pr
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3
        env:
          INPUT_PR: ${{ inputs.pr-number }}
        with:
          script: |
            const number = process.env.INPUT_PR;
            if (!number) core.setFailed('Affected E2E requires a pull request run.');
            const { data: pr } = await github.rest.pulls.get({
              ...context.repo, pull_number: Number(number),
            });
            core.setOutput('number', String(pr.number));
            core.setOutput('base', pr.base.ref);
            core.setOutput('head', pr.head.sha);
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        if: github.event_name != 'workflow_call'
        with:
          ref: ${{ steps.pr.outputs.head }}
          fetch-depth: 0
      - name: Resolve affected E2E zones
        if: github.event_name != 'workflow_call'
        env:
          KB_DEVKIT_BASE_REF: origin/${{ steps.pr.outputs.base }}...HEAD
        run: |
          mkdir -p .ci
          node scripts/ci/resolve-e2e-zones.mjs \
            --base-ref "$KB_DEVKIT_BASE_REF" \
            --output .ci/e2e-test-plan.json \
            --markdown .ci/e2e-test-plan.md
          cat .ci/e2e-test-plan.md >> "$GITHUB_STEP_SUMMARY"
      - name: Create runner matrix
        if: github.event_name != 'workflow_call'
        id: matrix
        run: |
          generic=$(node -e '
            const plan = require("./.ci/e2e-test-plan.json");
            const suites = [...new Set(plan.selected
              .filter((zone) => zone.runner === "docker")
              .flatMap((zone) => zone.suites)
              .filter((suite) => !["e2e-auth", "e2e-oauth"].includes(suite))
              .map((suite) => suite.replace(/^e2e-/, "")))];
            process.stdout.write(JSON.stringify(suites));
          ')
          auth=$(node -e '
            const plan = require("./.ci/e2e-test-plan.json");
            process.stdout.write(String(plan.selected.some((zone) => zone.suites.includes("e2e-auth"))));
          ')
          echo "generic=$generic" >> "$GITHUB_OUTPUT"
          echo "has-auth=$auth" >> "$GITHUB_OUTPUT"

  docker-e2e:
    needs: discover
    if: needs.discover.outputs.generic != '[]'
    strategy:
      fail-fast: false
      matrix:
        suite: ${{ fromJSON(needs.discover.outputs.generic) }}
    uses: ./.github/workflows/reusable-e2e-docker.yml
    with:
      suite: ${{ matrix.suite }}
      checkout-ref: ${{ needs.discover.outputs.checkout-ref }}
      e2e-package: "@kb-labs/e2e-${{ matrix.suite }}"
      health-url: http://localhost:4000/ready
      health-steps: 60
      playwright-dir: e2e/plugins
      compose-project: kb-e2e-affected-${{ matrix.suite }}
      artifact-prefix: affected
      cache-mode: read-only
    permissions:
      contents: read

  replay-evidence:
    name: Replay CI evidence
    if: github.event_name == 'workflow_dispatch' && inputs.replay-run-id != ''
    uses: ./.github/workflows/reusable-ci-evidence.yml
    with:
      source-run-id: ${{ inputs.replay-run-id }}
      artifact-pattern: '*platform-logs*'
      artifact-name: ci-evidence-replay-${{ inputs.replay-run-id }}
    permissions:
      actions: read
      contents: read

  auth-e2e:
    needs: discover
    if: needs.discover.outputs.has-auth == 'true'
    uses: ./.github/workflows/reusable-e2e-playwright.yml
    with:
      suite: auth
      checkout-ref: ${{ needs.discover.outputs.checkout-ref }}
      compose-files: e2e/docker-compose.yml:e2e/docker-compose.ci.yml:e2e/docker-compose.auth-ci.yml
      compose-project: kb-e2e-affected-auth
      run-command: cd e2e/auth && pnpm e2e
      report-dir: e2e/auth/report
      artifact-prefix: affected-auth
      cache-mode: read-only
      studio: true
      studio-https: false
      idp: false
    permissions:
      contents: read

  oauth-e2e:
    needs: discover
    if: needs.discover.outputs.has-auth == 'true'
    uses: ./.github/workflows/reusable-e2e-playwright.yml
    with:
      suite: oauth
      checkout-ref: ${{ needs.discover.outputs.checkout-ref }}
      compose-files: e2e/docker-compose.yml:e2e/docker-compose.ci.yml:e2e/docker-compose.auth-ci.yml:e2e/docker-compose.oauth-ci.yml
      compose-project: kb-e2e-affected-oauth
      run-command: cd e2e/auth && pnpm e2e:oauth
      report-dir: e2e/auth/report-oauth
      artifact-prefix: affected-oauth
      cache-mode: read-only
      studio: true
      studio-https: true
      idp: true
      hosts-entry: "127.0.0.1 kb-cloud.kblabs.ru"
    permissions:
      contents: read

  evidence:
    name: CI evidence
    needs: [discover, docker-e2e, auth-e2e, oauth-e2e]
    if: always() && !(github.event_name == 'workflow_dispatch' && inputs.replay-run-id != '')
    uses: ./.github/workflows/reusable-ci-evidence.yml
    with:
      artifact-pattern: '*platform-logs-${{ github.run_id }}*'
      artifact-name: ci-evidence-${{ github.run_id }}
    permissions:
      actions: read
      contents: read
