name: Build platform service images

# Build the gateway, state daemon, and marketplace registry from verify branch
# commits. The immutable image tag is the exact source commit SHA. This workflow
# publishes images to GHCR but never deploys them to a server.
on:
  push:
    branches:
      - 'verify/registry-images-*'
    paths:
      - '**'
      - '!ops/**'
      - '!docs/**'

permissions:
  contents: read
  packages: write

concurrency:
  group: build-platform-service-images-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prepare:
    name: Prepare production trees (${{ github.sha }})
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ steps.revision.outputs.image_tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86
        with:
          run_install: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
          cache: pnpm
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version: '1.26.8'

      - name: Record immutable source tag
        id: revision
        run: echo "image_tag=$GITHUB_SHA" >> "$GITHUB_OUTPUT"

      - name: Build kb-devkit
        run: make build -C tools/kb-devkit

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build workspace
        run: pnpm build

      - name: Prepare production dependency trees
        run: |
          set -euo pipefail
          pnpm --filter @kb-labs/core-state-daemon --prod --config.inject-workspace-packages=true deploy .kb/deploy/state-daemon
          pnpm --filter @kb-labs/gateway-app --prod --config.inject-workspace-packages=true deploy .kb/deploy/gateway-app
          pnpm --filter @kb-labs/marketplace-registry-app --prod --config.inject-workspace-packages=true deploy .kb/deploy/marketplace-registry-app
          node tools/release/generate-platform-image-default.mjs

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: platform-service-image-inputs
          path: .kb/deploy/
          include-hidden-files: true
          retention-days: 1

  images:
    name: Build ${{ matrix.image }}
    needs: prepare
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: kb-state-daemon
            dockerfile: services/state/daemon/Dockerfile
          - image: kb-gateway
            dockerfile: services/gateway/app/Dockerfile
          - image: kb-marketplace-registry
            dockerfile: services/marketplace-registry/app/Dockerfile
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: platform-service-image-inputs
          path: .kb/deploy/

      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e

      - name: Build linux amd64 image
        id: build_image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64
          load: true
          tags: ghcr.io/kb-labs-team/${{ matrix.image }}:${{ needs.prepare.outputs.image_tag }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ needs.prepare.outputs.image_tag }}

      - name: Export image artifact with checksum and identity
        id: export_image
        env:
          IMAGE_NAME: ${{ matrix.image }}
          IMAGE_REF: ghcr.io/kb-labs-team/${{ matrix.image }}:${{ needs.prepare.outputs.image_tag }}
          SOURCE_SHA: ${{ needs.prepare.outputs.image_tag }}
        run: |
          set -euo pipefail
          out="${RUNNER_TEMP}/image-export"
          mkdir -p "$out"
          docker save "$IMAGE_REF" | gzip -1 > "$out/${IMAGE_NAME}.tar.gz"
          gzip -t "$out/${IMAGE_NAME}.tar.gz"
          image_id="$(docker image inspect --format '{{.Id}}' "$IMAGE_REF")"
          manifest="$(tar -xOzf "$out/${IMAGE_NAME}.tar.gz" manifest.json)"
          config_file="$(printf '%s' "$manifest" | jq -er '.[0].Config')"
          repo_tag="$(printf '%s' "$manifest" | jq -er --arg ref "$IMAGE_REF" '.[0].RepoTags[] | select(. == $ref)')"
          test "$repo_tag" = "$IMAGE_REF"
          test "$config_file" = "${image_id#sha256:}.json"
          (cd "$out" && sha256sum "${IMAGE_NAME}.tar.gz" > "${IMAGE_NAME}.tar.gz.sha256")
          archive_sha256="$(sha256sum "$out/${IMAGE_NAME}.tar.gz" | cut -d ' ' -f 1)"
          echo "image_id=$image_id" >> "$GITHUB_OUTPUT"
          echo "archive_sha256=$archive_sha256" >> "$GITHUB_OUTPUT"

      - name: Login to GHCR
        id: ghcr_login
        continue-on-error: true
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push image to GHCR
        id: ghcr_push
        if: steps.ghcr_login.outcome == 'success'
        continue-on-error: true
        env:
          IMAGE_REF: ghcr.io/kb-labs-team/${{ matrix.image }}:${{ needs.prepare.outputs.image_tag }}
        run: |
          set -euo pipefail
          push_output="$(docker push "$IMAGE_REF" 2>&1)" || { printf '%s\n' "$push_output"; exit 1; }
          printf '%s\n' "$push_output"
          digest="$(printf '%s\n' "$push_output" | sed -nE 's/.*digest: (sha256:[0-9a-f]+).*/\1/p' | tail -1)"
          test -n "$digest"
          echo "digest=$digest" >> "$GITHUB_OUTPUT"

      - name: Finalize image identity
        env:
          IMAGE_NAME: ${{ matrix.image }}
          IMAGE_REF: ghcr.io/kb-labs-team/${{ matrix.image }}:${{ needs.prepare.outputs.image_tag }}
          SOURCE_SHA: ${{ needs.prepare.outputs.image_tag }}
          IMAGE_ID: ${{ steps.export_image.outputs.image_id }}
          ARCHIVE_SHA256: ${{ steps.export_image.outputs.archive_sha256 }}
          GHCR_DIGEST: ${{ steps.ghcr_push.outputs.digest }}
          GHCR_LOGIN_OUTCOME: ${{ steps.ghcr_login.outcome }}
          GHCR_PUSH_OUTCOME: ${{ steps.ghcr_push.outcome }}
        run: |
          set -euo pipefail
          out="${RUNNER_TEMP}/image-export"
          registry_status=artifact-only
          if [ "$GHCR_LOGIN_OUTCOME" = success ] && [ "$GHCR_PUSH_OUTCOME" = success ]; then
            registry_status=published
          fi
          jq -n \
            --arg image "$IMAGE_REF" \
            --arg source_sha "$SOURCE_SHA" \
            --arg platform "linux/amd64" \
            --arg image_id "$IMAGE_ID" \
            --arg archive_sha256 "$ARCHIVE_SHA256" \
            --arg registry_status "$registry_status" \
            --arg registry_digest "$GHCR_DIGEST" \
            --arg run_id "$GITHUB_RUN_ID" \
            --arg run_attempt "$GITHUB_RUN_ATTEMPT" \
            --arg workflow_ref "$GITHUB_WORKFLOW_REF" \
            --arg run_url "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" \
            '{schemaVersion:1, image:$image, sourceSHA:$source_sha, platform:$platform, imageID:$image_id, archiveSHA256:$archive_sha256, registryStatus:$registry_status, registryDigest:$registry_digest, runID:$run_id, runAttempt:$run_attempt, workflowRef:$workflow_ref, runURL:$run_url}' \
            > "$out/${IMAGE_NAME}.identity.json"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: ${{ matrix.image }}-${{ needs.prepare.outputs.image_tag }}
          path: ${{ runner.temp }}/image-export/
          if-no-files-found: error
          retention-days: 7

      - name: Report GHCR publish status
        if: steps.ghcr_login.outcome == 'failure' || steps.ghcr_push.outcome == 'failure'
        run: echo '::warning::GHCR publish failed; SHA-tagged image artifact is available for verified transfer.'
