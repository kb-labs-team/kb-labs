name: CI (PR)

on:
  pull_request:
    # A maintainer can request the expensive full regression by adding
    # `full-ci`; removing it returns the PR to the affected-only lane.
    types: [opened, synchronize, reopened, labeled, unlabeled]

permissions:
  # e2e-platform publishes flaky-history to the ci-data branch. Jobs below
  # explicitly narrow this back to read unless they need that write access.
  contents: write

concurrency:
  group: ci-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

# Diff base: PR base branch (e.g. origin/main...HEAD)
env:
  KB_DEVKIT_BASE_REF: >-
    ${{ format('origin/{0}...HEAD', github.event.pull_request.base.ref) }}

jobs:
  # ── 0. Preflight — gates everything else (~30s) ────────────────────────────
  preflight:
    name: Preflight
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86
        with: { run_install: false }
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Check Single Version Policy (versions + format)
        run: pnpm deps:lint

  # ── 0a. Resolve E2E ownership from the complete PR diff ──────────────────
  # The same JSON plan drives the selective E2E jobs below.
  e2e-test-plan:
    name: E2E test plan
    runs-on: ubuntu-latest
    needs: preflight
    outputs:
      launcher_changed: ${{ steps.resolve-zones.outputs.launcher_changed }}
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - name: Resolve zones from the complete PR diff
        id: resolve-zones
        run: |
          mkdir -p .ci
          node scripts/ci/resolve-e2e-zones.mjs \
            --base-ref "$KB_DEVKIT_BASE_REF" \
            --output .ci/e2e-test-plan.json \
            --markdown .ci/e2e-test-plan.md
          cat .ci/e2e-test-plan.md >> "$GITHUB_STEP_SUMMARY"
          if git diff --name-only "$KB_DEVKIT_BASE_REF" | grep -qE '^(tools/kb-create/|tools/kb-dev/)'; then
            echo "launcher_changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "launcher_changed=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Update PR test-plan comment
        # Fork PR tokens cannot write comments; their plan remains available in
        # the job summary and artifact.
        if: github.event.pull_request.head.repo.fork == false
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3
        with:
          script: |
            const fs = require('fs');
            const marker = '<!-- kb-ci-test-plan -->';
            const body = fs.readFileSync('.ci/e2e-test-plan.md', 'utf8');
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner, repo, issue_number, per_page: 100,
            });
            const existing = comments.find((comment) => comment.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: e2e-test-plan
          path: .ci/e2e-test-plan.json
          retention-days: 14

  # ── 0b. kb-create V2 contract matrix — no registry, Docker or shared HOME ─
  # These are the public launcher contract shards. Each shard
  # owns one V2 contract and only deterministic fixtures, making configuration
  # and recovery failures fast, diagnosable PR feedback.
  launcher-v2-contracts:
    name: kb-create V2 / ${{ matrix.shard }}
    runs-on: ubuntu-latest
    needs: e2e-test-plan
    if: needs.e2e-test-plan.outputs.launcher_changed == 'true'
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - shard: resolver-config
            packages: ./v2/catalog ./v2/cmd/kb-create-v2 ./v2/cmd/kb-create-release-index ./v2/contracts ./v2/flow ./v2/preflight ./v2/release ./v2/resolve ./v2/render ./v2/scenario ./v2/secrets ./v2/telemetry ./v2/transport ./v2/wizard
          - shard: runtime-recovery
            packages: ./v2/artifacts ./v2/logs ./v2/receipt ./v2/lifecycle ./v2/runtime
          - shard: doctor-diagnostics
            packages: ./v2/doctor ./v2/diagnostics ./v2/installed
          - shard: offline-journey
            packages: ./v2/journey ./v2/services ./v2/verify
    permissions:
      contents: read
    defaults:
      run:
        working-directory: tools/kb-create
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version: '1.26.8'
          cache-dependency-path: tools/kb-create/go.sum
      - name: Enforce autonomous V2 boundary
        run: |
          if go list -deps ${{ matrix.packages }} | grep -q '^github.com/kb-labs/create/internal/'; then
            echo 'V2 must not import legacy launcher internals.' >&2
            exit 1
          fi
      - name: Run deterministic V2 contract shard
        run: go test -race -count=1 ${{ matrix.packages }}

  # ── 1. Build Go tools ──────────────────────────────────────────────────────
  build-tools:
    name: Build Go tools
    needs: preflight
    uses: ./.github/workflows/build-go-tools.yml
    permissions:
      contents: read

  # ── 2. Build TS packages in the complete PR diff closure ───────────────────
  build:
    name: Build TS (affected)
    runs-on: ubuntu-latest
    needs: [preflight, build-tools]
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86
        with: { run_install: false }
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
          cache: pnpm
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: go-tools
          path: tools-bin/
      - name: Install Go tools
        run: |
          chmod +x tools-bin/*
          cp tools-bin/kb-devkit tools/kb-devkit/kb-devkit
          cp tools-bin/kb-dev    tools/kb-dev/kb-dev
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build (affected dependency closure)
        # GitHub runners start with an empty .kb/devkit state. Without
        # --diff-only every package is classified as "dirty", defeating the
        # affected graph and rebuilding the full workspace on every PR.
        run: ./tools/kb-devkit/kb-devkit run build --affected --diff-only
      - name: Pack dist artifacts
        run: find . -path "*/dist" -not -path "*/node_modules/*" -type d | tar cf dist-artifacts.tar -T -
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: dist
          path: dist-artifacts.tar
          retention-days: 1
          compression-level: 3

  # ── 3. Lint / Type-check — affected packages only ──────────────────────────
  checks:
    name: ${{ matrix.task }}
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: read
    strategy:
      fail-fast: true
      matrix:
        task: [lint, type-check]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86
        with: { run_install: false }
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
          cache: pnpm
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version: '1.26.8'
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: go-tools
          path: tools-bin/
      - name: Install Go tools
        run: |
          chmod +x tools-bin/*
          cp tools-bin/kb-devkit tools/kb-devkit/kb-devkit
          cp tools-bin/kb-dev    tools/kb-dev/kb-dev
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: dist
      - run: tar xf dist-artifacts.tar
      - run: pnpm install --frozen-lockfile
      - name: Run ${{ matrix.task }} on affected packages
        run: ./tools/kb-devkit/kb-devkit run ${{ matrix.task }} --affected --diff-only

  # The affected graph deliberately keeps PR feedback fast, but cannot cover
  # a regression in an otherwise-unaffected package. This remains much cheaper
  # than E2E and matches main's unit-test scope and Node runtime.
  full-unit-tests:
    name: test (full)
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86
        with: { run_install: false }
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
          cache: pnpm
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version: '1.26.8'
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: go-tools
          path: tools-bin/
      - name: Install Go tools
        run: |
          chmod +x tools-bin/*
          cp tools-bin/kb-devkit tools/kb-devkit/kb-devkit
          cp tools-bin/kb-dev tools/kb-dev/kb-dev
      - run: pnpm install --frozen-lockfile
      # `test` resolves workspace packages through their built exports. The
      # build artifact above contains only affected packages, which is enough
      # for fast checks but not for this deliberately full unit-test gate. Keep
      # the dependency-order build cacheable so the gate is reproducible
      # without turning every PR into an unbounded cold rebuild.
      - name: Build complete workspace for unit resolution
        env:
          # Studio Module Federation DTS workers are a development convenience
          # and can hang indefinitely when several rspack builds overlap. Unit
          # resolution needs built JS, not those background DTS workers.
          NODE_ENV: production
        run: ./tools/kb-devkit/kb-devkit run build
      - name: Run all unit tests
        run: ./tools/kb-devkit/kb-devkit run test --no-cache
      - name: Run all CLI handler tests
        run: ./tools/kb-devkit/kb-devkit run test:cli --no-cache

  # ── 4. Workspace checks — devkit structure, deps and boundaries ────────────
  devkit-checks:
    name: Devkit checks
    runs-on: ubuntu-latest
    needs: [build-tools, build, e2e-test-plan]
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          # KB_DEVKIT_BASE_REF (origin/<base>...HEAD) must resolve: the affected-aware
          # manifest-command-naming lint diffs against it.
          fetch-depth: 0
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86
        with: { run_install: false }
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
          cache: pnpm
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: go-tools
          path: tools-bin/
      - name: Install kb-devkit
        run: |
          chmod +x tools-bin/kb-devkit
          cp tools-bin/kb-devkit tools/kb-devkit/kb-devkit
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: dist
      - run: tar xf dist-artifacts.tar
      - run: pnpm install --frozen-lockfile
      - name: Build the base this job always needs
        # The dist/ artifact from "Build TS (affected)" only contains packages
        # actually affected by this PR's diff. `pnpm kb workflow lint` below
        # is unconditional — every PR runs it — but its two dependencies are
        # loaded dynamically (cli/bin resolves its own command surface at
        # runtime; workflow-entry supplies the `workflow lint` command itself
        # via plugin-manifest discovery, not a static import), so neither is
        # reliably part of the affected closure. Build exactly this job's
        # fixed requirement here; everything else stays affected-only.
        run: ./tools/kb-devkit/kb-devkit run build --packages @kb-labs/sdk,@kb-labs/cli-bin,@kb-labs/workflow-entry
      - name: Validate workflow definitions and local step scripts
        run: |
          node .kb/workflows/scripts/check-local-script-references.mjs
          pnpm kb workflow lint --path .kb/workflows --strict
      - name: Devkit workspace checks (structure, dependencies, boundaries)
        run: ./tools/kb-devkit/kb-devkit check

  ci-evidence:
    name: CI evidence
    needs: [preflight, e2e-test-plan, launcher-v2-contracts, build-tools, build, checks, full-unit-tests, devkit-checks, launcher-e2e]
    if: always()
    uses: ./.github/workflows/reusable-ci-evidence.yml
    permissions:
      actions: read
      contents: read

  # ── 5. kb-create e2e — only if launcher or kb-dev sources changed ──────────
  #
  # Runs the Go e2e suite for kb-create against a local Verdaccio instance
  # populated from this PR's built packages — the correct pre-publish cycle.
  # Also covers tools/kb-dev: the suite installs a real platform and drives
  # kb-dev's register/switch/projects commands against it.
  #
  # Setup order:
  #   build → pack .tgz → start Verdaccio (Docker, port 4873) →
  #   publish → run Go e2e tests with KB_REGISTRY_URL=http://localhost:4873
  #
  # KB_REGISTRY_URL is read by kb-create's pm.Detect() and passed to pnpm as
  # --registry, so all pnpm install calls in the tests point to Verdaccio.
  # NPM_CONFIG_REGISTRY is intentionally NOT set: pm.Detect() only falls back
  # to KB_REGISTRY_URL when NPM_CONFIG_REGISTRY is absent.
  launcher-e2e:
    name: kb-create e2e / ${{ matrix.shard }}
    runs-on: ubuntu-latest
    needs: [build-tools, build, e2e-test-plan]
    if: needs.e2e-test-plan.outputs.launcher_changed == 'true'
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        shard:
          - core-a
          - core-b
          - journeys
          - lifecycle
    permissions:
      contents: read

    env:
      COMPOSE_FILE: e2e/docker-compose.yml:e2e/docker-compose.ci.yml:e2e/docker-compose.ci-launcher.yml
      COMPOSE_PROJECT_NAME: kb-e2e-launcher
      # The PR Verdaccio contains this checkout, not necessarily the public
      # stable release referenced by the remote installer manifest.
      KB_CREATE_OFFLINE: "1"

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86
        with: { run_install: false }

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
          cache: pnpm

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version: '1.26.8'

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: go-tools
          path: tools-bin/

      - name: Install Go tools
        run: |
          chmod +x tools-bin/*
          cp tools-bin/kb-devkit tools/kb-devkit/kb-devkit
          cp tools-bin/kb-dev    tools/kb-dev/kb-dev

      - name: Download E2E test plan
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: e2e-test-plan
          path: .ci

      - name: Apply E2E zone gate
        id: gate-result
        run: |
          set -euo pipefail
          if node -e '
            const plan = require("./.ci/e2e-test-plan.json");
            process.exit(plan.selected.some((zone) => zone.runner === "launcher") ? 0 : 1);
          '; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

      # All steps below are gated — skip the expensive Verdaccio setup when
      # neither kb-create nor kb-dev sources changed.

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        if: steps.gate-result.outputs.run == 'true'
        with:
          name: dist

      - name: Extract dist artifacts
        if: steps.gate-result.outputs.run == 'true'
        run: tar xf dist-artifacts.tar

      - name: Install dependencies
        if: steps.gate-result.outputs.run == 'true'
        run: pnpm install --frozen-lockfile

      # ── Pack packages for Verdaccio ──────────────────────────────────────

      - name: Pack @kb-labs/* packages
        if: steps.gate-result.outputs.run == 'true'
        run: bash e2e/scripts/pack-all.sh

      # ── Start Verdaccio ──────────────────────────────────────────────────
      # docker-compose.ci-launcher.yml adds ports: ["4873:4873"] so the Go
      # tests running on the host can reach http://localhost:4873.

      - name: Set up Docker Buildx
        if: steps.gate-result.outputs.run == 'true'
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e

      - name: Build publisher image
        if: steps.gate-result.outputs.run == 'true'
        run: |
          docker buildx build \
            --cache-from "type=gha,scope=e2e-publisher" \
            --cache-to "type=gha,mode=max,scope=e2e-publisher" \
            --load \
            -t kb-e2e-ci-publisher:latest \
            -f e2e/publisher/Dockerfile \
            e2e/

      - name: Prepare Verdaccio storage permissions
        if: steps.gate-result.outputs.run == 'true'
        run: |
          mkdir -p e2e/.verdaccio-storage
          sudo chown -R 10001:65533 e2e/.verdaccio-storage

      - name: Start Verdaccio
        if: steps.gate-result.outputs.run == 'true'
        run: docker compose up -d verdaccio

      - name: Wait for Verdaccio to be healthy
        if: steps.gate-result.outputs.run == 'true'
        run: |
          for i in $(seq 1 30); do
            if docker compose ps verdaccio | grep -q "healthy"; then
              echo "Verdaccio healthy after $((i * 2))s"; break
            fi
            sleep 2
          done

      - name: Publish packages to Verdaccio
        if: steps.gate-result.outputs.run == 'true'
        run: docker compose run --rm publisher

      # ── Run kb-create Go e2e tests ───────────────────────────────────────
      # The V2 release-index path and registry are explicit operation inputs.

      - name: Run kb-create e2e via devkit
        if: steps.gate-result.outputs.run == 'true'
        run: cd tools/kb-create && go test -v -race -count=1 ./v2/e2e/...
        env:
          KB_REGISTRY_URL: http://localhost:4873
          GITHUB_TOKEN: ${{ github.token }}
          E2E_RUN: >-
            ${{ matrix.shard == 'core-a' && '^Test(DeclarativeEngineScenarioDiscoveryInspectPlanAndPlanOnlyApply|Help|Version|SubcommandHelp|StatusMissingPlatform|DoctorNoArgs|InstallYes|FirstCommitNoChanges|FirstCommitPromptShown|Update|ReinstallIdempotent|LogsCommand|KbCliSmoke|ServicesStartStop|LLMFlagRemoved|NoLLMByDefault|DefaultKeepsAuthOn|LocalModeWritesAuthOff)$' || matrix.shard == 'core-b' && '^Test(NoPeerDepWarnings|PlatformFilesGenerated|GitignoreEntries|DemoReviewSkipsUntrackedOnly|DemoHintShownAfterZeroFindings|KbConfigShowSplitRoot|GeneratedWorkflowsUseWorkflowIdFlag|GeneratedDemoWorkflowUsesRealCommands|DemoFlagDoesNotChangeInstalledPackages|DoctorDockerCheckIsAdvisoryNotFatal|InstallScopedPlugin|InstallUnknownPluginFailsFast)$' || matrix.shard == 'journeys' && '^Test(TwoProjectsShareOnePlatformIsolated|NoPlaceholderValuesInGeneratedConfigs|SoloDeveloperJourney|LegacyProjectMigrationJourney|CIInstallJourney_PinnedPluginsServicesAndAdapters|CIInstallJourney_UnconfiguredRequiredCapabilityWarns|CIInstallJourney_ExecutesInstalledPlugin|PlatformUpdateAndUninstallPreservesUserArtifacts|AdapterSwitchJourney|KbDevRegistrySwitch_MultiProjectSharedPlatform)$' || '^Test(Lifecycle_InstallSwapRollback|PlatformDirMkdirFailsHardAbort|UninstallRetryThenHardFail)$' }}
          # Unlimited failure output — kb-devkit's default 50-line truncation
          # hides exactly the per-service LogsTail/state detail needed to
          # diagnose a failure here, and this job has no log-upload step
          # (unlike ci.yml's equivalent) to fall back on.
          KB_DEVKIT_FAIL_LINES: "0"

      # ── Cleanup ──────────────────────────────────────────────────────────

      - name: Stop Verdaccio
        if: always() && steps.gate-result.outputs.run == 'true'
        run: docker compose down --volumes --remove-orphans || true

      - name: Restore Verdaccio storage ownership for cache save
        if: always() && steps.gate-result.outputs.run == 'true'
        run: |
          if [ -d e2e/.verdaccio-storage ]; then
            sudo chown -R "$(id -u):$(id -g)" e2e/.verdaccio-storage
          fi

      - name: Skipped
        if: steps.gate-result.outputs.run != 'true'
        run: echo "kb-create e2e skipped (no kb-create changes in this PR)"

  # ── Full E2E — opt in per PR; always runs after a successful main CI ──────

  e2e-platform:
    if: contains(github.event.pull_request.labels.*.name, 'full-ci')
    needs: [build]
    uses: ./.github/workflows/e2e-platform.yml
    permissions:
      # flaky-history (added in e2e-platform.yml) pushes to the ci-data
      # branch and needs write; a caller can't grant a reusable workflow
      # more than it itself holds, and under-granting here causes the
      # entire run to fail at startup (0 jobs) before anything executes.
      contents: write
      actions: read
