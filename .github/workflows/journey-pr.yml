name: PR Journey delta

on:
  pull_request:
    branches: [master]

permissions:
  contents: read

defaults:
  run:
    shell: bash

concurrency:
  group: journey-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  BASE_SHA: ${{ github.event.pull_request.base.sha }}
  CANDIDATE_SHA: ${{ github.sha }}

jobs:
  plan:
    name: Select affected Journey claims
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      claims: ${{ steps.plan.outputs.claims }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 2
          persist-credentials: false
      - id: plan
        run: |
          claims=$(python3 e2e/journey/pr_delta.py plan "$BASE_SHA" "$CANDIDATE_SHA")
          echo "claims=$claims" >> "$GITHUB_OUTPUT"
          printf 'Affected claims: %s\n' "${claims:-none}" >> "$GITHUB_STEP_SUMMARY"

  journey:
    name: Affected Journey (${{ matrix.side }})
    needs: plan
    if: needs.plan.outputs.claims != ''
    runs-on: ubuntu-latest
    timeout-minutes: 55
    strategy:
      fail-fast: false
      matrix:
        side: [base, candidate]
    env:
      GOTOOLCHAIN: local
      CLAIMS: ${{ needs.plan.outputs.claims }}
      KB_DEVKIT_BASE_REF: ${{ github.event.pull_request.base.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ matrix.side == 'base' && github.event.pull_request.base.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86
        with:
          run_install: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: package.json
          cache: pnpm
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version: '1.26.11'
          cache-dependency-path: tools/kb-devkit/go.sum
      - name: Apply the same catalog repair to both verification lanes
        run: |
          git fetch --no-tags --depth=1 origin "$CANDIDATE_SHA"
          git show "$CANDIDATE_SHA:scripts/ci/journey-proof-claim-discovery.patch" > "$RUNNER_TEMP/claim-discovery.patch"
          git apply "$RUNNER_TEMP/claim-discovery.patch"
      - run: corepack pnpm install --frozen-lockfile
      - uses: ./.github/actions/devkit-cas
        with:
          mode: read-write
          namespace: journey
      - uses: ./.github/actions/install-goreleaser
      - name: Prepare the installed candidate once
        run: |
          BATCH_SELECTION="cases:$(printf '%s' "$CLAIMS" | base64 -w0)"
          export BATCH_SELECTION
          if [ "$(git rev-parse HEAD)" = "$BASE_SHA" ]; then
            export KB_DEVKIT_BASE_REF="$BASE_SHA^"
          fi
          e2e/journey/batch.sh prepare "$RUNNER_TEMP/journey-producer" "$BASE_SHA"
      - name: Run selected Journey cases
        run: |
          for mode in local secured; do
            if ! e2e/journey/batch.sh mode "$mode" "$RUNNER_TEMP/journey-producer" "$RUNNER_TEMP/journey-evidence" --cases "$CLAIMS"; then
              echo "$mode did not pass. The delta check will inspect the recorded evidence."
            fi
          done
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: journey-pr-${{ matrix.side }}
          path: ${{ runner.temp }}/journey-evidence
          if-no-files-found: warn
          retention-days: 14

  baseline-delta:
    name: Journey baseline delta
    needs: [plan, journey]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      CLAIMS: ${{ needs.plan.outputs.claims }}
      PLAN_RESULT: ${{ needs.plan.result }}
      JOURNEY_RESULT: ${{ needs.journey.result }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Test comparison and check scope
        env:
          PYTHONPATH: e2e/journey
        run: |
          python3 -m unittest test_case_scoreboard test_pr_delta
          if [ "$PLAN_RESULT" != success ]; then
            echo "Affected Journey selection failed." | tee -a "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          if [ -z "$CLAIMS" ]; then
            echo "This PR has no affected product claims." >> "$GITHUB_STEP_SUMMARY"
          elif [ "$JOURNEY_RESULT" != success ]; then
            echo "Affected Journey evidence jobs did not finish." | tee -a "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
      - uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16
        if: env.CLAIMS != ''
        with:
          pattern: journey-pr-*
          path: ${{ runner.temp }}/journey-evidence
      - name: Compare exact base and proposed merge
        if: env.CLAIMS != ''
        run: |
          evidence="$RUNNER_TEMP/journey-evidence"
          python3 e2e/journey/pr_delta.py check "$evidence/journey-pr-base" "$evidence/journey-pr-candidate" \
            "$BASE_SHA" "$CANDIDATE_SHA" "$CLAIMS" | tee -a "$GITHUB_STEP_SUMMARY"
