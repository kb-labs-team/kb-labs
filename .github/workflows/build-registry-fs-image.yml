name: Build platform runtime images with pnpm links

# Build-only packaging/runtime verification from the filesystem-backed Registry source SHA.
on:
  push:
    branches:
      - 'verify/registry-fs-image-final'

permissions:
  actions: read
  contents: read
  packages: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 7b8240395009fc3a055916bb4cef00c1821bf4b3

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86
        with:
          run_install: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
          cache: pnpm
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version: '1.26.8'

      - name: Build kb-devkit
        run: make build -C tools/kb-devkit

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build workspace
        run: pnpm build

      - name: Prepare service production trees
        run: |
          set -euo pipefail
          pnpm --filter @kb-labs/core-state-daemon --prod --config.inject-workspace-packages=true deploy .kb/deploy/state-daemon
          pnpm --filter @kb-labs/gateway-app --prod --config.inject-workspace-packages=true deploy .kb/deploy/gateway-app
          pnpm --filter @kb-labs/marketplace-registry-app --prod --config.inject-workspace-packages=true deploy .kb/deploy/marketplace-registry-app
          node tools/release/generate-platform-image-default.mjs
          for service in state-daemon gateway-app marketplace-registry-app; do
            tree=".kb/deploy/$service"
            test -e "$tree/node_modules/@kb-labs/plugin-runtime/package.json"
          done
          (
            cd .kb/deploy/state-daemon
            node --input-type=module -e "await import('@kb-labs/plugin-runtime'); await import('@kb-labs/core-state-daemon')"
          )
          (
            cd .kb/deploy/gateway-app
            node --input-type=module -e "await import('@kb-labs/plugin-runtime'); await import('@kb-labs/gateway-core')"
          )
          (
            cd .kb/deploy/marketplace-registry-app
            node --input-type=module -e "await import('@kb-labs/plugin-runtime'); await import('@kb-labs/marketplace-registry-core')"
          )
          mkdir -p "$RUNNER_TEMP/platform-image-inputs"
          find .kb/deploy -type l -print | wc -l | tr -d ' ' > "$RUNNER_TEMP/platform-image-inputs/symlink-count.txt"
          tar -C .kb -czf "$RUNNER_TEMP/platform-image-inputs/platform-deploy.tar.gz" deploy
          (cd "$RUNNER_TEMP/platform-image-inputs" && sha256sum platform-deploy.tar.gz > platform-deploy.tar.gz.sha256)

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: platform-image-inputs-7b8240395009fc3a055916bb4cef00c1821bf4b3
          path: ${{ runner.temp }}/platform-image-inputs/
          retention-days: 1

  images:
    needs: prepare
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: kb-state-daemon
            deploy_tree: state-daemon
            dockerfile: services/state/daemon/Dockerfile
            smoke_imports: "await import('@kb-labs/plugin-runtime'); await import('@kb-labs/core-state-daemon')"
          - image: kb-gateway
            deploy_tree: gateway-app
            dockerfile: services/gateway/app/Dockerfile
            smoke_imports: "await import('@kb-labs/plugin-runtime'); await import('@kb-labs/gateway-core')"
          - image: kb-marketplace-registry
            deploy_tree: marketplace-registry-app
            dockerfile: services/marketplace-registry/app/Dockerfile
            smoke_imports: "await import('@kb-labs/plugin-runtime'); await import('@kb-labs/marketplace-registry-core')"
    env:
      SOURCE_SHA: 7b8240395009fc3a055916bb4cef00c1821bf4b3
      IMAGE_REF: ghcr.io/kb-labs-team/${{ matrix.image }}:7b8240395009fc3a055916bb4cef00c1821bf4b3
      IMAGE_NAME: ${{ matrix.image }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 7b8240395009fc3a055916bb4cef00c1821bf4b3

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: platform-image-inputs-7b8240395009fc3a055916bb4cef00c1821bf4b3
          path: ${{ runner.temp }}/platform-image-inputs/

      - name: Restore deploy tree with pnpm links intact
        run: |
          set -euo pipefail
          cd "${RUNNER_TEMP}/platform-image-inputs"
          sha256sum -c platform-deploy.tar.gz.sha256
          mkdir -p "$GITHUB_WORKSPACE/.kb/deploy"
          tar -xzf platform-deploy.tar.gz -C "$GITHUB_WORKSPACE/.kb"
          tree="$GITHUB_WORKSPACE/.kb/deploy/${{ matrix.deploy_tree }}"
          expected_links="$(cat symlink-count.txt)"
          actual_links="$(find "$GITHUB_WORKSPACE/.kb/deploy" -type l -print | wc -l | tr -d ' ')"
          if [ "$actual_links" != "$expected_links" ]; then
            echo "Deploy archive symlink count changed: before=$expected_links after=$actual_links" >&2
            exit 1
          fi
          test -e "$tree/node_modules/@kb-labs/plugin-runtime/package.json"
          cd "$tree"
          node --input-type=module -e "${{ matrix.smoke_imports }}"

      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e

      - name: Build linux amd64 image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64
          load: true
          tags: ${{ env.IMAGE_REF }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ env.SOURCE_SHA }}
            org.opencontainers.image.version=${{ env.SOURCE_SHA }}

      - name: Runtime module smoke inside the built image
        run: >-
          docker run --rm --entrypoint node "$IMAGE_REF"
          --input-type=module -e "${{ matrix.smoke_imports }}"

      - name: Export and roundtrip verify image artifact
        id: export_image
        run: |
          set -euo pipefail
          out="${RUNNER_TEMP}/image-export"
          mkdir -p "$out"
          archive="$out/${IMAGE_NAME}.tar.gz"
          image_id="$(docker image inspect --format '{{.Id}}' "$IMAGE_REF")"
          docker save "$IMAGE_REF" | gzip -1 > "$archive"
          gzip -t "$archive"

          manifest="$(tar -xOzf "$archive" manifest.json)"
          config_file="$(printf '%s' "$manifest" | jq -er '.[0].Config')"
          repo_tag="$(printf '%s' "$manifest" | jq -er --arg ref "$IMAGE_REF" '.[0].RepoTags[] | select(. == $ref)')"
          config_digest="sha256:$(tar -xOzf "$archive" "$config_file" | sha256sum | cut -d ' ' -f 1)"
          case "$config_file" in
            blobs/sha256/*) declared_config_digest="sha256:${config_file##*/}" ;;
            *.json) declared_config_digest="sha256:${config_file%.json}" ;;
            *) echo "Unsupported Docker archive config path: $config_file" >&2; exit 1 ;;
          esac
          test "$repo_tag" = "$IMAGE_REF"
          test "$config_digest" = "$declared_config_digest"

          docker image rm "$IMAGE_REF"
          docker load --input "$archive"
          loaded_image_id="$(docker image inspect --format '{{.Id}}' "$IMAGE_REF")"
          if [ "$loaded_image_id" != "$image_id" ]; then
            echo "Docker save/load identity mismatch: before=$image_id after=$loaded_image_id config=$config_digest" >&2
            exit 1
          fi

          (cd "$out" && sha256sum "${IMAGE_NAME}.tar.gz" > "${IMAGE_NAME}.tar.gz.sha256")
          archive_sha="$(sha256sum "$archive" | cut -d ' ' -f 1)"
          {
            echo "image_id=$image_id"
            echo "config_digest=$config_digest"
            echo "archive_sha=$archive_sha"
          } >> "$GITHUB_OUTPUT"

      - name: Login to GHCR
        id: ghcr_login
        continue-on-error: true
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push immutable image tag
        id: ghcr_push
        if: steps.ghcr_login.outcome == 'success'
        continue-on-error: true
        run: |
          set -euo pipefail
          push_output="$(docker push "$IMAGE_REF" 2>&1)" || { printf '%s\n' "$push_output"; exit 1; }
          printf '%s\n' "$push_output"
          digest="$(printf '%s\n' "$push_output" | sed -nE 's/.*digest: (sha256:[0-9a-f]+).*/\1/p' | tail -1)"
          test -n "$digest"
          echo "digest=$digest" >> "$GITHUB_OUTPUT"

      - name: Finalize identity and upload artifact
        env:
          IMAGE_ID: ${{ steps.export_image.outputs.image_id }}
          CONFIG_DIGEST: ${{ steps.export_image.outputs.config_digest }}
          ARCHIVE_SHA: ${{ steps.export_image.outputs.archive_sha }}
          GHCR_DIGEST: ${{ steps.ghcr_push.outputs.digest }}
          GHCR_LOGIN_OUTCOME: ${{ steps.ghcr_login.outcome }}
          GHCR_PUSH_OUTCOME: ${{ steps.ghcr_push.outcome }}
        run: |
          set -euo pipefail
          registry_status=artifact-only
          if [ "$GHCR_LOGIN_OUTCOME" = success ] && [ "$GHCR_PUSH_OUTCOME" = success ]; then registry_status=published; fi
          jq -n \
            --arg image "$IMAGE_REF" \
            --arg source_sha "$SOURCE_SHA" \
            --arg image_id "$IMAGE_ID" \
            --arg config_digest "$CONFIG_DIGEST" \
            --arg archive_sha "$ARCHIVE_SHA" \
            --arg registry_status "$registry_status" \
            --arg registry_digest "$GHCR_DIGEST" \
            --arg run_id "$GITHUB_RUN_ID" \
            --arg run_url "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" \
            '{schemaVersion:1,image:$image,sourceSHA:$source_sha,platform:"linux/amd64",imageID:$image_id,configDigest:$config_digest,archiveSHA256:$archive_sha,registryStatus:$registry_status,registryDigest:$registry_digest,runID:$run_id,runURL:$run_url}' \
          > "${RUNNER_TEMP}/image-export/${IMAGE_NAME}.identity.json"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: ${{ matrix.image }}-7b8240395009fc3a055916bb4cef00c1821bf4b3
          path: ${{ runner.temp }}/image-export/
          if-no-files-found: error
          retention-days: 7

  verify:
    needs: images
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        image:
          - kb-state-daemon
          - kb-gateway
          - kb-marketplace-registry
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: ${{ matrix.image }}-7b8240395009fc3a055916bb4cef00c1821bf4b3
          path: ${{ runner.temp }}/image-artifact

      - name: Verify checksum, OCI config digest, tag and fresh Docker load
        env:
          IMAGE_NAME: ${{ matrix.image }}
          IMAGE_REF: ghcr.io/kb-labs-team/${{ matrix.image }}:7b8240395009fc3a055916bb4cef00c1821bf4b3
        run: |
          set -euo pipefail
          cd "${RUNNER_TEMP}/image-artifact"
          archive="${IMAGE_NAME}.tar.gz"
          identity="${IMAGE_NAME}.identity.json"
          sha256sum -c "${archive}.sha256"
          test "$(jq -r '.image' "$identity")" = "$IMAGE_REF"
          test "$(jq -r '.sourceSHA' "$identity")" = "7b8240395009fc3a055916bb4cef00c1821bf4b3"
          test "$(jq -r '.platform' "$identity")" = linux/amd64
          test "$(sha256sum "$archive" | cut -d ' ' -f 1)" = "$(jq -r '.archiveSHA256' "$identity")"

          manifest="$(tar -xOzf "$archive" manifest.json)"
          config_file="$(printf '%s' "$manifest" | jq -er '.[0].Config')"
          repo_tag="$(printf '%s' "$manifest" | jq -er --arg ref "$IMAGE_REF" '.[0].RepoTags[] | select(. == $ref)')"
          test "$repo_tag" = "$IMAGE_REF"
          config_digest="sha256:$(tar -xOzf "$archive" "$config_file" | sha256sum | cut -d ' ' -f 1)"
          case "$config_file" in
            blobs/sha256/*) declared_config_digest="sha256:${config_file##*/}" ;;
            *.json) declared_config_digest="sha256:${config_file%.json}" ;;
            *) echo "Unsupported Docker archive config path: $config_file" >&2; exit 1 ;;
          esac
          test "$config_digest" = "$declared_config_digest"
          test "$config_digest" = "$(jq -r '.configDigest' "$identity")"

          docker load --input "$archive"
          loaded_image_id="$(docker image inspect --format '{{.Id}}' "$IMAGE_REF")"
          test "$loaded_image_id" = "$(jq -r '.imageID' "$identity")"
