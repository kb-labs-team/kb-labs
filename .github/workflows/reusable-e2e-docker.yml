name: Reusable — Docker E2E suite

# Shared Docker-based E2E setup used by e2e-platform, e2e-marketplace,
# and e2e-rest-api. Extracts the common phases:
#
#   Build toolchain → Install deps → Build packages → Pack .tgz →
#   Docker images → Verdaccio → Publish → Start platform → Run suite →
#   Artifacts + timings → Cleanup
#
# Each caller passes the suite-specific inputs below and gets a full
# isolated run with its own COMPOSE_PROJECT_NAME.

on:
  workflow_call:
    inputs:
      suite:
        description: 'E2E suite name, e.g. "marketplace" or "rest-api"'
        type: string
        required: true
      e2e-package:
        description: 'Workspace package to run, e.g. "@kb-labs/e2e-marketplace"'
        type: string
        required: true
      health-url:
        description: 'URL polled (curl -sf) to determine platform readiness'
        type: string
        required: true
      health-steps:
        description: 'Max 5-second polling iterations before failing (60 = 5 min)'
        type: number
        default: 60
      playwright-dir:
        description: 'Directory under which to run playwright install (empty = skip)'
        type: string
        default: ''
      compose-project:
        description: 'COMPOSE_PROJECT_NAME — must be unique per concurrent run'
        type: string
        required: true
      prebuilt-artifact:
        description: 'Optional immutable build bundle produced by a prepare job'
        type: string
        default: ''
      fast-build:
        description: 'Build Docker images directly without shared Buildx layer caches'
        type: boolean
        default: false
      fast-registry:
        description: 'Use the PR base snapshot plus PR overlay for @kb-labs packages'
        type: boolean
        default: false
      artifact-prefix:
        description: 'Prefix for per-suite artifacts to avoid collisions between lanes'
        type: string
        default: ''
      prebuilt-files-artifact:
        description: 'Optional bundle containing built dist, tools, and E2E tarballs (images are built in each shard)'
        type: string
        default: ''
      cache-mode:
        description: 'restore reads the master-written caches (never writes); off for authoritative lanes'
        type: string
        default: restore

permissions:
  contents: read

env:
  COMPOSE_FILE: >-
    ${{ inputs.fast-registry && 'e2e/docker-compose.yml:e2e/docker-compose.ci.yml:e2e/docker-compose.fast-ci.yml' || 'e2e/docker-compose.yml:e2e/docker-compose.ci.yml' }}
  COMPOSE_PROJECT_NAME: ${{ inputs.compose-project }}

jobs:
  e2e:
    name: E2E / ${{ inputs.suite }}
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      # ── Build toolchain ──────────────────────────────────────────────────

      - name: Set up Go
        if: inputs.prebuilt-artifact == ''
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          # kb-devkit builds every Go module in the workspace (including
          # kb-deploy/kb-monitor, which require go 1.26 as of #435), not just
          # kb-create — go-version-file only pins to one module's directive
          # and silently under-provisions the toolchain for the rest.
          go-version: '1.26.8'
          cache: false

      - name: Set up pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24'
      - uses: ./.github/actions/pnpm-store
        if: inputs.cache-mode != 'off'

      # ── Compile Go tools for linux/amd64 ────────────────────────────────
      # The committed binaries in tools/ are macOS builds.

      - name: Build Go tools (kb-devkit, kb-dev)
        if: inputs.prebuilt-artifact == '' && inputs.prebuilt-files-artifact == ''
        run: |
          (cd tools/kb-devkit && CGO_ENABLED=0 go build -o kb-devkit . && chmod +x kb-devkit)
          (cd tools/kb-dev    && CGO_ENABLED=0 go build -o kb-dev    . && chmod +x kb-dev)

      # ── Install + build monorepo ─────────────────────────────────────────

      - name: Restore immutable prebuilt E2E bundle
        if: inputs.prebuilt-artifact != '' || inputs.prebuilt-files-artifact != ''
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: ${{ inputs.prebuilt-artifact != '' && inputs.prebuilt-artifact || inputs.prebuilt-files-artifact }}
          path: /tmp/e2e-prebuilt

      - name: Extract immutable prebuilt E2E bundle
        if: inputs.prebuilt-artifact != '' || inputs.prebuilt-files-artifact != ''
        run: |
          tar xzf /tmp/e2e-prebuilt/e2e-files.tar.gz
          if [ -f /tmp/e2e-prebuilt/e2e-images.tar ]; then
            docker load --input /tmp/e2e-prebuilt/e2e-images.tar
          fi
          chmod +x tools/kb-devkit/kb-devkit tools/kb-dev/kb-dev

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # ── Phase 1 of ADR-0017: persist kb-devkit CAS across runs ──────────

      - name: Restore kb-devkit build cache
        if: inputs.prebuilt-artifact == '' && inputs.prebuilt-files-artifact == '' && !inputs.fast-build
        uses: ./.github/actions/devkit-cas
        with:
          mode: ${{ inputs.cache-mode }}

      - name: Build all packages (topological order)
        if: inputs.prebuilt-artifact == '' && inputs.prebuilt-files-artifact == ''
        run: |
          if [ "${{ inputs.cache-mode }}" = "off" ]; then
            ./tools/kb-devkit/kb-devkit run build --no-cache
          else
            pnpm build
          fi

      # ── Install Playwright browsers (optional) ───────────────────────────

      - name: Install Playwright browsers
        if: inputs.playwright-dir != ''
        run: cd ${{ inputs.playwright-dir }} && pnpm exec playwright install chromium --with-deps

      # ── Phase 2 of ADR-0017: cache packed .tgz between runs ─────────────

      - name: Pack @kb-labs/* packages
        if: inputs.prebuilt-artifact == '' && inputs.prebuilt-files-artifact == ''
        run: bash e2e/scripts/pack-all.sh

      - name: List packed packages
        if: inputs.prebuilt-artifact == '' && inputs.prebuilt-files-artifact == '' && !inputs.fast-build
        run: find e2e/packages -maxdepth 1 -type f -name '*.tgz' -print | wc -l && echo "tarballs packed"

      # ── Docker layer caching ─────────────────────────────────────────────

      # Pre-pull BuildKit to avoid intermittent Docker Hub timeouts during
      # setup-buildx-action (~20% flake rate on shared GitHub runners).
      # Retries 3× so a transient 429/503 from Docker Hub doesn't fail the job.
      - name: Pre-pull BuildKit image
        if: inputs.prebuilt-artifact == '' && inputs.prebuilt-files-artifact == '' && !inputs.fast-build
        run: |
          for i in 1 2 3; do
            docker pull moby/buildkit:buildx-stable-1 && break
            echo "Attempt $i failed, retrying in 15s…"
            sleep 15
          done

      - name: Set up Docker Buildx
        if: inputs.prebuilt-artifact == '' && inputs.prebuilt-files-artifact == '' && !inputs.fast-build
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e
        timeout-minutes: 5

      - name: Install GoReleaser for candidate binaries
        if: inputs.prebuilt-artifact == ''
        uses: ./.github/actions/install-goreleaser
      - name: Prepare platform candidate binaries
        if: inputs.prebuilt-artifact == ''
        run: bash e2e/platform/prepare-container-binaries.sh

      - name: Build platform image
        if: inputs.prebuilt-artifact == ''
        run: |
          if [ "${{ inputs.fast-build }}" = "true" ]; then
            docker build --build-arg "SOURCE_REVISION=$GITHUB_SHA" -t kb-e2e-ci-platform:latest -f e2e/platform/Dockerfile .
          else
            cache_args=()
            if [ "${{ inputs.cache-mode }}" = "restore" ]; then
              cache_args=(--cache-from "type=gha,scope=e2e-platform")
            fi
            docker buildx build \
              "${cache_args[@]}" \
              --load \
              -t kb-e2e-ci-platform:latest \
              --build-arg "SOURCE_REVISION=$GITHUB_SHA" -f e2e/platform/Dockerfile .
          fi

      - name: Build publisher image
        if: inputs.prebuilt-artifact == ''
        uses: ./.github/actions/build-publisher
        with:
          engine: ${{ inputs.fast-build && 'docker' || 'buildx' }}
          cache-from: ${{ !inputs.fast-build && inputs.cache-mode == 'restore' && 'type=gha,scope=e2e-publisher' || '' }}

      # Verdaccio is reconstructed from this run's exact package tarballs.

      - name: Prepare Verdaccio storage permissions
        run: |
          mkdir -p e2e/.verdaccio-storage
          sudo chown -R 10001:65533 e2e/.verdaccio-storage

      - name: Start Verdaccio registry
        run: docker compose up -d verdaccio

      - name: Wait for Verdaccio to be healthy
        run: |
          echo "Waiting for Verdaccio..."
          for i in $(seq 1 30); do
            if docker compose ps verdaccio | grep -q "healthy"; then
              echo "Verdaccio is healthy after $((i * 2))s"
              break
            fi
            sleep 2
          done

      - name: Publish packages to Verdaccio
        if: inputs.prebuilt-artifact == ''
        run: docker compose run --rm publisher

      - name: Start platform
        run: docker compose up -d --no-build platform

      - name: Wait for platform to be healthy
        run: |
          echo "Waiting for platform (up to ${{ inputs.health-steps }} × 5s)..."
          for i in $(seq 1 ${{ inputs.health-steps }}); do
            if curl -sf "${{ inputs.health-url }}" > /dev/null 2>&1; then
              echo "Platform ready after $((i * 5))s"
              break
            fi
            if [ "$i" = "${{ inputs.health-steps }}" ]; then
              echo "Platform failed to start — dumping logs"
              docker compose logs platform | tail -100
              exit 1
            fi
            sleep 5
          done

      # ── Run E2E suite ────────────────────────────────────────────────────

      - name: Run e2e tests (${{ inputs.suite }})
        run: |
          chmod +x tools/kb-devkit/kb-devkit tools/kb-dev/kb-dev || true
          ./tools/kb-devkit/kb-devkit run e2e --packages "${{ inputs.e2e-package }}"
        env:
          GATEWAY_URL:     http://localhost:4000
          REST_URL:        http://localhost:5050
          MARKETPLACE_URL: http://localhost:5070
          REGISTRY_URL:    http://localhost:5071
          WORKFLOW_URL:    http://localhost:7778
          STATE_URL:       http://localhost:7777
          MCP_URL:         http://localhost:7779
          CI: "true"
          KB_DEBUG: "true"
          KB_DEV_BIN: ${{ github.workspace }}/tools/scripts/kb-dev-docker.sh

      # ── Artifacts + summary ──────────────────────────────────────────────

      - name: Dump platform container logs
        if: always()
        run: |
          mkdir -p /tmp/e2e-logs
          docker compose logs --no-color platform  > /tmp/e2e-logs/platform-bootstrap.log 2>&1 || true
          docker compose logs --no-color verdaccio > /tmp/e2e-logs/verdaccio.log           2>&1 || true
          docker compose ps > /tmp/e2e-logs/ps.txt 2>&1 || true
          docker compose ps -a --format json > /tmp/e2e-logs/compose-ps.json 2>&1 || true
          docker compose ps -a -q | xargs -r docker inspect > /tmp/e2e-logs/compose-inspect.json 2>&1 || true
          docker stats --no-stream --all --format '{{json .}}' > /tmp/e2e-logs/docker-stats.jsonl 2>&1 || true
          docker compose exec -T platform sh -c 'kb-dev status --json' > /tmp/e2e-logs/kb-dev-status.json 2>&1 || true
          docker compose exec -T platform sh -c 'kb-dev diagnose --json' > /tmp/e2e-logs/kb-dev-diagnose.json 2>&1 || true
          for service in $(jq -r '.services // {} | keys[]' /tmp/e2e-logs/kb-dev-status.json 2>/dev/null || true); do
            docker compose exec -T platform sh -c "kb-dev logs $service --all" \
              > "/tmp/e2e-logs/$service.log" 2>&1 || true
          done
          while IFS=$'\t' read -r name url; do
            [ -n "$name" ] || continue
            curl -sS --max-time 5 "$url/metrics" > "/tmp/e2e-logs/$name.prom" 2>&1 || true
          done < <(jq -r '.services // {} | to_entries[] | select((.value.url // "") | startswith("http")) | [.key, .value.url] | @tsv' /tmp/e2e-logs/kb-dev-status.json 2>/dev/null || true)
          find e2e -path '*/report/diagnostics/*' -type f -print > /tmp/e2e-logs/diagnostic-files.txt 2>&1 || true
          docker compose exec -T platform sh -c 'find / -name "*.log" -size +0c 2>/dev/null | grep -v proc' \
            > /tmp/e2e-logs/log-files-list.txt 2>&1 || true
          docker compose cp platform:/workspace/kb-e2e/.kb          /tmp/e2e-logs/project-kb-dir  2>&1 || true
          docker compose cp platform:/root/kb-platform/.kb          /tmp/e2e-logs/platform-kb-dir 2>&1 || true
          docker compose exec -T platform sh -c 'kb-dev status 2>&1' > /tmp/e2e-logs/kb-dev-status.txt 2>&1 || true
          docker compose exec -T platform sh -c 'cat /tmp/kb-e2e-diag.json 2>/dev/null' \
            > /tmp/e2e-logs/kb-e2e-diag.json 2>&1 || true

      - name: Upload platform logs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: ${{ inputs.artifact-prefix != '' && format('{0}-', inputs.artifact-prefix) || '' }}platform-logs-${{ github.run_id }}-${{ inputs.suite }}
          path: /tmp/e2e-logs/
          retention-days: 14

      - name: Publish diagnostic summary
        if: always()
        run: |
          {
            echo "### E2E diagnostics: ${{ inputs.suite }}"
            echo
            echo '```text'
            if [ -f /tmp/e2e-logs/kb-dev-status.json ]; then
              cat /tmp/e2e-logs/kb-dev-status.json
            else
              cat /tmp/e2e-logs/ps.txt
            fi
            echo '```'
            echo
            for summary in e2e/${{ inputs.suite }}/report/diagnostics/*/summary.json; do
              [ -f "$summary" ] || continue
              echo "#### $(basename "$(dirname "$summary")")"
              jq -r '"status: \(.status) | failed services: \((.failedServices // []) | join(", ")) | collection: \(.collectionStatus)"' "$summary" || true
            done
            echo
            echo "Full logs and metrics are in the uploaded platform-logs artifact."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload KB_DEBUG diagnostic snapshot
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: ${{ inputs.artifact-prefix != '' && format('{0}-', inputs.artifact-prefix) || '' }}kb-e2e-diag-${{ github.run_id }}-${{ inputs.suite }}
          path: /tmp/kb-e2e-diag.json
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: ${{ inputs.artifact-prefix != '' && format('{0}-', inputs.artifact-prefix) || '' }}playwright-report-${{ github.run_id }}-${{ inputs.suite }}
          path: e2e/${{ inputs.suite }}/report/
          retention-days: 14

      - name: Upload E2E diagnostic dossiers
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: ${{ inputs.artifact-prefix != '' && format('{0}-', inputs.artifact-prefix) || '' }}e2e-diagnostics-${{ inputs.suite }}-${{ github.run_id }}
          path: e2e/${{ inputs.suite }}/report/diagnostics/
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload flaky report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: ${{ inputs.artifact-prefix != '' && format('{0}-', inputs.artifact-prefix) || '' }}flaky-report-${{ inputs.suite }}-${{ github.run_id }}
          path: e2e/${{ inputs.suite }}/flaky-report.json
          if-no-files-found: ignore
          retention-days: 14

      - name: Show checklist summary
        if: always()
        run: |
          checklist="e2e/${{ inputs.suite }}/report/CHECKLIST.md"
          if [ -f "$checklist" ]; then
            {
              echo "### E2E: ${{ inputs.suite }}"
              cat "$checklist"
              echo ""
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Cleanup
        if: always()
        run: docker compose down --volumes --remove-orphans

      - name: Restore Verdaccio storage ownership for cache save
        if: always()
        run: |
          if [ -d e2e/.verdaccio-storage ]; then
            sudo chown -R "$(id -u):$(id -g)" e2e/.verdaccio-storage
          fi

      # ── Per-step timings (Phase 0 of ADR-0017) ───────────────────────────

      - name: Emit timings
        if: always()
        continue-on-error: true   # non-critical telemetry — gh api may return empty JSON mid-run
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_ID: ${{ github.run_id }}
          REPO: ${{ github.repository }}
        run: |
          set -eu
          mkdir -p /tmp/e2e-timings
          OUT_JSON=/tmp/e2e-timings/timings.json
          gh api "/repos/${REPO}/actions/runs/${RUN_ID}/jobs" \
            --jq '{
              run_id: '"$RUN_ID"',
              repo: "'"$REPO"'",
              jobs: [.jobs[] | {
                name: .name,
                conclusion: .conclusion,
                started_at: .started_at,
                completed_at: .completed_at,
                steps: [.steps[] | select(.completed_at != null) | {
                  name: .name,
                  number: .number,
                  conclusion: .conclusion,
                  started_at: .started_at,
                  completed_at: .completed_at,
                  duration_s: (((.completed_at | fromdateiso8601) - (.started_at | fromdateiso8601)))
                }]
              }]
            }' > "$OUT_JSON"
          {
            echo "## E2E timings — ${{ inputs.suite }}"
            echo ""
            echo "Run: \`${RUN_ID}\` · ${REPO}"
            echo ""
            echo "| # | step | duration | conclusion |"
            echo "|---|---|---:|---|"
            jq -r '.jobs[0].steps[] | "| \(.number) | \(.name) | \(.duration_s | floor)s | \(.conclusion) |"' "$OUT_JSON"
            echo ""
            TOTAL=$(jq -r '[.jobs[0].steps[].duration_s] | add | floor' "$OUT_JSON")
            echo "**Total measured:** ${TOTAL}s"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload timings
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: ${{ inputs.artifact-prefix != '' && format('{0}-', inputs.artifact-prefix) || '' }}e2e-timings-${{ github.run_id }}-${{ inputs.suite }}
          path: /tmp/e2e-timings/
          retention-days: 90
