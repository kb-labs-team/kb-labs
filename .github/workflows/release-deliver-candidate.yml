name: Release — deliver immutable candidate

# Delivery accepts only a bundle produced by release-build-candidate.yml. It
# does not build, stage, version or resolve anything. The workflow engine
# supplies the candidate run and channel after its own approval transition. CI
# publishes only to the non-installable candidate npm tag and never advances a
# public channel pointer.

on:
  workflow_dispatch:
    inputs:
      candidate_run_id:
        description: GitHub Actions run that produced the candidate bundle
        required: true
        type: string
      candidate_id:
        description: Candidate identifier to verify against provenance
        required: true
        type: string
      expected_digest:
        description: Trusted bundle digest shown in the hosted build run summary
        required: true
        type: string
      commit_sha:
        description: Expected full source commit shown in the hosted build run summary
        required: true
        type: string
      flow:
        description: Release flow in the bundle
        required: true
        type: choice
        options: [platform]
      version:
        description: Exact release version in the bundle
        required: true
        type: string
      channel:
        description: Candidate release channel selected by the workflow engine
        required: true
        type: choice
        options: [canary, stable]

permissions:
  contents: write
  actions: read

concurrency:
  group: release-delivery-${{ inputs.candidate_id }}-${{ inputs.channel }}
  cancel-in-progress: false

jobs:
  deliver:
    name: Deliver ${{ inputs.candidate_id }} from ${{ inputs.channel }} channel
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Download immutable candidate bundle
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          run-id: ${{ inputs.candidate_run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          name: release-candidate-${{ inputs.candidate_id }}
          path: ${{ runner.temp }}/candidate-bundle

      - name: Checkout candidate delivery tooling
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          clean: true

      - name: Place immutable candidate bundle after checkout
        run: |
          set -euo pipefail
          mkdir -p .kb/release
          cp -R "$RUNNER_TEMP/candidate-bundle" .kb/release/bundle

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86
        with:
          run_install: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          # The full workspace build includes tools that require Go 1.25;
          # do not let the kb-devkit module's Go 1.22 directive downgrade it.
          go-version: '1.26.8'
          cache: false

      - name: Build kb-devkit
        run: go build -o kb-devkit .
        working-directory: tools/kb-devkit

      - name: Install delivery tooling
        run: pnpm install --frozen-lockfile

      - name: Build platform tooling
        # Delivery only invokes the CLI and release plugin. Building the full
        # workspace here needlessly serializes hundreds of unrelated packages
        # and can exhaust the runner before immutable artifacts are delivered.
        run: ./tools/kb-devkit/kb-devkit run build --packages @kb-labs/cli-bin,@kb-labs/release --no-cache

      - name: Deliver exact candidate tarballs
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          FLOW: ${{ inputs.flow }}
          VERSION: ${{ inputs.version }}
          COMMIT_SHA: ${{ inputs.commit_sha }}
          CANDIDATE_ID: ${{ inputs.candidate_id }}
          EXPECTED_DIGEST: ${{ inputs.expected_digest }}
          CANDIDATE_TAG: candidate-${{ inputs.candidate_id }}
        run: |
          set -euo pipefail
          pnpm kb release artifact publish \
            --flow "$FLOW" \
            --bundle-dir .kb/release/bundle \
            --expected-digest "$EXPECTED_DIGEST" \
            --candidate-id "$CANDIDATE_ID" \
            --commit "$COMMIT_SHA" \
            --version "$VERSION" \
            --registry https://registry.npmjs.org \
            --tag "$CANDIDATE_TAG" \
            --json

      - name: Deliver exact binary assets
        if: inputs.flow == 'platform'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ inputs.version }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          test -s .kb/release/bundle/binary-manifest.json
          binary_tag="v${VERSION}-binaries"
          rm -rf .kb/release/upload-assets
          node - <<'NODE'
          const crypto = require('node:crypto');
          const fs = require('node:fs');
          const path = require('node:path');

          const sourceDir = '.kb/release/bundle/binaries';
          const outputDir = '.kb/release/upload-assets';
          const manifest = JSON.parse(fs.readFileSync('.kb/release/bundle/binary-manifest.json', 'utf8'));
          const byDigest = new Map(manifest.binaries.map((asset) => [asset.sha256, asset.filename]));
          const matched = new Set();
          fs.mkdirSync(outputDir, { recursive: true });
          for (const entry of fs.readdirSync(sourceDir, { recursive: true, withFileTypes: true })) {
            if (!entry.isFile()) continue;
            const source = path.join(entry.parentPath, entry.name);
            const digest = crypto.createHash('sha256').update(fs.readFileSync(source)).digest('hex');
            const filename = byDigest.get(digest);
            if (!filename) continue;
            const destination = path.join(outputDir, filename);
            fs.copyFileSync(source, destination);
            fs.chmodSync(destination, 0o755);
            if ((fs.statSync(destination).mode & 0o111) === 0) {
              throw new Error(`staged binary is not executable: ${filename}`);
            }
            matched.add(filename);
          }
          if (matched.size !== manifest.binaries.length) {
            throw new Error(`prepared ${matched.size}/${manifest.binaries.length} binary assets`);
          }
          fs.copyFileSync(path.join(sourceDir, 'checksums.txt'), path.join(outputDir, 'checksums.txt'));

          // The launcher must resolve installs from a signed release index,
          // never by talking to npm directly (see resolve.Plan in
          // tools/kb-create/v2/resolve/resolve.go). Ship it as an immutable
          // asset on this same per-version binaries release — same place,
          // same checksums.txt convention the installer already verifies
          // binaries against — so every future delivery publishes it
          // automatically with no separate step to remember.
          const indexSource = '.kb/release/bundle/release-index.json';
          if (!fs.existsSync(indexSource)) throw new Error('candidate bundle is missing release-index.json');
          const indexDest = path.join(outputDir, 'release-index.json');
          fs.copyFileSync(indexSource, indexDest);
          const indexDigest = crypto.createHash('sha256').update(fs.readFileSync(indexDest)).digest('hex');
          fs.appendFileSync(path.join(outputDir, 'checksums.txt'), `${indexDigest}  release-index.json\n`);
          NODE
          mapfile -t assets < <(find .kb/release/upload-assets -maxdepth 1 -type f -print | sort)
          test "${#assets[@]}" -gt 0
          if gh release view "$binary_tag" --repo "$REPOSITORY" >/dev/null 2>&1; then
            # A candidate release asset is immutable. Re-runs are accepted
            # only when every already-published byte is identical; never use
            # --clobber here because it could turn a verified candidate into
            # different release bytes under the same tag.
            mkdir -p .kb/release/existing-assets
            for asset in "${assets[@]}"; do
              filename="$(basename "$asset")"
              gh release download "$binary_tag" --repo "$REPOSITORY" --pattern "$filename" --dir .kb/release/existing-assets
              cmp --silent "$asset" ".kb/release/existing-assets/$filename" || {
                echo "immutable binary asset differs: $filename" >&2
                exit 1
              }
            done
          else
            gh release create "$binary_tag" "${assets[@]}" --repo "$REPOSITORY" --title "KB Labs Binaries $binary_tag" --notes "Immutable release candidate ${{ inputs.candidate_id }}"
          fi

      - name: Trust this candidate for the smoke install
        # pnpm 11 defaults minimum-release-age to 24h (supply-chain hardening
        # against just-published/compromised packages) — see pnpm.mjs
        # DEFAULT_OPTS: "minimum-release-age": 24 * 60. The smoke test's own
        # `pnpm install` inside the scaffolded temp project inherits that
        # default and refuses every package this same job published minutes
        # ago, failing with ERR_PNPM_MINIMUM_RELEASE_AGE_VIOLATION — no
        # bounded retry/wait can outlast a 24h wall in a CI job. We already
        # verified this exact candidate's bundle digest against provenance.json
        # earlier in this job (see "Verify candidate identity and bundle
        # digest"), so trusting it here is not a broadened policy — it is
        # narrowly scoped to this ephemeral runner's pnpm config and to the
        # one candidate this job itself built and published.
        run: pnpm config set minimum-release-age 0 --global

      - name: Run post-publish launcher smoke
        if: inputs.flow == 'platform'
        working-directory: tools/kb-create
        env:
          KB_CREATE_RELEASE_INDEX: ${{ github.workspace }}/.kb/release/bundle/release-index.json
          KB_CREATE_PACKAGE_TAG: candidate-${{ inputs.candidate_id }}
        run: |
          set -euo pipefail
          binary="${{ github.workspace }}/.kb/release/upload-assets/kb-create-linux-amd64"
          test -x "$binary"
          set +e
          # Retries here are for genuine transient issues only (npm registry/CDN
          # propagation lag right after publish) — the minimum-release-age
          # rejection is fixed above, not by retrying.
          for attempt in 1 2 3 4 5; do
            KB_CREATE_BINARY="$binary" go test -v -race -count=1 -timeout 12m \
              -run '^TestPublishedV2JourneyInstallsUpdatesAndRunsTheHost$' ./v2/e2e/...
            status=$?
            if [ "$status" -eq 0 ]; then exit 0; fi
            if [ "$attempt" -lt 5 ]; then sleep 20; fi
          done
          exit "$status"
