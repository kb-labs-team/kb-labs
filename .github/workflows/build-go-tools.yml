name: Build Go tools (reusable)

# Builds the host Go CLI tools before the workspace dependency graph is
# installed, then uploads them as the "go-tools" artifact. These binaries are
# never committed to git — see tools/kb-*/kb-* in .gitignore.

on:
  workflow_call:
    inputs:
      fetch-depth:
        description: Passed through to actions/checkout.
        type: number
        default: 0

jobs:
  build:
    name: Go tools
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: ${{ inputs.fetch-depth }}
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version: '1.26.11'
          cache-dependency-path: |
            tools/clikit/go.sum
            tools/kb-devkit/go.sum
            tools/kb-dev/go.sum
            tools/kb-create/go.sum
            tools/kb-deploy/go.sum
            tools/kb-monitor/go.sum
      - name: Build and collect the host Go tools
        run: |
          mkdir -p go-tools
          for tool in kb-devkit kb-dev kb-create kb-deploy kb-monitor; do
            make -C "tools/$tool" build
            test -x "tools/$tool/$tool"
            cp "tools/$tool/$tool" go-tools/
          done
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: go-tools
          path: go-tools/
          retention-days: 1
