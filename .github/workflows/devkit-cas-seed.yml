name: Seed DevKit CAS from trusted master

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  seed:
    if: github.ref == 'refs/heads/master'
    name: Build and cache master workspace
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      GOTOOLCHAIN: local
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86
        with:
          run_install: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: package.json
          cache: pnpm
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version: '1.26.8'
          cache-dependency-path: tools/kb-devkit/go.sum
      - name: Install workspace dependencies
        run: corepack pnpm install --frozen-lockfile
      - id: devkit-cas
        name: Restore trusted master CAS snapshot
        uses: ./.github/actions/devkit-cas
      - name: Build kb-devkit
        working-directory: tools/kb-devkit
        run: go build -trimpath -o "$RUNNER_TEMP/kb-devkit" .
      - name: Build complete master workspace into the CAS
        env:
          DEVKIT_CAS_STORE_PATH: ${{ steps.devkit-cas.outputs.store-path }}
        run: |
          "$RUNNER_TEMP/kb-devkit" run build --json > "$RUNNER_TEMP/devkit-cas-build.json"
          jq -e '.ok == true and (.data.summary.cached | type == "number") and (.data.summary.passed | type == "number") and (.data.summary.failed | type == "number")' "$RUNNER_TEMP/devkit-cas-build.json" > /dev/null
          cas_bytes=$(du -sb "$DEVKIT_CAS_STORE_PATH/objects" "$DEVKIT_CAS_STORE_PATH/tasks" 2>/dev/null | awk '{total += $1} END {print total + 0}')
          cached=$(jq -r '.data.summary.cached' "$RUNNER_TEMP/devkit-cas-build.json")
          executed=$(jq -r '.data.summary.passed + .data.summary.failed' "$RUNNER_TEMP/devkit-cas-build.json")
          {
            echo '### Trusted master DevKit CAS seed'
            echo ''
            echo "- Source SHA: `$GITHUB_SHA`"
            echo "- DevKit tasks restored from cache: $cached"
            echo "- DevKit tasks executed: $executed"
            echo "- CAS size: $cas_bytes bytes"
          } >> "$GITHUB_STEP_SUMMARY"
