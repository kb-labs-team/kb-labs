name: Seed DevKit CAS from trusted master

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  seed:
    if: github.ref == 'refs/heads/master'
    name: Build and cache default master tasks
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      GOTOOLCHAIN: local
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86
        with:
          run_install: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: package.json
          cache: pnpm
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version: '1.26.8'
          cache-dependency-path: tools/kb-devkit/go.sum
      - name: Install workspace dependencies
        run: corepack pnpm install --frozen-lockfile
      - id: devkit-cas
        name: Restore trusted master CAS snapshot
        uses: ./.github/actions/devkit-cas
        with:
          mode: read-write
          namespace: trusted-master
      - name: Build kb-devkit
        working-directory: tools/kb-devkit
        run: go build -trimpath -o "$RUNNER_TEMP/kb-devkit" .
      - name: Build default master tasks into the CAS
        env:
          DEVKIT_CAS_STORE_PATH: ${{ steps.devkit-cas.outputs.store-path }}
          DEVKIT_CACHE_HIT: ${{ steps.devkit-cas.outputs.cache-hit }}
        run: |
          "$RUNNER_TEMP/kb-devkit" run build --json > "$RUNNER_TEMP/devkit-cas-build.json"
          jq -e '.ok == true and (.data.summary.cached | type == "number") and (.data.summary.passed | type == "number") and (.data.summary.failed | type == "number") and (.data.summary.skippedManual | type == "number")' "$RUNNER_TEMP/devkit-cas-build.json" > /dev/null
          cas_bytes=$(node scripts/ci/devkit-cas-size.mjs "$DEVKIT_CAS_STORE_PATH")
          cached=$(jq -r '.data.summary.cached' "$RUNNER_TEMP/devkit-cas-build.json")
          executed=$(jq -r '.data.summary.passed + .data.summary.failed' "$RUNNER_TEMP/devkit-cas-build.json")
          skipped_manual=$(jq -r '.data.summary.skippedManual' "$RUNNER_TEMP/devkit-cas-build.json")
          skipped_builds=$(jq -r '(.data.skippedBuilds // []) | length' "$RUNNER_TEMP/devkit-cas-build.json")
          case "$DEVKIT_CACHE_HIT" in
            true) cache_archive_status=exact-key-hit ;;
            false) cache_archive_status=restore-prefix-hit ;;
            '') cache_archive_status=miss ;;
            *) cache_archive_status=unavailable ;;
          esac
          {
            echo '### Trusted master DevKit CAS seed'
            echo ''
            echo "- Source SHA: $GITHUB_SHA"
            echo "- Cache archive restore: $cache_archive_status"
            echo "- DevKit tasks restored from cache: $cached"
            echo "- DevKit tasks executed: $executed"
            echo "- Manual-only tasks skipped: $skipped_manual"
            echo "- Default-build packages skipped: $skipped_builds"
            echo "- CAS size: $cas_bytes bytes"
          } >> "$GITHUB_STEP_SUMMARY"
