name: Installer journey gate

on:
  pull_request:
    paths:
      - 'tools/kb-create/**'
      - 'tools/kb-create/install.sh'
      - 'core/**'
      - 'sdk/**'
      - 'shared/**'
      - 'cli/**'
      - 'services/**'
      - 'adapters/**'
      - 'plugins/**'
      - 'tools/kb-create/scripts/**'
      - 'e2e/platform/**'
      - 'e2e/journey/**'
      - 'e2e/scripts/pack-all.sh'
      - '.github/workflows/reusable-installer-journey.yml'
      - '.github/workflows/installer-journey.yml'
  push:
    branches: [master]
    paths:
      - 'tools/kb-create/**'
      - 'tools/kb-create/install.sh'
      - 'core/**'
      - 'sdk/**'
      - 'shared/**'
      - 'cli/**'
      - 'services/**'
      - 'adapters/**'
      - 'plugins/**'
      - 'tools/kb-create/scripts/**'
      - 'e2e/platform/**'
      - 'e2e/journey/**'
      - 'e2e/scripts/pack-all.sh'
      - '.github/workflows/reusable-installer-journey.yml'
      - '.github/workflows/installer-journey.yml'

permissions:
  contents: read

concurrency:
  # Keep PR reruns coalesced, but give every master push its own group so a
  # newer merge cannot cancel verification tied to an earlier source SHA.
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name == 'push' && github.sha || 'latest' }}
  cancel-in-progress: true

jobs:
  journey:
    uses: ./.github/workflows/reusable-installer-journey.yml
    permissions:
      contents: read
