name: Reusable — clean installer journey

on:
  workflow_call:
    inputs:
      ref:
        description: Source commit used to build the release candidate
        type: string
        required: false
        default: ''

permissions:
  contents: read

jobs:
  prepare:
    name: Build local release candidate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      journeys: ${{ steps.matrix.outputs.journeys }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.ref || github.sha }}
          fetch-depth: 0
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86
        with: { run_install: false }
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: package.json
          cache: pnpm
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version: '1.26.8'
          cache-dependency-path: tools/kb-devkit/go.sum
      - name: Build kb-devkit
        run: make build -C tools/kb-devkit
      - name: Install workspace dependencies
        run: e2e/journey/install-workspace-dependencies.sh
      - name: Build affected workspace packages
        run: ./tools/kb-devkit/kb-devkit run build --affected
      - name: Verify packed SDK consumer contract
        run: pnpm --filter @kb-labs/sdk test:packed-consumer
      - name: Validate QA cases and test claims
        run: pnpm kb qa cases validate
      - name: Restore packed package cache
        id: tgz-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: e2e/packages/
          key: journey-tgz-v1-${{ runner.os }}-${{ hashFiles('**/dist/**/*.js', '**/dist/**/*.d.ts', '**/package.json') }}
      - uses: ./.github/actions/install-goreleaser
      - name: Pack artifacts and seal the candidate release index
        env:
          KB_JOURNEY_PACKAGES_READY: ${{ steps.tgz-cache.outputs.cache-hit == 'true' && '1' || '0' }}
        run: e2e/journey/prepare-candidate.sh
      - name: Print candidate diagnostics
        if: failure()
        run: |
          for file in .journey/candidate-diagnostics/*.json; do
            if [ -f "$file" ]; then tail -c 4096 "$file"; fi
          done
      - name: Upload candidate diagnostics
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: installer-candidate-diagnostics
          path: .journey/candidate-diagnostics/*.json
          if-no-files-found: warn
          include-hidden-files: true
      - id: matrix
        name: Select journeys from release case claims
        run: printf 'journeys=%s\n' "$(python3 e2e/journey/select_from_cases.py)" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: installer-journey-candidate
          path: |
            e2e/packages/*.tgz
            .journey/release/**
            .journey/runner-inputs/**
          if-no-files-found: error
          retention-days: 1
          include-hidden-files: true

  journey:
    name: Journey ${{ matrix.case }}
    needs: prepare
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        case: ${{ fromJSON(needs.prepare.outputs.journeys) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: installer-journey-candidate
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e
      - name: Restore Docker build cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: /tmp/.buildx-cache-journey
          key: journey-buildx-${{ runner.os }}-${{ hashFiles('e2e/journey/**', 'e2e/publisher/**', 'e2e/packages/*.tgz') }}
          restore-keys: journey-buildx-${{ runner.os }}-
      - name: Run journey in a fresh container
        env:
          KB_JOURNEY_SERVICE_PROFILE: ${{ startsWith(matrix.case, 'service-') && 'nightly' || '' }}
          KB_JOURNEY_ONLY: ${{ matrix.case }}
        run: e2e/journey/run.sh --no-build
      - name: Stop journey containers
        if: always()
        run: e2e/journey/run.sh --down
      - name: Add journey report to job summary
        if: always()
        run: if [ -f .journey/reports/journey-summary.md ]; then cat .journey/reports/journey-summary.md >> "$GITHUB_STEP_SUMMARY"; fi
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: service-journey-results-${{ matrix.os }}-${{ matrix.case }}
          path: .journey/reports/service-*.json
          if-no-files-found: ignore
          retention-days: 90

  native_macos:
    name: Native macOS installer smoke
    needs: prepare
    runs-on: macos-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.ref || github.sha }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: package.json
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version: '1.26.8'
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: installer-journey-candidate
      - name: Install candidate natively and smoke the installed CLI
        run: e2e/journey/native-macos-smoke.sh

  coverage:
    name: Release case coverage
    needs: [prepare, journey]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86
        with: { run_install: false }
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: package.json
          cache: pnpm
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version: '1.26.8'
          cache-dependency-path: tools/kb-devkit/go.sum
      - name: Restore journey results
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          pattern: service-journey-results-*
          path: .journey/reports
          merge-multiple: true
      - name: Build the case coverage CLI
        run: |
          make build -C tools/kb-devkit
          e2e/journey/install-workspace-dependencies.sh
          ./tools/kb-devkit/kb-devkit run build --packages @kb-labs/cli-bin,@kb-labs/qa
      - name: Enforce local and secured release case coverage
        run: |
          run_files=$(find .journey/reports -type f -name 'service-*.json' -print | sort | paste -sd, -)
          coverage_status=0
          for mode in local secured; do
            args=(qa coverage show --level release --mode "$mode")
            if [ -n "$run_files" ]; then args+=(--run "$run_files"); fi
            node ./cli/bin/dist/bin.js "${args[@]}" || coverage_status=1
          done
          exit "$coverage_status"
