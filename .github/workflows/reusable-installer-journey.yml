name: Reusable — clean installer journey

on:
  workflow_call:
    inputs:
      ref:
        description: Source commit used to build the release candidate
        type: string
        required: false
        default: ''
      candidate_run_id:
        description: Existing run that uploaded the exact candidate bundle to exercise
        type: string
        required: false
        default: ''
      candidate_artifact_name:
        description: Artifact name containing the sealed candidate bundle
        type: string
        required: false
        default: ''
      candidate_bundle_digest:
        description: Trusted payload digest from the candidate build job
        type: string
        required: false
        default: ''
      candidate_id:
        description: Candidate identifier expected inside the bundle
        type: string
        required: false
        default: ''
      candidate_commit:
        description: Candidate source commit expected inside the bundle
        type: string
        required: false
        default: ''
      candidate_flow:
        description: Release flow expected inside the bundle
        type: string
        required: false
        default: ''
      candidate_version:
        description: Release version expected inside the bundle
        type: string
        required: false
        default: ''
      candidate_channel:
        description: Release channel expected inside the bundle
        type: string
        required: false
        default: ''

permissions:
  contents: read
  actions: read

jobs:
  prepare:
    name: Build local release candidate
    runs-on: ubuntu-latest
    # One recent prepare job finished in 28m47s, leaving only 73s under 30m.
    timeout-minutes: 45
    outputs:
      journeys: ${{ steps.matrix.outputs.journeys }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.ref || github.sha }}
          fetch-depth: 0
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86
        with: { run_install: false }
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: package.json
          cache: pnpm
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version: '1.26.11'
          cache-dependency-path: tools/kb-devkit/go.sum
      - name: Run journey static preflight
        run: bash e2e/journey/static-preflight.sh
      - name: Build kb-devkit
        run: make build -C tools/kb-devkit
      - name: Install workspace dependencies
        run: e2e/journey/install-workspace-dependencies.sh
      - name: Build affected workspace packages
        run: ./tools/kb-devkit/kb-devkit run build --affected
      - name: Verify packed SDK consumer contract
        run: pnpm --filter @kb-labs/sdk test:packed-consumer
      - name: Validate QA cases and test claims
        run: pnpm kb qa cases validate
      - name: Restore packed package cache
        id: tgz-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: e2e/packages/
          key: journey-tgz-v1-${{ runner.os }}-${{ hashFiles('**/dist/**/*.js', '**/dist/**/*.d.ts', '**/package.json') }}
      - uses: ./.github/actions/install-goreleaser
      - name: Prepare local journey fixture artifacts
        env:
          KB_JOURNEY_PACKAGES_READY: ${{ steps.tgz-cache.outputs.cache-hit == 'true' && '1' || '0' }}
        run: e2e/journey/prepare-candidate.sh
      - name: Download the sealed release candidate bundle
        if: inputs.candidate_run_id != ''
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          run-id: ${{ inputs.candidate_run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          name: ${{ inputs.candidate_artifact_name }}
          path: ${{ runner.temp }}/candidate-bundle
      - name: Stage the verified release bundle as the journey candidate
        if: inputs.candidate_run_id != ''
        env:
          CANDIDATE_BUNDLE_DIR: ${{ runner.temp }}/candidate-bundle
          CANDIDATE_BUNDLE_DIGEST: ${{ inputs.candidate_bundle_digest }}
          CANDIDATE_ID: ${{ inputs.candidate_id }}
          COMMIT_SHA: ${{ inputs.candidate_commit }}
          FLOW: ${{ inputs.candidate_flow }}
          VERSION: ${{ inputs.candidate_version }}
          CHANNEL: ${{ inputs.candidate_channel }}
          CANDIDATE_RUN_ID: ${{ inputs.candidate_run_id }}
          JOURNEY_PACKAGES_DIR: e2e/packages
          JOURNEY_CANDIDATE_DIR: .journey/release/journey-candidate
        run: |
          pnpm --filter @kb-labs/release run build:cli
          node plugins/release/scripts/stage-sealed-journey-candidate.mjs
      - id: matrix
        name: Select journeys from release case claims
        run: printf 'journeys=%s\n' "$(python3 e2e/journey/select_from_cases.py)" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: installer-journey-candidate
          path: |
            e2e/packages/*.tgz
            .journey/release/**
            .journey/runner-inputs/**
          if-no-files-found: error
          retention-days: 1
          include-hidden-files: true

  journey:
    name: Journey ${{ matrix.case }}
    needs: prepare
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        case: ${{ fromJSON(needs.prepare.outputs.journeys) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.ref || github.sha }}
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: installer-journey-candidate
      - name: Verify the staged payload digest
        if: inputs.candidate_run_id != ''
        env:
          EXPECTED_BUNDLE_DIGEST: ${{ inputs.candidate_bundle_digest }}
        run: test "$(cat .journey/release/journey-candidate/candidate-bundle-digest.txt)" = "$EXPECTED_BUNDLE_DIGEST"
      - name: Run journey in a fresh container
        env:
          KB_JOURNEY_SERVICE_PROFILE: ${{ startsWith(matrix.case, 'service-') && 'nightly' || '' }}
          KB_JOURNEY_ONLY: ${{ matrix.case }}
        run: e2e/journey/run.sh --no-build
      - name: Stop journey containers
        if: always()
        run: e2e/journey/run.sh --down
      - name: Add journey report to job summary
        if: always()
        run: if [ -f .journey/reports/journey-summary.md ]; then cat .journey/reports/journey-summary.md >> "$GITHUB_STEP_SUMMARY"; fi
      - name: Summarize journey invocation timings
        if: always()
        run: |
          python3 - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          from collections import defaultdict
          from pathlib import Path

          calls = Path('.journey/reports/invocations/calls.jsonl')
          if calls.is_file():
              totals = defaultdict(lambda: [0, 0.0])
              first = last = None
              count = 0
              for line in calls.open(encoding='utf-8'):
                  try:
                      row = json.loads(line)
                  except json.JSONDecodeError:
                      continue
                  step = row.get('step_id')
                  if not isinstance(step, str):
                      continue
                  seconds = row.get('duration_seconds')
                  seconds = seconds if isinstance(seconds, (int, float)) else 0
                  totals[step][0] += 1
                  totals[step][1] += seconds
                  first = first or step
                  last = step
                  count += 1
              print('### Journey invocation timing')
              print(f'{count} recorded calls; first step: `{first or "unknown"}`; last step: `{last or "unknown"}`.')
              print('Durations are cumulative subprocess time by case step (they do not include gaps between calls).')
              for step, (calls_count, seconds) in sorted(totals.items(), key=lambda item: item[1][1], reverse=True)[:10]:
                  print(f'- `{step}`: {calls_count} calls, {seconds:.1f}s')
          PY
      - id: artifact-name
        name: Sanitize journey artifact name
        if: always()
        env:
          MATRIX_OS: ${{ matrix.os }}
          MATRIX_CASE: ${{ matrix.case }}
        run: printf 'name=%s\n' "$(node scripts/ci/sanitize-artifact-name.mjs "$MATRIX_OS" "$MATRIX_CASE")" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: ${{ steps.artifact-name.outputs.name }}
          path: |
            .journey/reports/service-*.json
            .journey/reports/installer-case-*.json
            .journey/reports/qa-evidence/**
            .journey/reports/invocations/**
            .journey/reports/journey-summary.md
          if-no-files-found: ignore
          retention-days: 90

  native_macos:
    name: Native macOS installer smoke
    needs: prepare
    runs-on: macos-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.ref || github.sha }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: package.json
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version: '1.26.11'
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: installer-journey-candidate
      - name: Verify the staged payload digest
        if: inputs.candidate_run_id != ''
        env:
          EXPECTED_BUNDLE_DIGEST: ${{ inputs.candidate_bundle_digest }}
        run: test "$(cat .journey/release/journey-candidate/candidate-bundle-digest.txt)" = "$EXPECTED_BUNDLE_DIGEST"
      - name: Install candidate natively and smoke the installed CLI
        run: e2e/journey/native-macos-smoke.sh
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: service-journey-results-macos-native
          path: |
            .journey/reports/service-native-macos.json
            .journey/reports/invocations/native-macos/**
          if-no-files-found: ignore
          retention-days: 90

  coverage:
    name: Release case coverage
    needs: [prepare, journey, native_macos]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.ref || github.sha }}
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86
        with: { run_install: false }
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: package.json
          cache: pnpm
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version: '1.26.11'
          cache-dependency-path: tools/kb-devkit/go.sum
      - name: Restore journey results
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          pattern: service-journey-results-*
          path: .journey/reports
          merge-multiple: true
      - name: Build the case coverage CLI
        run: |
          make build -C tools/kb-devkit
          e2e/journey/install-workspace-dependencies.sh
          ./tools/kb-devkit/kb-devkit run build --packages "$(node tools/kb-create/scripts/release-flow-roots.mjs platform),@kb-labs/qa"
      - name: Enforce local and secured release case coverage
        run: |
          run_files=$(find .journey/reports -type f -name 'service-*.json' -print | sort | paste -sd, -)
          coverage_status=0
          for mode in local secured; do
            args=(qa coverage show --level release --mode "$mode")
            if [ -n "$run_files" ]; then args+=(--run "$run_files"); fi
            node ./cli/bin/dist/bin.js "${args[@]}" || coverage_status=1
          done
          exit "$coverage_status"

  evidence_diagnostic:
    name: Hosted installer evidence diagnostic
    needs: [prepare, journey]
    if: ${{ always() && !cancelled() }}
    continue-on-error: true
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.ref || github.sha }}
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86
        with: { run_install: false }
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: package.json
          cache: pnpm
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version: '1.26.11'
          cache-dependency-path: tools/kb-devkit/go.sum
      - name: Restore local installer reports for diagnostics
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        continue-on-error: true
        with:
          pattern: service-journey-results-*
          path: .journey/reports
          merge-multiple: true
      - name: Restore candidate for diagnostics
        id: restore-candidate
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        continue-on-error: true
        with:
          name: installer-journey-candidate
          path: .journey/candidate
      - name: Prepare an independent diagnostic plan
        id: evidence-inputs
        run: |
          mkdir -p .journey/diagnostics .journey/reports
          index=.journey/candidate/.journey/release/release-index.json
          if [ ! -f "$index" ]; then index=-; fi
          if ! node scripts/ci/installer-evidence-plan.mjs "$index" \
            tools/clikit/toolchain/node_policy_gen.json \
            .journey/diagnostics/pc001-local-plan.json .journey/reports \
            .journey/diagnostics/pc001-local-manifest.json; then
            if [ -f .journey/diagnostics/pc001-local-manifest.json ]; then
              node scripts/ci/summarize-installer-evidence.mjs - \
                .journey/diagnostics/pc001-local-manifest.json \
                .journey/diagnostics/pc001-local-summary.json
            else
              printf '{"status":"INCOMPLETE","behaviorStatus":"NOT RUN","evidenceStatus":"INCOMPLETE","releasePassed":false,"reason":"Candidate plan or retained installer report is invalid."}\n' > .journey/diagnostics/pc001-local-summary.json
            fi
            printf 'has_records=false\n' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          record_count=$(node -e 'const m=require("./.journey/diagnostics/pc001-local-manifest.json");process.stdout.write(String(m.records.length))')
          if [ "$index" = "-" ]; then
            node scripts/ci/summarize-installer-evidence.mjs - \
              .journey/diagnostics/pc001-local-manifest.json \
              .journey/diagnostics/pc001-local-summary.json
            printf 'has_records=false\n' >> "$GITHUB_OUTPUT"
          elif [ "$record_count" -gt 0 ]; then
            printf 'has_records=true\n' >> "$GITHUB_OUTPUT"
          else
            node scripts/ci/summarize-installer-evidence.mjs - \
              .journey/diagnostics/pc001-local-manifest.json \
              .journey/diagnostics/pc001-local-summary.json
            printf 'has_records=false\n' >> "$GITHUB_OUTPUT"
          fi
      - name: Build the case coverage CLI for diagnostics
        if: steps.evidence-inputs.outputs.has_records == 'true'
        run: |
          make build -C tools/kb-devkit
          e2e/journey/install-workspace-dependencies.sh
          ./tools/kb-devkit/kb-devkit run build --packages "$(node tools/kb-create/scripts/release-flow-roots.mjs platform),@kb-labs/qa"
      - name: Evaluate hosted PC-001.2 evidence diagnostically
        if: steps.evidence-inputs.outputs.has_records == 'true'
        continue-on-error: true
        run: |
          run_files=$(node -e 'const m=require("./.journey/diagnostics/pc001-local-manifest.json");process.stdout.write(m.records.map(r=>r.path).join(","))')
          set +e
          node ./cli/bin/dist/bin.js qa coverage show --level all --mode local \
            --evidence --evidence-plan .journey/diagnostics/pc001-local-plan.json \
            --run "$run_files" --json > .journey/diagnostics/pc001-local-evaluation.json
          evaluation_status=$?
          set -e
          node scripts/ci/summarize-installer-evidence.mjs \
            .journey/diagnostics/pc001-local-evaluation.json \
            .journey/diagnostics/pc001-local-manifest.json \
            .journey/diagnostics/pc001-local-summary.json
          exit "$evaluation_status"
      - name: Finalize an incomplete diagnostic if evaluation could not run
        if: always()
        run: |
          mkdir -p .journey/diagnostics
          if [ ! -f .journey/diagnostics/pc001-local-manifest.json ]; then
            printf '{"records":[],"invalid":[]}\n' > .journey/diagnostics/pc001-local-manifest.json
          fi
          if [ ! -f .journey/diagnostics/pc001-local-summary.json ]; then
            node scripts/ci/summarize-installer-evidence.mjs - \
              .journey/diagnostics/pc001-local-manifest.json \
              .journey/diagnostics/pc001-local-summary.json
          fi
      - name: Upload diagnostic evidence evaluation
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: installer-evidence-diagnostic
          path: .journey/diagnostics/**
          if-no-files-found: warn
          retention-days: 7
