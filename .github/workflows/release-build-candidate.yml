name: Release — build immutable candidate

# This workflow is the execution boundary for the KB workflow engine. It does
# not choose versions, channels or package membership. The caller supplies an
# immutable release intent; this job produces one candidate bundle from it.

on:
  workflow_dispatch:
    inputs:
      candidate_id:
        description: Immutable candidate identifier from the workflow engine
        required: true
        type: string
      commit_sha:
        description: Full source commit to build
        required: true
        type: string
      flow:
        description: Release flow selected by the workflow engine
        required: true
        type: choice
        options: [platform]
      version:
        description: Exact release version selected by the workflow engine
        required: true
        type: string
      channel:
        description: Candidate channel selected by the workflow engine
        required: true
        type: choice
        options: [canary, stable]

permissions:
  contents: read

concurrency:
  group: release-candidate-${{ inputs.candidate_id }}
  cancel-in-progress: false

jobs:
  resolve-gate-policy:
    name: Resolve declared release gate policy
    runs-on: ubuntu-latest
    outputs:
      required: ${{ steps.policy.outputs.required }}
      policy: ${{ steps.policy.outputs.policy }}
      target: ${{ steps.policy.outputs.target }}
    steps:
      - name: Checkout exact intent commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.commit_sha }}
          fetch-depth: 1
      - name: Resolve flow gate policy
        id: policy
        env:
          FLOW: ${{ inputs.flow }}
          CHANNEL: ${{ inputs.channel }}
        run: node .kb/workflows/scripts/resolve-candidate-gate.mjs --flow "$FLOW" --channel "$CHANNEL"

  journey-gate:
    name: Clean installer journey gate
    uses: ./.github/workflows/reusable-installer-journey.yml
    if: needs.resolve-gate-policy.outputs.required == 'true'
    needs: resolve-gate-policy
    with:
      ref: ${{ inputs.commit_sha }}
    permissions:
      contents: read

  build:
    name: Build candidate ${{ inputs.candidate_id }}
    needs: [resolve-gate-policy, journey-gate]
    if: >-
      always() &&
      needs.resolve-gate-policy.result == 'success' &&
      ((needs.resolve-gate-policy.outputs.required != 'true' && needs.journey-gate.result == 'skipped') ||
       (needs.resolve-gate-policy.outputs.required == 'true' && needs.journey-gate.result == 'success'))
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout exact intent commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.commit_sha }}
          fetch-depth: 0

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86
        with:
          run_install: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
          cache: pnpm
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version: '1.26.8'
          cache: false

      - name: Build kb-devkit
        run: go build -o kb-devkit .
        working-directory: tools/kb-devkit

      - name: Install exact workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Bootstrap KB Labs release tooling
        # The release plugin owns the governed dependency-order release build run
        # below. Building the whole workspace here duplicates that work and
        # enters the generic rspack/DTS path that release build runs deliberately
        # avoid. Bootstrap only the platform CLI and release command surface.
        run: ./tools/kb-devkit/kb-devkit run build --packages @kb-labs/cli-bin,@kb-labs/release --no-cache

      - name: Hydrate release plan paths for candidate workspace
        # Plans are per-run state and are not part of the immutable source
        # commit. Recompute package membership in this candidate workspace;
        # canary version application later reuses this flow/channel plan.
        env:
          FLOW: ${{ inputs.flow }}
          CHANNEL: ${{ inputs.channel }}
          COMMIT_SHA: ${{ inputs.commit_sha }}
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs = require('node:fs');
          const path = require('node:path');
          const { execFileSync } = require('node:child_process');
          const root = process.cwd();
          const planPath = path.join(root, '.kb', 'release', 'plans', 'root', 'current', 'plan.json');
          execFileSync('node', ['./cli/bin/dist/bin.js', 'release', 'plan',
            '--flow', process.env.FLOW, '--channel', process.env.CHANNEL, '--bump', 'auto', '--json'],
            { cwd: root, stdio: 'inherit' });
          const plan = JSON.parse(fs.readFileSync(planPath, 'utf8'));
          if (plan.flow !== process.env.FLOW || plan.channel !== process.env.CHANNEL) {
            throw new Error(`regenerated release plan does not match requested flow/channel: ${plan.flow}/${plan.channel}`);
          }
          if (process.env.CHANNEL === 'canary') {
            const short = process.env.COMMIT_SHA.slice(0, 9);
            for (const item of plan.packages) {
              if (item.nextVersion.includes('-canary.')) {
                item.nextVersion = item.nextVersion.replace(/-canary\.[^.]+$/, `-canary.${short}`);
              }
            }
          }
          const packages = new Map();
          const walk = directory => {
            for (const entry of fs.readdirSync(directory, { withFileTypes: true })) {
              if (entry.name === 'node_modules' || entry.name === '.git' || entry.name === 'dist') continue;
              const target = path.join(directory, entry.name);
              if (entry.isDirectory()) walk(target);
              else if (entry.name === 'package.json') {
                const manifest = JSON.parse(fs.readFileSync(target, 'utf8'));
                if (manifest.name) packages.set(manifest.name, path.dirname(target));
              }
            }
          };
          walk(root);
          for (const item of plan.packages) {
            const packagePath = packages.get(item.name);
            if (!packagePath) throw new Error(`release plan package is absent from candidate workspace: ${item.name}`);
            item.path = packagePath;
          }
          fs.writeFileSync(planPath, `${JSON.stringify(plan, null, 2)}\n`);
          NODE

      - name: Apply planned package versions
        # Only the canary channel needs this step. release-prepare.yml's
        # "Bump versions"/"Commit and tag" steps run ONLY when
        # inputs.channel == 'stable' (see .kb/workflows/release-prepare.yml)
        # — a stable candidate's commit_sha is therefore, by construction,
        # already at its final released version before this workflow ever
        # checks it out. Re-running `release version update` (bump=auto, default)
        # against that same commit is not a no-op: `getCommitsSinceTag`
        # finds the tag this very commit carries, the commit range against
        # HEAD is empty, and — independent of any manager-core version-bump
        # fix present on master — the lockstep strategy's `getMaxBump()`
        # floors at 'patch' whenever no package resolves to
        # an explicit major/minor bump, so it invents a patch bump on top of
        # an already-tagged version regardless of the --bump value passed in
        # (verified directly: `--bump none` against this repo's lockstep
        # path still floors to a patch bump). That's how 2.119.0 became
        # 2.119.1 in candidate run 33981110517. A manager-core code fix
        # cannot help an already-tagged commit either way: "Checkout exact
        # intent commit" above pins plugins/release/src/core itself to
        # that commit's own (possibly pre-fix) source, by design — this
        # workflow builds exactly what was tagged, immutably.
        #
        # canary builds are the opposite: release-prepare deliberately skips
        # git mutations for canary, so package.json on disk is still at the
        # PREVIOUS release's version and this step is what actually applies
        # the plan's canary-suffixed nextVersion (already patched onto
        # plan.json by "Hydrate release plan paths" above). Keep running it
        # there.
        if: inputs.channel != 'stable'
        env:
          FLOW: ${{ inputs.flow }}
          CHANNEL: ${{ inputs.channel }}
        # --channel must be passed explicitly so a fresh resolve uses the same
        # channel as the candidate plan generated above. Without it a fresh
        # replan defaults to stable and drops the canary suffix from every
        # package's version, not just one.
        run: pnpm kb release version update --flow "$FLOW" --channel "$CHANNEL" --json

      - name: Verify pre-versioned stable candidate
        # For channel == 'stable' this replaces the step above: verify the
        # invariant instead of trusting it silently. Every package the
        # hydrated plan tracks must already be on disk at inputs.version —
        # if that's ever false (a broken release-prepare run, a manually
        # dispatched commit_sha that was never actually prepared as this
        # exact version, etc.) fail loudly here rather than build and seal
        # a candidate under the wrong version number.
        if: inputs.channel == 'stable'
        env:
          EXPECTED_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs = require('node:fs');
          const path = require('node:path');
          const planPath = path.join(process.cwd(), '.kb', 'release', 'plans', 'root', 'current', 'plan.json');
          const plan = JSON.parse(fs.readFileSync(planPath, 'utf8'));
          const expected = process.env.EXPECTED_VERSION;
          const mismatches = [];
          for (const pkg of plan.packages) {
            const pkgJsonPath = path.join(pkg.path, 'package.json');
            const onDisk = JSON.parse(fs.readFileSync(pkgJsonPath, 'utf8')).version;
            if (onDisk !== expected) mismatches.push(`${pkg.name}: ${onDisk} (expected ${expected})`);
          }
          if (mismatches.length > 0) {
            throw new Error(
              `stable candidate commit is not already versioned at ${expected} — release-prepare's ` +
              `"Bump versions"/"Commit and tag" steps should have applied this before dispatch:\n` +
              mismatches.join('\n'),
            );
          }
          console.log(`Verified ${plan.packages.length} package(s) already at ${expected}; skipping re-bump.`);
          NODE

      - name: Build selected release flow
        env:
          FLOW: ${{ inputs.flow }}
        run: pnpm kb release build run --flow "$FLOW" --json

      - name: Stage exact npm artifacts
        env:
          FLOW: ${{ inputs.flow }}
        run: pnpm kb release artifact create --flow "$FLOW" --out-dir .kb/release/artifacts --json

      - name: Build exact Go binary assets
        uses: goreleaser/goreleaser-action@ec59f474b9834571250b370d4735c50f8e2d1e29
        if: inputs.flow == 'platform'
        env:
          GORELEASER_CURRENT_TAG: v${{ inputs.version }}-binaries
        with:
          version: latest
          args: release --snapshot --clean --skip=publish

      - name: Generate binary manifest from checksums
        if: inputs.flow == 'platform'
        env:
          CANDIDATE_ID: ${{ inputs.candidate_id }}
          VERSION: ${{ inputs.version }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          test -s dist/checksums.txt
          node tools/kb-create/scripts/prepare-binary-manifest.mjs \
            --checksums dist/checksums.txt \
            --repository "$REPOSITORY" \
            --release-tag "v${VERSION}-binaries" \
            --version "$VERSION" \
            --output .kb/release/binary-manifest.json

      - name: Seal unified release index
        if: inputs.flow == 'platform'
        env:
          FLOW: ${{ inputs.flow }}
          CHANNEL: ${{ inputs.channel }}
          SOURCE_REVISION: ${{ inputs.commit_sha }}
        run: |
          set -euo pipefail
          node e2e/platform/package-provenance.mjs \
            --packages-dir .kb/release/artifacts \
            --source-revision "$SOURCE_REVISION" \
            --output .kb/release/provenance.json
          config_json="$(node --input-type=module -e '
            import { readPlatformReleaseConfig } from "./tools/kb-create/scripts/platform-release-config.mjs";
            process.stdout.write(JSON.stringify(readPlatformReleaseConfig("./.kb/kb.config.jsonc")));
          ')"
          platform_members="$(node -e 'const d=JSON.parse(require("fs").readFileSync(0,"utf8")); process.stdout.write(d.platformMembers.join(","));' <<< "$config_json")"
          platform_requires="$(node -e 'const d=JSON.parse(require("fs").readFileSync(0,"utf8")); process.stdout.write(d.platformRequires.join(","));' <<< "$config_json")"
          platform_adapters="$(node -e 'const d=JSON.parse(require("fs").readFileSync(0,"utf8")); process.stdout.write(JSON.stringify(d.adapters));' <<< "$config_json")"
          platform_adapter_options="$(node -e 'const d=JSON.parse(require("fs").readFileSync(0,"utf8")); process.stdout.write(JSON.stringify(d.adapterOptions));' <<< "$config_json")"
          node tools/kb-create/scripts/prepare-release-index.mjs \
            --flow "$FLOW" \
            --channel "$CHANNEL" \
            --artifacts-dir .kb/release/artifacts \
            --provenance-manifest .kb/release/provenance.json \
            --binary-manifest .kb/release/binary-manifest.json \
            --platform-member-packages "$platform_members" \
            --platform-requires "$platform_requires" \
            --platform-adapter-config "$platform_adapters" \
            --platform-adapter-options "$platform_adapter_options" \
            --output .kb/release/release-index.json

      - name: Verify sealed platform version
        if: inputs.flow == 'platform'
        env:
          EXPECTED_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs = require('node:fs');
          const index = JSON.parse(fs.readFileSync('.kb/release/release-index.json', 'utf8'));
          const platform = (index.platforms ?? []).find((artifact) => artifact.id === 'platform');
          if (!platform) throw new Error('sealed release index has no platform artifact');
          if (platform.version !== process.env.EXPECTED_VERSION) {
            throw new Error(`sealed platform version mismatch: ${platform.version} != ${process.env.EXPECTED_VERSION}`);
          }
          NODE

      - name: Assemble and seal candidate bundle
        env:
          CANDIDATE_ID: ${{ inputs.candidate_id }}
          COMMIT_SHA: ${{ inputs.commit_sha }}
          FLOW: ${{ inputs.flow }}
          VERSION: ${{ inputs.version }}
          CHANNEL: ${{ inputs.channel }}
          GATE_POLICY: ${{ needs.resolve-gate-policy.outputs.policy }}
          GATE_RESULT: ${{ needs.journey-gate.result == 'success' && 'passed' || 'skipped' }}
          GATE_RUN_ID: ${{ needs.journey-gate.result == 'success' && github.run_id || '' }}
          RUN_ID: ${{ github.run_id }}
          ARTIFACTS_DIR: .kb/release/artifacts
          BUNDLE_DIR: .kb/release/bundle
          RELEASE_INDEX_PATH: .kb/release/release-index.json
          BINARY_MANIFEST_PATH: .kb/release/binary-manifest.json
          BINARIES_DIR: dist
        run: |
          set -euo pipefail
          node plugins/release/scripts/create-candidate-bundle.mjs

      - name: Upload immutable candidate bundle
        id: upload-candidate
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: release-candidate-${{ inputs.candidate_id }}
          path: .kb/release/bundle
          if-no-files-found: error
          retention-days: 30

      - name: Record hosted artifact digest outside the bundle
        env:
          ARTIFACT_DIGEST: ${{ steps.upload-candidate.outputs.artifact-digest }}
        run: |
          set -euo pipefail
          test -n "$ARTIFACT_DIGEST"
          printf '\n- **Actions artifact archive digest:** `%s`\n' "$ARTIFACT_DIGEST" >> "$GITHUB_STEP_SUMMARY"
