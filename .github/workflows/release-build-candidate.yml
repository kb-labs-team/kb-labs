name: Release — build immutable candidate

# This workflow is the execution boundary for the KB workflow engine. It does
# not choose versions, channels or package membership. The caller supplies an
# immutable release intent; this job produces one candidate bundle from it.

on:
  workflow_dispatch:
    inputs:
      candidate_id:
        description: Immutable candidate identifier from the workflow engine
        required: true
        type: string
      commit_sha:
        description: Full source commit to build
        required: true
        type: string
      flow:
        description: Release flow selected by the workflow engine
        required: true
        type: choice
        options: [platform, sdk]
      version:
        description: Exact release version selected by the workflow engine
        required: true
        type: string
      channel:
        description: Candidate channel selected by the workflow engine
        required: true
        type: choice
        options: [canary, stable]

permissions:
  contents: read

concurrency:
  group: release-candidate-${{ inputs.candidate_id }}
  cancel-in-progress: false

jobs:
  build:
    name: Build candidate ${{ inputs.candidate_id }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout exact intent commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.commit_sha }}
          fetch-depth: 0

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86
        with:
          run_install: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
          cache: pnpm
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version: '1.26.8'
          cache: false

      - name: Build kb-devkit
        run: go build -o kb-devkit .
        working-directory: tools/kb-devkit

      - name: Install exact workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Bootstrap KB Labs release tooling
        # The release plugin owns the governed dependency-order release build
        # below. Building the whole workspace here duplicates that work and
        # enters the generic rspack/DTS path that release builds deliberately
        # avoid. Bootstrap only the platform CLI and release command surface.
        run: ./tools/kb-devkit/kb-devkit run build --packages @kb-labs/cli-bin,@kb-labs/release-manager-cli --no-cache

      - name: Hydrate release plan paths for candidate workspace
        # All release flows share one scope-derived plan.json path (see
        # resolve-plan.ts), so the committed artifact checked out at
        # commit_sha can legitimately belong to whichever flow last ran
        # release-prepare's "Commit and tag" step (stable channel only —
        # canary never commits its freshly computed plan). For a canary
        # build that means this file is routinely for a DIFFERENT flow
        # entirely, not just a stale version of the same one. Hard-failing
        # on that here used to pre-empt the "Apply planned package
        # versions" step below, whose `pnpm kb release version` call goes
        # through resolvePlan() and already treats a foreign-flow artifact
        # as unconditionally stale, recomputing fresh via planRelease() —
        # so skip hydration (and let that step supply correct paths) for a
        # canary flow mismatch instead of throwing. A stable build's plan
        # is expected to already match exactly (it was committed by this
        # same release-prepare run just before dispatch), so keep failing
        # loudly there — a mismatch means something upstream is broken.
        env:
          FLOW: ${{ inputs.flow }}
          CHANNEL: ${{ inputs.channel }}
          COMMIT_SHA: ${{ inputs.commit_sha }}
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs = require('node:fs');
          const path = require('node:path');
          const root = process.cwd();
          const planPath = path.join(root, '.kb', 'release', 'plans', 'root', 'current', 'plan.json');
          const plan = JSON.parse(fs.readFileSync(planPath, 'utf8'));
          if (plan.flow !== process.env.FLOW) {
            if (process.env.CHANNEL !== 'canary') {
              throw new Error(`release plan flow mismatch: ${plan.flow} != ${process.env.FLOW}`);
            }
            console.log(`Committed plan.json is for flow "${plan.flow}", not "${process.env.FLOW}" — ` +
              `skipping hydration; "Apply planned package versions" will recompute it fresh.`);
            process.exit(0);
          }
          if (process.env.CHANNEL === 'canary') {
            const short = process.env.COMMIT_SHA.slice(0, 9);
            for (const item of plan.packages ?? []) {
              if (typeof item.nextVersion === 'string' && item.nextVersion.includes('-canary.')) {
                item.nextVersion = item.nextVersion.replace(/-canary\.[^.]+$/, `-canary.${short}`);
              }
            }
          }
          const packages = new Map();
          const walk = directory => {
            for (const entry of fs.readdirSync(directory, { withFileTypes: true })) {
              if (entry.name === 'node_modules' || entry.name === '.git' || entry.name === 'dist') continue;
              const target = path.join(directory, entry.name);
              if (entry.isDirectory()) walk(target);
              else if (entry.name === 'package.json') {
                const manifest = JSON.parse(fs.readFileSync(target, 'utf8'));
                if (manifest.name) packages.set(manifest.name, path.dirname(target));
              }
            }
          };
          walk(root);
          for (const item of plan.packages ?? []) {
            const packagePath = packages.get(item.name);
            if (!packagePath) throw new Error(`release plan package is absent from candidate workspace: ${item.name}`);
            item.path = packagePath;
          }
          fs.writeFileSync(planPath, `${JSON.stringify(plan, null, 2)}\n`);
          NODE

      - name: Apply planned package versions
        # Only the canary channel needs this step. release-prepare.yml's
        # "Bump versions"/"Commit and tag" steps run ONLY when
        # inputs.channel == 'stable' (see .kb/workflows/release-prepare.yml)
        # — a stable candidate's commit_sha is therefore, by construction,
        # already at its final released version before this workflow ever
        # checks it out. Re-running `release version` (bump=auto, default)
        # against that same commit is not a no-op: `getCommitsSinceTag`
        # finds the tag this very commit carries, the commit range against
        # HEAD is empty, and — independent of any manager-core version-bump
        # fix present on master — the lockstep strategy's `getMaxBump()`
        # floors at 'patch' whenever no package resolves to
        # an explicit major/minor bump, so it invents a patch bump on top of
        # an already-tagged version regardless of the --bump value passed in
        # (verified directly: `--bump none` against this repo's lockstep
        # path still floors to a patch bump). That's how 2.119.0 became
        # 2.119.1 in candidate run 33981110517. A manager-core code fix
        # cannot help an already-tagged commit either way: "Checkout exact
        # intent commit" above pins plugins/release/manager-core itself to
        # that commit's own (possibly pre-fix) source, by design — this
        # workflow builds exactly what was tagged, immutably.
        #
        # canary builds are the opposite: release-prepare deliberately skips
        # git mutations for canary, so package.json on disk is still at the
        # PREVIOUS release's version and this step is what actually applies
        # the plan's canary-suffixed nextVersion (already patched onto
        # plan.json by "Hydrate release plan paths" above). Keep running it
        # there.
        if: inputs.channel != 'stable'
        env:
          FLOW: ${{ inputs.flow }}
          CHANNEL: ${{ inputs.channel }}
        # --channel must be passed explicitly. release:version's resolvePlan()
        # reuses the plan.json checked out at commit_sha only when it provably
        # matches the current working tree (see resolve-plan.ts); for canary
        # that plan.json is NOT guaranteed fresh — canary deliberately skips
        # the git commit that would carry a just-computed plan forward (see
        # "Bump versions"/"Commit and tag" in release-prepare.yml, gated on
        # channel == stable) — so the checked-out artifact can legitimately
        # still be whatever a previous release cycle last committed. When
        # resolvePlan rejects it as stale, it recomputes via planRelease()
        # fresh; without --channel here that recompute silently defaults to
        # 'stable' and drops the -canary.<sha> suffix from every package's
        # version, not just one — this is what produced candidate run
        # 33991804236's "sealed platform version mismatch: 2.119.1 !=
        # 2.119.1-canary.9dffabc24" (core-runtime was simply the one package
        # whose version happens to get compared against inputs.version).
        run: pnpm kb release version --flow "$FLOW" --channel "$CHANNEL" --json

      - name: Verify pre-versioned stable candidate
        # For channel == 'stable' this replaces the step above: verify the
        # invariant instead of trusting it silently. Every package the
        # hydrated plan tracks must already be on disk at inputs.version —
        # if that's ever false (a broken release-prepare run, a manually
        # dispatched commit_sha that was never actually prepared as this
        # exact version, etc.) fail loudly here rather than build and seal
        # a candidate under the wrong version number.
        if: inputs.channel == 'stable'
        env:
          EXPECTED_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs = require('node:fs');
          const path = require('node:path');
          const planPath = path.join(process.cwd(), '.kb', 'release', 'plans', 'root', 'current', 'plan.json');
          const plan = JSON.parse(fs.readFileSync(planPath, 'utf8'));
          const expected = process.env.EXPECTED_VERSION;
          const mismatches = [];
          for (const pkg of plan.packages ?? []) {
            const pkgJsonPath = path.join(pkg.path, 'package.json');
            const onDisk = JSON.parse(fs.readFileSync(pkgJsonPath, 'utf8')).version;
            if (onDisk !== expected) mismatches.push(`${pkg.name}: ${onDisk} (expected ${expected})`);
          }
          if (mismatches.length > 0) {
            throw new Error(
              `stable candidate commit is not already versioned at ${expected} — release-prepare's ` +
              `"Bump versions"/"Commit and tag" steps should have applied this before dispatch:\n` +
              mismatches.join('\n'),
            );
          }
          console.log(`Verified ${plan.packages.length} package(s) already at ${expected}; skipping re-bump.`);
          NODE

      - name: Build selected release flow
        env:
          FLOW: ${{ inputs.flow }}
        run: pnpm kb release build --flow "$FLOW" --json

      - name: Stage exact npm artifacts
        env:
          FLOW: ${{ inputs.flow }}
        run: pnpm kb release stage --flow "$FLOW" --out-dir .kb/release/artifacts --json

      - name: Stage latest published compatible SDK for platform compatibility
        if: inputs.flow == 'platform'
        run: |
          set -euo pipefail
          # A platform canary does not version or publish the SDK flow.  Building
          # a fresh SDK tarball with the existing SDK version made the sealed
          # index attest bytes which do not exist in npm, so a clean install
          # failed its checksum verification.  The platform index must instead
          # reference an immutable, already-published SDK artifact.  The index
          # builder verifies that this latest SDK's peer range accepts the
          # platform candidate and fails closed otherwise.
          rm -rf .kb/release/sdk-artifacts
          mkdir -p .kb/release/sdk-artifacts
          packed="$(npm pack '@kb-labs/sdk@latest' --pack-destination .kb/release/sdk-artifacts --json)"
          node -e '
            const { createHash } = require("node:crypto");
            const { readFileSync, writeFileSync } = require("node:fs");
            const { join } = require("node:path");
            const directory = ".kb/release/sdk-artifacts";
            const [entry] = JSON.parse(readFileSync(0, "utf8"));
            if (!entry?.name || !entry?.version || !entry?.filename) throw new Error("npm pack did not return an SDK artifact");
            const payload = readFileSync(join(directory, entry.filename));
            writeFileSync(join(directory, "manifest.json"), JSON.stringify([{
              name: entry.name,
              version: entry.version,
              tarball: entry.filename,
              sha256: createHash("sha256").update(payload).digest("hex"),
            }]) + "\n");
          ' <<< "$packed"

      - name: Build exact Go binary assets
        uses: goreleaser/goreleaser-action@ec59f474b9834571250b370d4735c50f8e2d1e29
        if: inputs.flow == 'platform'
        env:
          GORELEASER_CURRENT_TAG: v${{ inputs.version }}-binaries
        with:
          version: latest
          args: release --snapshot --clean --skip=publish

      - name: Generate binary manifest from checksums
        if: inputs.flow == 'platform'
        env:
          CANDIDATE_ID: ${{ inputs.candidate_id }}
          VERSION: ${{ inputs.version }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          test -s dist/checksums.txt
          node tools/kb-create/scripts/prepare-binary-manifest.mjs \
            --checksums dist/checksums.txt \
            --repository "$REPOSITORY" \
            --release-tag "v${VERSION}-binaries" \
            --output .kb/release/binary-manifest.json

      - name: Seal unified release index
        if: inputs.flow == 'platform'
        env:
          FLOW: ${{ inputs.flow }}
          CHANNEL: ${{ inputs.channel }}
        run: |
          set -euo pipefail
          # .kb/kb.config.jsonc is the tracked dev config (see c2f829ea7); a
          # bare require() can't parse its comments, so strip them the same
          # way core/config/src/api/read-config.ts's stripJsonComments does
          # before parsing. .kb/kb.config.json is kept as a fallback so this
          # doesn't silently break again if the tracked filename changes.
          config_json="$(node -e '
            const fs = require("fs");
            function stripJsonComments(src) {
              let out = ""; let i = 0; const len = src.length;
              while (i < len) {
                if (src[i] === String.fromCharCode(34)) {
                  out += src[i++];
                  while (i < len) {
                    if (src[i] === "\\") { out += src[i++]; out += src[i++]; continue; }
                    out += src[i];
                    if (src[i++] === String.fromCharCode(34)) { break; }
                  }
                } else if (src[i] === "/" && src[i + 1] === "/") {
                  while (i < len && src[i] !== "\n") { i++; }
                } else if (src[i] === "/" && src[i + 1] === "*") {
                  i += 2;
                  while (i < len && !(src[i] === "*" && src[i + 1] === "/")) { i++; }
                  i += 2;
                } else {
                  out += src[i++];
                }
              }
              return out.replace(/,(\s*[}\]])/g, "$1");
            }
            const candidates = ["./.kb/kb.config.jsonc", "./.kb/kb.config.json"];
            const found = candidates.find((p) => fs.existsSync(p));
            if (!found) throw new Error("no .kb/kb.config.jsonc or .kb/kb.config.json found");
            const raw = fs.readFileSync(found, "utf8");
            const c = JSON.parse(found.endsWith(".jsonc") ? stripJsonComments(raw) : raw);
            const m = c.profiles?.find((p) => p.id === "default")?.products?.release?.flows?.platform?.platformMembers;
            if (!Array.isArray(m) || m.length === 0) throw new Error("release.flows.platform.platformMembers must be a non-empty array");
            if (!c.platform?.adapters) throw new Error("platform.adapters is required for a platform release index");
            process.stdout.write(JSON.stringify({
              platformMembers: m,
              adapters: c.platform.adapters,
              adapterOptions: c.platform.adapterOptions ?? {},
            }));
          ')"
          platform_members="$(node -e 'const d=JSON.parse(require("fs").readFileSync(0,"utf8")); process.stdout.write(d.platformMembers.join(","));' <<< "$config_json")"
          platform_adapters="$(node -e 'const d=JSON.parse(require("fs").readFileSync(0,"utf8")); process.stdout.write(JSON.stringify(d.adapters));' <<< "$config_json")"
          platform_adapter_options="$(node -e 'const d=JSON.parse(require("fs").readFileSync(0,"utf8")); process.stdout.write(JSON.stringify(d.adapterOptions));' <<< "$config_json")"
          node tools/kb-create/scripts/prepare-release-index.mjs \
            --flow "$FLOW" \
            --channel "$CHANNEL" \
            --artifacts-dir .kb/release/artifacts \
            --sdk-artifacts-dir .kb/release/sdk-artifacts \
            --binary-manifest .kb/release/binary-manifest.json \
            --platform-member-packages "$platform_members" \
            --platform-adapter-config "$platform_adapters" \
            --platform-adapter-options "$platform_adapter_options" \
            --output .kb/release/release-index.json

      - name: Verify sealed platform version
        if: inputs.flow == 'platform'
        env:
          EXPECTED_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs = require('node:fs');
          const index = JSON.parse(fs.readFileSync('.kb/release/release-index.json', 'utf8'));
          const platform = (index.platforms ?? []).find((artifact) => artifact.id === 'platform');
          if (!platform) throw new Error('sealed release index has no platform artifact');
          if (platform.version !== process.env.EXPECTED_VERSION) {
            throw new Error(`sealed platform version mismatch: ${platform.version} != ${process.env.EXPECTED_VERSION}`);
          }
          NODE

      - name: Create candidate provenance
        env:
          CANDIDATE_ID: ${{ inputs.candidate_id }}
          COMMIT_SHA: ${{ inputs.commit_sha }}
          FLOW: ${{ inputs.flow }}
          VERSION: ${{ inputs.version }}
          CHANNEL: ${{ inputs.channel }}
          RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          mkdir -p .kb/release/bundle
          cp -R .kb/release/artifacts .kb/release/bundle/npm
          if [ -f .kb/release/release-index.json ]; then cp .kb/release/release-index.json .kb/release/bundle/; fi
          if [ -f .kb/release/binary-manifest.json ]; then cp .kb/release/binary-manifest.json .kb/release/bundle/; fi
          if [ -d dist ]; then cp -R dist .kb/release/bundle/binaries; fi
          node -e '
            const fs = require("node:fs");
            const out = {
              schema: "kb.release-provenance/1",
              candidateId: process.env.CANDIDATE_ID,
              commit: process.env.COMMIT_SHA,
              flow: process.env.FLOW,
              version: process.env.VERSION,
              channel: process.env.CHANNEL,
              workflowRunId: process.env.RUN_ID,
            };
            fs.writeFileSync(".kb/release/bundle/provenance.json", JSON.stringify(out, null, 2) + "\n");
          '
          (
            cd .kb/release/bundle
            find . -type f ! -name bundle.sha256 ! -name bundle.sha256.tmp -printf '%m  %p\n' | sort > bundle.modes
            find . -type f ! -name bundle.sha256 ! -name bundle.sha256.tmp -print0 | sort -z | xargs -0 sha256sum > bundle.sha256.tmp
            mv bundle.sha256.tmp bundle.sha256
          )

      - name: Upload immutable candidate bundle
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: release-candidate-${{ inputs.candidate_id }}
          path: .kb/release/bundle
          if-no-files-found: error
          retention-days: 30
