name: Release — build immutable candidate

# This workflow is the execution boundary for the KB workflow engine. It does
# not choose versions, channels or package membership. The caller supplies an
# immutable release intent; this job produces one candidate bundle from it.

on:
  workflow_dispatch:
    inputs:
      deliver_canary:
        description: Publish this canary candidate to the canary endpoints
        required: false
        type: boolean
        default: false
      candidate_id:
        description: Immutable candidate identifier from the workflow engine
        required: true
        type: string
      commit_sha:
        description: Full source commit to build
        required: true
        type: string
      flow:
        description: Release flow selected by the workflow engine
        required: true
        type: choice
        options: [platform]
      version:
        description: Exact release version selected by the workflow engine
        required: true
        type: string
      channel:
        description: Candidate channel selected by the workflow engine
        required: true
        type: choice
        options: [canary, stable]

permissions:
  contents: read
  actions: read
  checks: read

concurrency:
  group: ${{ inputs.deliver_canary && 'release-candidate-canary-delivery' || format('release-candidate-{0}', inputs.candidate_id) }}
  cancel-in-progress: false

jobs:
  resolve-gate-policy:
    name: Resolve declared release gate policy
    runs-on: ubuntu-latest
    outputs:
      required: ${{ steps.policy.outputs.required }}
      policy: ${{ steps.policy.outputs.policy }}
      target: ${{ steps.policy.outputs.target }}
    steps:
      - name: Checkout exact intent commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.commit_sha }}
          fetch-depth: 1
      - name: Resolve flow gate policy
        id: policy
        env:
          FLOW: ${{ inputs.flow }}
          CHANNEL: ${{ inputs.channel }}
        run: node .kb/workflows/scripts/resolve-candidate-gate.mjs --flow "$FLOW" --channel "$CHANNEL"

  journey-gate:
    name: Clean installer journey gate
    uses: ./.github/workflows/reusable-installer-journey.yml
    if: needs.resolve-gate-policy.outputs.required == 'true'
    needs: resolve-gate-policy
    with:
      ref: ${{ inputs.commit_sha }}
    permissions:
      contents: read

  unit-test-gate:
    name: Workspace unit verification
    needs: resolve-gate-policy
    uses: ./.github/workflows/remote-verify.yml
    with:
      profile: candidate
      target_sha: ${{ inputs.commit_sha }}
    permissions:
      contents: read
      actions: read
      checks: read

  build:
    name: Build candidate ${{ inputs.candidate_id }}
    needs: [resolve-gate-policy, journey-gate, unit-test-gate]
    if: >-
      always() &&
      needs.resolve-gate-policy.result == 'success' &&
      needs.unit-test-gate.result == 'success' &&
      ((needs.resolve-gate-policy.outputs.required != 'true' && needs.journey-gate.result == 'skipped') ||
       (needs.resolve-gate-policy.outputs.required == 'true' && needs.journey-gate.result == 'success'))
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout exact intent commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.commit_sha }}
          fetch-depth: 0
      - name: Build selected release flow
        uses: ./.github/actions/release-build-preflight
        with:
          commit-sha: ${{ inputs.commit_sha }}
          flow: ${{ inputs.flow }}
          channel: ${{ inputs.channel }}
          mode: candidate
          expected-version: ${{ inputs.version }}
          candidate-id: ${{ inputs.candidate_id }}
          run-id: ${{ github.run_id }}
          gate-policy: ${{ needs.resolve-gate-policy.outputs.policy }}
          gate-result: ${{ needs.journey-gate.result == 'success' && 'passed' || 'skipped' }}
          gate-run-id: ${{ needs.journey-gate.result == 'success' && github.run_id || '' }}

      - name: Upload immutable candidate bundle
        id: upload-candidate
        env:
          RELEASE_PREFLIGHT_COVERAGE: hosted-only
          RELEASE_PREFLIGHT_HOSTED_ONLY_REASON: GitHub Actions artifact service creates the downloadable immutable archive.
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: release-candidate-${{ inputs.candidate_id }}
          path: .kb/release/bundle
          if-no-files-found: error
          retention-days: 30

      - name: Record hosted artifact digest outside the bundle
        env:
          RELEASE_PREFLIGHT_COVERAGE: hosted-only
          RELEASE_PREFLIGHT_HOSTED_ONLY_REASON: Reads the Actions artifact-digest output and writes to GITHUB_STEP_SUMMARY.
          ARTIFACT_DIGEST: ${{ steps.upload-candidate.outputs.artifact-digest }}
        run: |
          set -euo pipefail
          test -n "$ARTIFACT_DIGEST"
          printf '\n- **Actions artifact archive digest:** `%s`\n' "$ARTIFACT_DIGEST" >> "$GITHUB_STEP_SUMMARY"

      - name: Deliver canary
        if: inputs.deliver_canary
        env:
          RELEASE_PREFLIGHT_COVERAGE: hosted-only
          RELEASE_PREFLIGHT_HOSTED_ONLY_REASON: Publishes to protected canary endpoints using hosted secrets.
          NPM_TOKEN: ${{ secrets.CANARY_NPM_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.CANARY_NPM_TOKEN }}
          CANARY_RELEASES_SSH_KEY: ${{ secrets.CANARY_RELEASES_SSH_KEY }}
          CANARY_RELEASES_KNOWN_HOSTS: ${{ secrets.CANARY_RELEASES_KNOWN_HOSTS }}
          CANDIDATE_ID: ${{ inputs.candidate_id }}
          COMMIT_SHA: ${{ inputs.commit_sha }}
          FLOW: ${{ inputs.flow }}
          CHANNEL: ${{ inputs.channel }}
          VERSION: ${{ inputs.version }}
        run: bash scripts/deliver-canary-ci.sh
