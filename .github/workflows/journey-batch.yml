name: Journey batch

on:
  push:
    branches: ['batch/**']
  workflow_dispatch:
    inputs:
      run_mode:
        description: Run the full producer batch or reuse a completed candidate for one selected case
        required: true
        type: choice
        options: [full, reuse_candidate, reuse_candidate_overlay]
        default: full
      baseline:
        description: Optional baseline label recorded in batch metadata; the build compares against the default branch
        required: false
        type: string
      candidate_run_id:
        description: Successful journey-batch producer run ID (reuse_candidate only)
        required: false
        type: string
      candidate_sha:
        description: Exact 40-character source SHA used by that producer run (reuse modes only)
        required: false
        type: string
      case_id:
        description: One case or step ID, for example S-056.2 (reuse_candidate only)
        required: false
        type: string
      mode:
        description: Installed journey mode for the selected case (reuse_candidate only)
        required: false
        type: choice
        options: [local, secured]
        default: local
  pull_request:
    paths:
      - '.github/workflows/journey-batch.yml'
      - 'core/**'
      - 'adapters/**'
      - 'cli/**'
      - 'plugins/**'
      - 'sdk/**'
      - 'shared/**'
      - 'studio/**'
      - 'tools/**'
      - 'e2e/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'

concurrency:
  group: journey-batch
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  producer:
    if: github.event_name != 'workflow_dispatch' || (inputs.run_mode != 'reuse_candidate' && inputs.run_mode != 'reuse_candidate_overlay')
    name: Shared build and candidate
    runs-on: ubuntu-latest
    outputs:
      selection: ${{ steps.selection.outputs.selection }}
    timeout-minutes: 60
    env:
      GOTOOLCHAIN: local
      JOURNEY_DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
      BATCH_PRODUCER_OUTPUT: .journey/batch/${{ github.run_id }}/producer
      BATCH_BASELINE: ${{ inputs.baseline || github.event.repository.default_branch }}
      KB_DEVKIT_BASE_REF: ${{ github.event.pull_request.base.sha || format('origin/{0}', github.event.repository.default_branch) }}
    steps:
      - id: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - id: selection
        name: Resolve the case selection for this trigger
        run: node scripts/ci/journey-batch-selection.mjs resolve "$GITHUB_EVENT_NAME" "$GITHUB_REF_NAME" >> "$GITHUB_OUTPUT"
      - id: pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86
        with:
          run_install: false
      - id: node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: package.json
          cache: pnpm
      - id: go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version: '1.26.8'
          cache-dependency-path: tools/kb-devkit/go.sum
      - id: dependencies
        name: Install workspace dependencies
        run: corepack pnpm install --frozen-lockfile
      - name: Run journey static preflight
        run: bash e2e/journey/static-preflight.sh
      - uses: ./.github/actions/install-goreleaser
      - id: batch
        name: Produce shared build and candidate
        run: node scripts/ci/run-remote-stage.mjs --journey-batch-prepare "$BATCH_PRODUCER_OUTPUT" "$BATCH_BASELINE"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: journey-build-candidate
          path: ${{ env.BATCH_PRODUCER_OUTPUT }}
          if-no-files-found: warn
          retention-days: 90

  local:
    if: github.event_name != 'workflow_dispatch' || (inputs.run_mode != 'reuse_candidate' && inputs.run_mode != 'reuse_candidate_overlay')
    name: Installed local journey
    runs-on: ubuntu-latest
    needs: producer
    timeout-minutes: 180
    strategy:
      fail-fast: false
    env:
      GOTOOLCHAIN: local
      BATCH_PRODUCER_INPUT: .journey/batch-input/producer
      BATCH_OUTPUT: .journey/batch/${{ github.run_id }}/local
      BATCH_SELECTION: ${{ needs.producer.outputs.selection }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86
        with:
          run_install: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: package.json
          cache: pnpm
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version: '1.26.8'
          cache-dependency-path: tools/kb-devkit/go.sum
      - name: Install workspace dependencies
        run: corepack pnpm install --frozen-lockfile
      - uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16
        with:
          name: journey-build-candidate
          path: ${{ env.BATCH_PRODUCER_INPUT }}
      - name: Run local journey stage
        run: node scripts/ci/journey-batch-selection.mjs run "$BATCH_SELECTION" -- e2e/journey/batch.sh mode local "$BATCH_PRODUCER_INPUT" "$BATCH_OUTPUT"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: journey-local
          path: ${{ env.BATCH_OUTPUT }}
          if-no-files-found: warn
          retention-days: 90

  secured:
    if: github.event_name != 'workflow_dispatch' || (inputs.run_mode != 'reuse_candidate' && inputs.run_mode != 'reuse_candidate_overlay')
    name: Installed secured journey
    runs-on: ubuntu-latest
    needs: producer
    timeout-minutes: 120
    strategy:
      fail-fast: false
    env:
      GOTOOLCHAIN: local
      BATCH_PRODUCER_INPUT: .journey/batch-input/producer
      BATCH_OUTPUT: .journey/batch/${{ github.run_id }}/secured
      BATCH_SELECTION: ${{ needs.producer.outputs.selection }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86
        with:
          run_install: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: package.json
          cache: pnpm
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version: '1.26.8'
          cache-dependency-path: tools/kb-devkit/go.sum
      - name: Install workspace dependencies
        run: corepack pnpm install --frozen-lockfile
      - uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16
        with:
          name: journey-build-candidate
          path: ${{ env.BATCH_PRODUCER_INPUT }}
      - name: Run secured journey stage
        run: node scripts/ci/journey-batch-selection.mjs run "$BATCH_SELECTION" -- e2e/journey/batch.sh mode secured "$BATCH_PRODUCER_INPUT" "$BATCH_OUTPUT"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: journey-secured
          path: ${{ env.BATCH_OUTPUT }}
          if-no-files-found: warn
          retention-days: 90

  summary:
    name: Assemble journey artifacts and summary
    runs-on: ubuntu-latest
    needs: [producer, local, secured]
    if: always() && (github.event_name != 'workflow_dispatch' || (inputs.run_mode != 'reuse_candidate' && inputs.run_mode != 'reuse_candidate_overlay'))
    timeout-minutes: 10
    env:
      BATCH_OUTPUT: .journey/batch/${{ github.run_id }}/summary
      BATCH_PRODUCER_INPUT: .journey/batch-input/producer
      BATCH_LOCAL_INPUT: .journey/batch-input/local
      BATCH_SECURED_INPUT: .journey/batch-input/secured
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16
        id: producer-artifact
        continue-on-error: true
        with:
          name: journey-build-candidate
          path: ${{ env.BATCH_PRODUCER_INPUT }}
      - uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16
        id: local-artifact
        continue-on-error: true
        with:
          name: journey-local
          path: ${{ env.BATCH_LOCAL_INPUT }}
      - uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16
        id: secured-artifact
        continue-on-error: true
        with:
          name: journey-secured
          path: ${{ env.BATCH_SECURED_INPUT }}
      - name: Assemble shared artifact and stage durations
        id: summarize
        run: e2e/journey/batch.sh summarize "$BATCH_OUTPUT" "$BATCH_PRODUCER_INPUT" "$BATCH_LOCAL_INPUT" "$BATCH_SECURED_INPUT"
      - name: Add batch summary
        if: always()
        run: |
          summary_file="$BATCH_OUTPUT/shared/summary.md"
          if [ -f "$summary_file" ]; then
            cat "$summary_file" >> "$GITHUB_STEP_SUMMARY"
          else
            printf 'batch summary could not be assembled from downloaded artifacts\n' >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: journey-shared
          path: ${{ env.BATCH_OUTPUT }}
          if-no-files-found: warn
          retention-days: 90

  reuse-candidate:
    name: Reuse candidate for selected installed case
    if: github.event_name == 'workflow_dispatch' && (inputs.run_mode == 'reuse_candidate' || inputs.run_mode == 'reuse_candidate_overlay')
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: read
      actions: read
    env:
      GOTOOLCHAIN: local
      CANDIDATE_RUN_ID: ${{ inputs.candidate_run_id }}
      CANDIDATE_SHA: ${{ inputs.candidate_sha }}
      HARNESS_SHA: ${{ github.sha }}
      RUN_MODE: ${{ inputs.run_mode }}
      CASE_ID: ${{ inputs.case_id }}
      JOURNEY_MODE: ${{ inputs.mode }}
      COMPOSE_PROJECT_NAME: kb-journey-reuse-${{ github.run_id }}-${{ github.run_attempt }}
      KB_JOURNEY_NETWORK: kb-journey-reuse-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - name: Validate selected candidate inputs
        shell: bash
        run: |
          [[ "$CANDIDATE_RUN_ID" =~ ^[0-9]+$ ]] || { echo 'candidate_run_id must be a numeric GitHub Actions run ID' >&2; exit 2; }
          [[ "$CANDIDATE_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo 'candidate_sha must be a full 40-character commit SHA' >&2; exit 2; }
          [[ "$HARNESS_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo 'workflow harness SHA is not a full commit SHA' >&2; exit 2; }
          [[ "$CASE_ID" =~ ^(S|PC)-[0-9]{3}(\.[0-9]+)?$ ]] || { echo 'case_id must name one case or step, such as S-056.2' >&2; exit 2; }
          [[ "$JOURNEY_MODE" == local || "$JOURNEY_MODE" == secured ]] || { echo 'mode must be local or secured' >&2; exit 2; }
          [[ "$RUN_MODE" == reuse_candidate || "$RUN_MODE" == reuse_candidate_overlay ]] || { echo 'unsupported candidate reuse mode' >&2; exit 2; }
          if [[ "$RUN_MODE" == reuse_candidate_overlay && "$CANDIDATE_SHA" == "$HARNESS_SHA" ]]; then
            echo 'reuse_candidate_overlay requires distinct source and harness SHAs' >&2
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Verify source run identity and result
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$CANDIDATE_RUN_ID" > "$RUNNER_TEMP/candidate-run.json"
          jq -e --arg sha "$CANDIDATE_SHA" --arg repo "$GITHUB_REPOSITORY" \
            '.head_sha == $sha and .status == "completed" and .path == ".github/workflows/journey-batch.yml" and .head_repository.full_name == $repo and (.event == "push" or .event == "workflow_dispatch")' \
            "$RUNNER_TEMP/candidate-run.json" >/dev/null || {
              echo 'candidate run must be a completed journey-batch push or dispatch for this repository and exact SHA' >&2
              exit 1
            }
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$CANDIDATE_RUN_ID/jobs?per_page=100" > "$RUNNER_TEMP/candidate-jobs.json"
          jq -e '[.jobs[] | select(.name == "Shared build and candidate" and .status == "completed" and .conclusion == "success")] | length == 1' \
            "$RUNNER_TEMP/candidate-jobs.json" >/dev/null || {
              echo 'candidate run has no successful Shared build and candidate job' >&2
              exit 1
            }
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$CANDIDATE_RUN_ID/artifacts?per_page=100" > "$RUNNER_TEMP/candidate-artifacts.json"
          jq -ce '[.artifacts[] | select(.name == "journey-build-candidate" and .expired == false)] | if length == 1 and (.[0].digest | type == "string") then .[0] else error("expected exactly one unexpired candidate artifact with a digest") end' \
            "$RUNNER_TEMP/candidate-artifacts.json" > "$RUNNER_TEMP/candidate-artifact.json"
      - name: Create candidate source checkout and validate harness identity
        run: |
          overlay_started=$(date +%s%N)
          [[ "$(git rev-parse HEAD)" == "$HARNESS_SHA" ]] || { echo 'checked out workflow harness does not match its dispatch SHA' >&2; exit 1; }
          source_root="$RUNNER_TEMP/journey-candidate-source"
          BATCH_OUTPUT="$RUNNER_TEMP/journey-batch/$GITHUB_RUN_ID/reuse"
          if [[ "$RUN_MODE" == reuse_candidate_overlay ]]; then
            python3 e2e/journey/reuse_candidate_overlay.py prepare "$GITHUB_WORKSPACE" "$CANDIDATE_SHA" "$HARNESS_SHA" \
              "$source_root" "$RUNNER_TEMP/harness-overlay.json"
            CASE_VERDICT_HELPER="$GITHUB_WORKSPACE/e2e/journey/reuse_case_verdict.py"
            EFFECTIVE_HARNESS_SHA="$HARNESS_SHA"
          else
            mkdir -p "$(dirname "$source_root")"
            git worktree add --detach "$source_root" "$CANDIDATE_SHA"
            test -f "$source_root/e2e/journey/reuse_case_verdict.py" || {
              echo 'candidate SHA predates selected-case reuse support; choose a source SHA containing e2e/journey/reuse_case_verdict.py' >&2
              exit 1
            }
            CASE_VERDICT_HELPER="$source_root/e2e/journey/reuse_case_verdict.py"
            EFFECTIVE_HARNESS_SHA="$CANDIDATE_SHA"
            python3 - "$CANDIDATE_SHA" "$HARNESS_SHA" "$RUNNER_TEMP/harness-overlay.json" <<'PY'
          import json, sys
          source, workflow, path = sys.argv[1:]
          with open(path, "w", encoding="utf-8") as output:
              json.dump({"candidateSourceSha": source, "harnessSha": source,
                         "workflowSha": workflow, "overlayPaths": []}, output)
              output.write("\n")
          PY
          fi
          python3 - "$RUNNER_TEMP/harness-overlay.json" "$HARNESS_SHA" <<'PY'
          import json, sys
          path, workflow_sha = sys.argv[1:]
          with open(path, encoding="utf-8") as source:
              manifest = json.load(source)
          manifest["workflowSha"] = workflow_sha
          with open(path, "w", encoding="utf-8") as output:
              json.dump(manifest, output, indent=2)
              output.write("\n")
          PY
          printf 'CANDIDATE_CHECKOUT=%s\nBATCH_OUTPUT=%s\nCASE_VERDICT_HELPER=%s\nEFFECTIVE_HARNESS_SHA=%s\n' \
            "$source_root" "$BATCH_OUTPUT" "$CASE_VERDICT_HELPER" "$EFFECTIVE_HARNESS_SHA" >> "$GITHUB_ENV"
          overlay_ended=$(date +%s%N)
          python3 - "$overlay_started" "$overlay_ended" > "$RUNNER_TEMP/harness-overlay-seconds.txt" <<'PY'
          import sys
          start, end = (int(value) for value in sys.argv[1:])
          print(round(max(0, end - start) / 1_000_000_000, 3))
          PY
      - name: Allocate candidate input outside the checkout
        shell: bash
        run: |
          producer_input=$(mktemp -d "$RUNNER_TEMP/journey-producer-input.XXXXXX")
          printf 'BATCH_PRODUCER_INPUT=%s\n' "$producer_input" >> "$GITHUB_ENV"
      - name: Download and verify the exact candidate artifact
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          artifact_id=$(jq -r '.id' "$RUNNER_TEMP/candidate-artifact.json")
          expected_digest=$(jq -r '.digest | sub("^sha256:"; "")' "$RUNNER_TEMP/candidate-artifact.json")
          download_started=$(date +%s%N)
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$artifact_id/zip" > "$RUNNER_TEMP/candidate-artifact.zip"
          actual_digest=$(sha256sum "$RUNNER_TEMP/candidate-artifact.zip" | cut -d ' ' -f 1)
          [[ "$actual_digest" == "$expected_digest" ]] || {
            echo 'candidate artifact ZIP SHA-256 does not match the GitHub artifact digest' >&2
            exit 1
          }
          mkdir -p "$BATCH_PRODUCER_INPUT"
          python3 - "$RUNNER_TEMP/candidate-artifact.zip" "$BATCH_PRODUCER_INPUT" <<'PY'
          import shutil, stat, sys, zipfile
          from pathlib import Path, PurePosixPath
          archive = zipfile.ZipFile(sys.argv[1])
          root = Path(sys.argv[2]).resolve()
          seen = set()
          for info in archive.infolist():
              name = info.filename
              path = PurePosixPath(name)
              if path.is_absolute() or ".." in path.parts or "\\" in name or not path.parts or path.parts[0] != "shared":
                  raise SystemExit(f"candidate artifact contains an unsafe path: {name}")
              normalized = path.parts
              if normalized in seen:
                  raise SystemExit(f"candidate artifact contains a duplicate path: {name}")
              seen.add(normalized)
              if stat.S_ISLNK(info.external_attr >> 16):
                  raise SystemExit(f"candidate artifact contains a symbolic link: {name}")
              destination = root.joinpath(*path.parts)
              if destination != root and root not in destination.parents:
                  raise SystemExit(f"candidate artifact path escapes its destination: {name}")
              if info.is_dir():
                  destination.mkdir(parents=True, exist_ok=True)
              else:
                  destination.parent.mkdir(parents=True, exist_ok=True)
                  with archive.open(info) as source, destination.open("wb") as target:
                      shutil.copyfileobj(source, target)
          PY
          download_ended=$(date +%s%N)
          python3 - "$download_started" "$download_ended" "$RUNNER_TEMP/harness-overlay-seconds.txt" > "$RUNNER_TEMP/reuse-timings.json" <<'PY'
          import json, sys
          start, end = (int(value) for value in sys.argv[1:3])
          overlay_seconds = float(open(sys.argv[3], encoding="utf-8").read())
          print(json.dumps({"harnessCompatibilityPreparation": overlay_seconds,
                            "harnessOverlayApplication": 0,
                            "artifactDownloadVerifyAndExtract": round(max(0, end - start) / 1_000_000_000, 3)}))
          PY
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86
        with:
          run_install: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: package.json
          cache: pnpm
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version: '1.26.8'
          cache-dependency-path: tools/kb-devkit/go.sum
      - name: Install workspace dependencies
        run: |
          install_started=$(date +%s%N)
          (cd "$CANDIDATE_CHECKOUT" && corepack pnpm install --frozen-lockfile)
          install_ended=$(date +%s%N)
          python3 - "$RUNNER_TEMP/reuse-timings.json" "$install_started" "$install_ended" <<'PY'
          import json, sys
          path, start, end = sys.argv[1], *(int(value) for value in sys.argv[2:])
          value = json.load(open(path, encoding="utf-8"))
          value["workspaceDependencyInstall"] = round(max(0, end - start) / 1_000_000_000, 3)
          open(path, "w", encoding="utf-8").write(json.dumps(value) + "\n")
          PY
      - name: Verify producer metadata
        run: |
          verification_start=$(date +%s%N)
          jq -e --arg sha "$CANDIDATE_SHA" '.commit == $sha and .result == "PASS" and (.candidateArchiveSha256 | type == "string")' \
            "$BATCH_PRODUCER_INPUT/shared/batch-metadata.json" >/dev/null || {
              echo 'candidate metadata must record the requested SHA, a passing producer result, and its archive digest' >&2
              exit 1
            }
          (cd "$CANDIDATE_CHECKOUT" && \
            python3 e2e/journey/batch_summary.py verify-run "$BATCH_PRODUCER_INPUT/shared/run.json" "$CANDIDATE_SHA" && \
            python3 e2e/journey/batch_summary.py verify-candidate "$BATCH_PRODUCER_INPUT/shared/batch-metadata.json" "$BATCH_PRODUCER_INPUT/shared/build-candidate.tar") || exit 1
          verification_end=$(date +%s%N)
          python3 - "$RUNNER_TEMP/reuse-timings.json" "$verification_start" "$verification_end" <<'PY'
          import json, sys
          path, start, end = sys.argv[1], *(int(value) for value in sys.argv[2:])
          value = json.load(open(path, encoding="utf-8"))
          value["producerMetadataCheck"] = round(max(0, end - start) / 1_000_000_000, 3)
          open(path, "w", encoding="utf-8").write(json.dumps(value) + "\n")
          PY
      - name: Extract and validate candidate build prerequisites
        run: |
          tar -xf "$BATCH_PRODUCER_INPUT/shared/build-candidate.tar" -C "$CANDIDATE_CHECKOUT"
          for required in core/config/dist/index.js cli/bin/dist/bin.js; do
            if [[ ! -f "$CANDIDATE_CHECKOUT/$required" ]]; then
              echo "reused candidate is missing required build output: $required" >&2
              echo 'produce a candidate after `kb-devkit run build --affected` and rerun this journey' >&2
              exit 1
            fi
          done
      - name: Apply the reviewed harness overlay after candidate identity checks
        run: |
          overlay_started=$(date +%s%N)
          if [[ "$RUN_MODE" == reuse_candidate_overlay ]]; then
            python3 e2e/journey/reuse_candidate_overlay.py overlay "$GITHUB_WORKSPACE" \
              "$CANDIDATE_CHECKOUT" "$RUNNER_TEMP/harness-overlay.json"
          fi
          overlay_ended=$(date +%s%N)
          python3 - "$RUNNER_TEMP/reuse-timings.json" "$overlay_started" "$overlay_ended" <<'PY'
          import json, sys
          path, start, end = sys.argv[1], *(int(value) for value in sys.argv[2:])
          value = json.load(open(path, encoding="utf-8"))
          value["harnessOverlayApplication"] = round(max(0, end - start) / 1_000_000_000, 3)
          open(path, "w", encoding="utf-8").write(json.dumps(value) + "\n")
          PY
      - name: Run the selected case against the reused candidate
        shell: bash
        run: |
          mode_output="$BATCH_OUTPUT/$JOURNEY_MODE"
          mkdir -p "$mode_output"
          batch_started=$(date +%s%N)
          set +e
          (cd "$CANDIDATE_CHECKOUT" && e2e/journey/batch.sh mode "$JOURNEY_MODE" "$BATCH_PRODUCER_INPUT" "$BATCH_OUTPUT" --cases "$CASE_ID")
          batch_status=$?
          set -e
          batch_ended=$(date +%s%N)
          selected_case_status=FAIL
          if [[ -s "$mode_output/batch-metadata.json" ]]; then
            set +e
            (cd "$CANDIDATE_CHECKOUT" && python3 "$CASE_VERDICT_HELPER" "$JOURNEY_MODE" "$CASE_ID" "$mode_output" "$CANDIDATE_CHECKOUT")
            if [[ "$?" -eq 0 ]]; then selected_case_status=PASS; else batch_status=1; fi
            set -e
          else
            batch_status=1
          fi
          [[ "$batch_status" -eq 0 && "$selected_case_status" == PASS ]] || batch_status=1
          python3 - "$RUNNER_TEMP/candidate-artifact.json" "$RUNNER_TEMP/reuse-timings.json" "$mode_output/candidate-source.json" "$mode_output/batch-metadata.json" "$BATCH_PRODUCER_INPUT/shared/batch-metadata.json" "$mode_output/batch.log" "$mode_output/run.json" "$CANDIDATE_RUN_ID" "$CANDIDATE_SHA" "$EFFECTIVE_HARNESS_SHA" "$HARNESS_SHA" "$RUN_MODE" "$RUNNER_TEMP/harness-overlay.json" "$JOURNEY_MODE" "$CASE_ID" "$batch_status" "$selected_case_status" "$batch_started" "$batch_ended" <<'PY'
          import json, pathlib, sys
          artifact_path, timing_path, source_path, mode_metadata_path, shared_metadata_path, log_path, extracted_run_path, run_id, sha, harness_sha, workflow_sha, reuse_mode, overlay_path, mode, case_id, status, case_status, started, ended = sys.argv[1:]
          timing = json.load(open(timing_path, encoding="utf-8"))
          timing["candidateVerifyAndJourney"] = round(max(0, int(ended) - int(started)) / 1_000_000_000, 3)
          timing["measuredCandidateAndCaseSeconds"] = round(sum(timing[key] for key in (
              "artifactDownloadVerifyAndExtract", "producerMetadataCheck", "candidateVerifyAndJourney")), 3)
          timing["measuredReusePreparationSeconds"] = round(sum(timing[key] for key in (
              "harnessCompatibilityPreparation", "harnessOverlayApplication", "workspaceDependencyInstall")), 3)
          timing["measuredReusePathSeconds"] = round(sum(timing[key] for key in (
              "measuredCandidateAndCaseSeconds", "measuredReusePreparationSeconds")), 3)
          artifact = json.load(open(artifact_path, encoding="utf-8"))
          metadata = json.load(open(shared_metadata_path, encoding="utf-8"))
          overlay = json.load(open(overlay_path, encoding="utf-8"))
          candidate_reused = pathlib.Path(extracted_run_path).is_file()
          result = "PASS" if status == "0" and case_status == "PASS" and candidate_reused else "FAIL"
          source = {"candidateRunId": run_id, "candidateSha": sha, "harnessSha": harness_sha,
                    "workflowSha": workflow_sha,
                    "reuseContract": "source-with-reviewed-harness-overlay" if reuse_mode == "reuse_candidate_overlay" else "candidate-source-checkout",
                    "harnessOverlay": overlay, "buildInputIdentity": {"kind": "candidate-source-git-commit", "sha": sha},
                    "candidateArchiveSha256": metadata.get("candidateArchiveSha256"), "artifactId": artifact["id"],
                    "artifactDigest": artifact["digest"], "mode": mode, "caseId": case_id,
                    "candidateReused": candidate_reused, "platformReused": False, "evidenceKind": "iteration",
                    "selectedCaseResult": case_status, "result": result, "reuseTimingsSeconds": timing}
          pathlib.Path(source_path).write_text(json.dumps(source, indent=2) + "\n", encoding="utf-8")
          try:
              mode_metadata = json.load(open(mode_metadata_path, encoding="utf-8"))
              mode_metadata.update({"result": result, "candidateReused": candidate_reused, "platformReused": False, "evidenceKind": "iteration", "reuseTimingsSeconds": timing})
              pathlib.Path(mode_metadata_path).write_text(json.dumps(mode_metadata, indent=2) + "\n", encoding="utf-8")
          except FileNotFoundError:
              pass
          with open(log_path, "a", encoding="utf-8") as log:
              log.write(f"candidateReused={str(candidate_reused).lower()} platformReused=false evidenceKind=iteration\n")
              log.write("reuseTimingsSeconds=" + json.dumps(timing, sort_keys=True) + "\n")
          PY
          exit "$batch_status"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: journey-reused-candidate
          path: ${{ env.BATCH_OUTPUT }}
          if-no-files-found: warn
          retention-days: 90
