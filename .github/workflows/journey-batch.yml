name: Journey batch

on:
  push:
    branches: ['batch/**']
  workflow_dispatch:
    inputs:
      baseline:
        description: Optional baseline label recorded in batch metadata; the build compares against the default branch
        required: false
        type: string
  pull_request:
    paths:
      - '.github/workflows/journey-batch.yml'
      - 'core/**'
      - 'adapters/**'
      - 'cli/**'
      - 'plugins/**'
      - 'sdk/**'
      - 'shared/**'
      - 'studio/**'
      - 'tools/**'
      - 'e2e/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'

# GitHub keeps one pending run per group, so isolate each PR and each dispatch.
concurrency:
  # A newer run for the same PR can replace its pending predecessor, but PRs,
  # manual dispatches, and batch pushes cannot replace one another.
  group: journey-batch-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  producer:
    name: Shared build and candidate
    runs-on: ubuntu-latest
    outputs:
      selection: ${{ steps.selection.outputs.selection }}
    timeout-minutes: 60
    env:
      GOTOOLCHAIN: local
      JOURNEY_DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
      BATCH_PRODUCER_OUTPUT: .journey/batch/${{ github.run_id }}/producer
      BATCH_BASELINE: ${{ inputs.baseline || github.event.repository.default_branch }}
      KB_DEVKIT_BASE_REF: ${{ github.event.pull_request.base.sha || format('origin/{0}', github.event.repository.default_branch) }}
    steps:
      - id: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - id: selection
        name: Resolve the case selection for this trigger
        run: node scripts/ci/journey-batch-selection.mjs resolve "$GITHUB_EVENT_NAME" "$GITHUB_REF_NAME" >> "$GITHUB_OUTPUT"
      - id: pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86
        with:
          run_install: false
      - id: node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: package.json
          cache: pnpm
      - id: go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version: '1.26.11'
          cache-dependency-path: tools/kb-devkit/go.sum
      - id: dependencies
        name: Install workspace dependencies
        run: corepack pnpm install --frozen-lockfile
      - name: Run journey static preflight
        run: bash e2e/journey/static-preflight.sh
      - id: devkit-cas
        name: Restore kb-devkit content-addressed cache
        uses: ./.github/actions/devkit-cas
        with:
          mode: ${{ github.ref == 'refs/heads/master' && 'off' || 'read-write' }}
          namespace: journey
      - id: tgz-cache
        name: Restore packed package cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: e2e/packages/
          key: journey-batch-tgz-v2-${{ runner.os }}-${{ github.sha }}
      - uses: ./.github/actions/install-goreleaser
      - id: batch
        name: Produce shared build and candidate
        env:
          BATCH_SELECTION: ${{ steps.selection.outputs.selection }}
          KB_JOURNEY_PACKAGES_READY: ${{ steps.tgz-cache.outputs.cache-hit == 'true' && '1' || '0' }}
          DEVKIT_CACHE_HIT: ${{ steps.devkit-cas.outputs.cache-hit }}
          DEVKIT_CACHE_MODE: ${{ steps.devkit-cas.outputs.cache-mode }}
          DEVKIT_CACHE_STORE_PATH: ${{ steps.devkit-cas.outputs.store-path }}
        run: node scripts/ci/run-remote-stage.mjs --journey-batch-prepare "$BATCH_PRODUCER_OUTPUT" "$BATCH_BASELINE"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: journey-build-candidate
          path: ${{ env.BATCH_PRODUCER_OUTPUT }}
          if-no-files-found: warn
          retention-days: 90

  local:
    name: Installed local journey
    runs-on: ubuntu-latest
    needs: producer
    timeout-minutes: 180
    strategy:
      fail-fast: false
    env:
      GOTOOLCHAIN: local
      BATCH_PRODUCER_INPUT: .journey/batch-input/producer
      BATCH_OUTPUT: .journey/batch/${{ github.run_id }}/local
      BATCH_SELECTION: ${{ needs.producer.outputs.selection }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86
        with:
          run_install: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: package.json
          cache: pnpm
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version: '1.26.11'
          cache-dependency-path: tools/kb-devkit/go.sum
      - name: Install workspace dependencies
        run: corepack pnpm install --frozen-lockfile
      - uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16
        with:
          name: journey-build-candidate
          path: ${{ env.BATCH_PRODUCER_INPUT }}
      - name: Run local journey stage
        run: node scripts/ci/journey-batch-selection.mjs run "$BATCH_SELECTION" -- e2e/journey/batch.sh mode local "$BATCH_PRODUCER_INPUT" "$BATCH_OUTPUT"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: journey-local
          path: ${{ env.BATCH_OUTPUT }}
          if-no-files-found: warn
          retention-days: 90

  secured:
    name: Installed secured journey
    runs-on: ubuntu-latest
    needs: producer
    timeout-minutes: 120
    strategy:
      fail-fast: false
    env:
      GOTOOLCHAIN: local
      BATCH_PRODUCER_INPUT: .journey/batch-input/producer
      BATCH_OUTPUT: .journey/batch/${{ github.run_id }}/secured
      BATCH_SELECTION: ${{ needs.producer.outputs.selection }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86
        with:
          run_install: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: package.json
          cache: pnpm
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version: '1.26.11'
          cache-dependency-path: tools/kb-devkit/go.sum
      - name: Install workspace dependencies
        run: corepack pnpm install --frozen-lockfile
      - uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16
        with:
          name: journey-build-candidate
          path: ${{ env.BATCH_PRODUCER_INPUT }}
      - name: Run secured journey stage
        run: node scripts/ci/journey-batch-selection.mjs run "$BATCH_SELECTION" -- e2e/journey/batch.sh mode secured "$BATCH_PRODUCER_INPUT" "$BATCH_OUTPUT"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: journey-secured
          path: ${{ env.BATCH_OUTPUT }}
          if-no-files-found: warn
          retention-days: 90

  summary:
    name: Assemble journey artifacts and summary
    runs-on: ubuntu-latest
    needs: [producer, local, secured]
    if: always()
    timeout-minutes: 10
    env:
      BATCH_OUTPUT: .journey/batch/${{ github.run_id }}/summary
      BATCH_PRODUCER_INPUT: .journey/batch-input/producer
      BATCH_LOCAL_INPUT: .journey/batch-input/local
      BATCH_SECURED_INPUT: .journey/batch-input/secured
      BATCH_SELECTION: ${{ needs.producer.outputs.selection }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16
        id: producer-artifact
        continue-on-error: true
        with:
          name: journey-build-candidate
          path: ${{ env.BATCH_PRODUCER_INPUT }}
      - uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16
        id: local-artifact
        continue-on-error: true
        with:
          name: journey-local
          path: ${{ env.BATCH_LOCAL_INPUT }}
      - uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16
        id: secured-artifact
        continue-on-error: true
        with:
          name: journey-secured
          path: ${{ env.BATCH_SECURED_INPUT }}
      - name: Assemble shared artifact and stage durations
        id: summarize
        run: |
          selection_ids="$(node scripts/ci/journey-batch-selection.mjs ids "$BATCH_SELECTION")"
          e2e/journey/batch.sh summarize "$BATCH_OUTPUT" "$BATCH_PRODUCER_INPUT" "$BATCH_LOCAL_INPUT" "$BATCH_SECURED_INPUT" --selection "$selection_ids"
      - name: Add batch summary
        if: always()
        run: |
          summary_file="$BATCH_OUTPUT/shared/summary.md"
          if [ -f "$summary_file" ]; then
            cat "$summary_file" >> "$GITHUB_STEP_SUMMARY"
          else
            printf 'batch summary could not be assembled from downloaded artifacts\n' >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: journey-shared
          path: ${{ env.BATCH_OUTPUT }}
          if-no-files-found: warn
          retention-days: 90
