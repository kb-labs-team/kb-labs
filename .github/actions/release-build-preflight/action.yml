name: Release build preflight
description: Build the selected release flow after hydrating and applying its release plan.
inputs:
  commit-sha:
    description: Commit identifier used to derive the disposable canary version
    required: true
  flow:
    description: Release flow to build
    required: true
  channel:
    description: Release channel used to resolve the release plan
    required: true
  mode:
    description: candidate preserves candidate version rules; preflight applies a disposable version
    required: true
  expected-version:
    description: Required for stable candidate version verification
    required: false
    default: ''
runs:
  using: composite
  steps:
    - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86
      with:
        run_install: false
    - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
      with:
        node-version: 24
        cache: pnpm
    - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
      with:
        go-version: '1.26.8'
        cache: false
    - name: Build kb-devkit
      shell: bash
      working-directory: tools/kb-devkit
      run: go build -o kb-devkit .
    - name: Install exact workspace dependencies
      shell: bash
      run: pnpm install --frozen-lockfile
    - name: Run the governed release build path
      shell: bash
      env:
        FLOW: ${{ inputs.flow }}
        CHANNEL: ${{ inputs.channel }}
        COMMIT_SHA: ${{ inputs['commit-sha'] }}
        MODE: ${{ inputs.mode }}
        EXPECTED_VERSION: ${{ inputs['expected-version'] }}
        KBLABS_RELEASE_DIAGNOSTICS_DIR: ${{ runner.temp }}/kb-release-build-diagnostics-${{ github.run_id }}-${{ github.run_attempt }}
      run: bash scripts/release-build-preflight.sh "$FLOW" "$CHANNEL" "$COMMIT_SHA" "$MODE" "$EXPECTED_VERSION"
    - name: Upload release build diagnostics
      if: ${{ failure() }}
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      with:
        name: release-build-diagnostics-${{ github.run_id }}-${{ github.run_attempt }}
        path: |
          ${{ runner.temp }}/kb-release-build-diagnostics-${{ github.run_id }}-${{ github.run_attempt }}
          .kb/logs
        if-no-files-found: ignore
        retention-days: 7
    - name: Remove successful release diagnostics
      if: ${{ success() }}
      shell: bash
      env:
        KBLABS_RELEASE_DIAGNOSTICS_DIR: ${{ runner.temp }}/kb-release-build-diagnostics-${{ github.run_id }}-${{ github.run_attempt }}
      run: rm -rf -- "$KBLABS_RELEASE_DIAGNOSTICS_DIR"
