name: 'KB Labs CLI Install'
description: >-
  Applies a sealed V2 release index with the published kb-create binary and a
  non-interactive request. The same request contract is used by CI, agents and
  the human wizard.
author: 'KB Labs'

inputs:
  plugins:
    description: >-
      Comma-separated V2 plugin IDs, each optionally pinned to an exact version.
    required: false
    default: ''
  release-index:
    description: 'Path to the sealed kb.create.release-index/v2 JSON.'
    required: true
  project-dir:
    description: 'Project root receiving the user-owned V2 config pointer; set to an empty string for platform-only installation.'
    required: false
    default: '${{ github.workspace }}'
  adapters:
    description: >-
      Comma-separated "role=pkg[@version]" adapter overrides (e.g.
      "cache=@kb-labs/adapters-redis@0.2.0").
    required: false
    default: ''
  platform-dir:
    description: 'Platform installation directory.'
    required: false
    default: '${{ github.workspace }}/.kb-platform'
  registry:
    description: 'npm registry URL override (e.g. for a local Verdaccio in CI).'
    required: false
    default: ''
  version:
    description: >-
      KB Labs binaries release tag to install kb-create from (e.g.
      "v2.105.0-binaries"). Defaults to the repo''s latest non-prerelease
      release.
    required: false
    default: 'latest'
  repo:
    description: 'GitHub "owner/repo" to download the kb-create binary from.'
    required: false
    default: 'kb-labs-team/kb-labs'

outputs:
  platform-dir:
    description: 'The resolved platform installation directory (same as the platform-dir input).'
    value: ${{ steps.install.outputs.platform-dir }}
  config-path:
    description: 'Path to the generated kb.config.jsonc.'
    value: ${{ steps.install.outputs.config-path }}

runs:
  using: 'composite'
  steps:
    - name: Resolve OS/Arch
      id: platform
      shell: bash
      run: |
        set -euo pipefail
        os="$(uname -s)"
        arch="$(uname -m)"
        case "$os" in
          Linux)  goos=linux ;;
          Darwin) goos=darwin ;;
          MINGW*|MSYS*|CYGWIN*) goos=windows ;;
          *) echo "::error::Unsupported OS: $os"; exit 1 ;;
        esac
        case "$arch" in
          x86_64|amd64) goarch=amd64 ;;
          aarch64|arm64) goarch=arm64 ;;
          *) echo "::error::Unsupported architecture: $arch"; exit 1 ;;
        esac
        if [ "$goos" = "windows" ] && [ "$goarch" = "arm64" ]; then
          echo "::error::windows/arm64 is not published (see .goreleaser.yaml ignore list)"
          exit 1
        fi
        echo "goos=$goos" >> "$GITHUB_OUTPUT"
        echo "goarch=$goarch" >> "$GITHUB_OUTPUT"
        ext=""
        [ "$goos" = "windows" ] && ext=".exe"
        echo "ext=$ext" >> "$GITHUB_OUTPUT"

    - name: Download kb-create
      shell: bash
      env:
        REPO: ${{ inputs.repo }}
        VERSION: ${{ inputs.version }}
        GOOS: ${{ steps.platform.outputs.goos }}
        GOARCH: ${{ steps.platform.outputs.goarch }}
        EXT: ${{ steps.platform.outputs.ext }}
      run: |
        set -euo pipefail
        asset="kb-create-${GOOS}-${GOARCH}${EXT}"
        if [ "$VERSION" = "latest" ]; then
          url="https://github.com/${REPO}/releases/latest/download/${asset}"
        else
          url="https://github.com/${REPO}/releases/download/${VERSION}/${asset}"
        fi
        echo "Downloading kb-create from $url"
        dest="${RUNNER_TEMP}/kb-create${EXT}"
        curl -fsSL "$url" -o "$dest"
        chmod +x "$dest"

    - name: Install
      id: install
      shell: bash
      env:
        PLUGINS: ${{ inputs.plugins }}
        ADAPTERS: ${{ inputs.adapters }}
        PLATFORM_DIR: ${{ inputs.platform-dir }}
        PROJECT_DIR: ${{ inputs.project-dir }}
        RELEASE_INDEX: ${{ inputs.release-index }}
        REGISTRY: ${{ inputs.registry }}
        EXT: ${{ steps.platform.outputs.ext }}
      run: |
        set -euo pipefail
        bin="${RUNNER_TEMP}/kb-create${EXT}"
        args=(apply --index "$RELEASE_INDEX" --request-platform-root "$PLATFORM_DIR")
        if [[ -n "$PROJECT_DIR" ]]; then
          args+=(--project-root "$PROJECT_DIR")
        fi
        [ -n "$PLUGINS" ] && args+=(--plugins "$PLUGINS")
        [ -n "$ADAPTERS" ] && args+=(--adapters "$ADAPTERS")
        [ -n "$REGISTRY" ] && args+=(--registry "$REGISTRY")
        "$bin" "${args[@]}"
        echo "platform-dir=$PLATFORM_DIR" >> "$GITHUB_OUTPUT"
        echo "config-path=$PLATFORM_DIR/.kb/kb.config.jsonc" >> "$GITHUB_OUTPUT"
