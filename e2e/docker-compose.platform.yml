# Platform-only E2E fixture. Keep out of shared installed Journey and launcher
# compositions; those define their own origin or do not need the candidate.
services:
  origin:
    image: python:3.12-alpine
    command: ["python3", "-m", "http.server", "8080", "--directory", "/release"]
    volumes:
      - ../.journey/e2e-platform-binaries:/release/journey-candidate:ro
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen(urllib.request.Request('http://127.0.0.1:8080/journey-candidate/kb-create-linux-amd64', method='HEAD'), timeout=2).close()"]
      interval: 2s
      timeout: 3s
      retries: 30
  platform:
    depends_on:
      origin:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "test -f /tmp/kb-e2e-ready && curl -sf http://localhost:4000/ready"]
