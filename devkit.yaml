  # i18n translation guard for @kb-labs/web-site.
  # Blocks CI on: EN↔RU key mismatch, missing keys, hardcoded Cyrillic in .tsx.
  # UNUSED keys are emitted as warnings (autoFixable — devkit fix removes them).
  # Suppress per-line with: // i18n-ignore
  # The four package contexts that receive this check are declared below.
  - name: i18n-check
    run: node sites/web/apps/web/scripts/i18n-check.mjs
    fix: node sites/web/apps/web/scripts/i18n-check.mjs
    on: [check]
    language: typescript
    anchor_packages: ["@kb-labs/web-site", "@kb-labs/web-site-ui", "@kb-labs/web-og", "@kb-labs/docs-site"]

  # Broken-link guard for KB Labs sites (web + docs).
  # Blocks CI on: internal href with no matching Next.js route, or a controlled-domain
  # URL (kblabs.ru, docs.kblabs.ru, status.kblabs.ru) that returns 4xx.
  # 5xx / timeouts are warnings only.
  # Suppress per-line with: // link-ignore
  # Runs at the declared @kb-labs/web-site anchor.
  - name: check-links
    run: node sites/web/apps/web/scripts/check-links.mjs
    on: [check]
    language: typescript
    anchor_packages: ["@kb-labs/web-site"]

  # SEO guard for @kb-labs/web-site.
  # Blocks CI on: missing generateMetadata, imageSegment not set, opengraph-image.tsx absent,
  # OG image using non-.meta.* i18n keys, title/description out of length bounds.
  # JSON-LD absence is a warning only (future work).
  # Suppress per-file with: // seo-ignore <rule> (rules: og-image, og-keys, jsonld, title-brand)
  # Runs at the declared @kb-labs/web-site anchor.
  - name: seo-check
    run: node sites/web/apps/web/scripts/seo-check.mjs
    on: [check]
    language: typescript
    anchor_packages: ["@kb-labs/web-site"]

  # CLI manifest naming conventions (ADR-0018, docs/plans/cli-naming-audit.md)
  # Rules: no kebab in path segments, no reserved namespaces, single-word top-level.
  # Known violations are tracked in KNOWN_VIOLATIONS inside the script — warnings only.
  # Remove from allowlist as commands are renamed.
  - name: cli-naming
    run: node scripts/checks/check-cli-naming.mjs
    on: [check]
    categories: [plugin-entry]

  # SEO guard for kblabs.ru + docs.kblabs.ru.
  # Blocks CI on: page.tsx without metadata, sitemap routes with no matching page.
  # Warns on: blog posts missing ru/ translation.
  - name: seo-lint
    run: node sites/web/scripts/seo-check.mjs
    on: [check]

  # Docs structural audit for @kb-labs/docs-site.
  # Rules sourced from sites/web/apps/docs/CONVENTIONS.md.
  # Blocks CI on: slug without MDX file, missing title frontmatter, non-kebab-case names,
  #               directory without index.mdx, depth > 2.
  # Warns on:     orphaned MDX files, missing _meta.json, pages without owners.
  # Runs at the declared @kb-labs/docs-site anchor.
  # Standalone:   node sites/web/apps/docs/scripts/docs-audit.mjs
  - name: docs-audit
    run: node sites/web/apps/docs/scripts/docs-audit.mjs
    on: [check]
    language: typescript
    anchor_packages: ["@kb-labs/docs-site"]

  # Port allocation policy (ADR-0024).
  # Blocks CI on: port outside all ranges (UNKNOWN_RANGE), two services sharing a
  #   port (DUPLICATE_PORT), prod service missing its docker-compose ports: map
  #   (PROD_NO_COMPOSE_PORT) or smoke test (PROD_NO_SMOKE_TEST), smoke-test port not
  #   matching the registry (PROD_PORT_MISMATCH), or a stale docs/ports.md (STALE_PORTS_DOC).
  # Source of truth: infra/port-registry.yaml + .kb/devservices*.yaml.
  # Fix a stale glossary with: pnpm ports:generate
  # Runs once at the declared @kb-labs/devkit anchor.
  # Standalone:   node scripts/checks/check-ports.mjs
  - name: check-ports
    run: node scripts/checks/check-ports.mjs
    on: [check]
    anchor_packages: ["@kb-labs/devkit"]

  # Assembly hook enforcement.
  # Blocks CI if any service bootstrap.ts calls runService without
  # importing from @kb-labs/plugin-runtime (i.e. without makeAssemblyHook).
  # TypeScript enforces this at compile time (assemblyHook is a required field).
  # This check provides a human-readable CI gate with clear error messages.
  # Runs once at the declared @kb-labs/devkit anchor.
  # Standalone:   node scripts/checks/check-assembly-hook.mjs
  - name: check-assembly-hook
    run: node scripts/checks/check-assembly-hook.mjs
    on: [check]
    anchor_packages: ["@kb-labs/devkit"]

  # Tracked Go tool binaries (tools/<name>/<name>) must be rebuilt when their
  # source changes — they ship in git so `pnpm build`/`dev:start` work without a
  # Go toolchain. Diff-based (binaries aren't byte-reproducible due to ldflags):
  # fails a PR where a tool's source changed but its committed binary did not.
  # Fix: `pnpm tools:rebuild && git add tools/<name>/<name>`.
  - name: tool-binaries-fresh
    run: node scripts/checks/check-tool-binaries.mjs
    on: [check]
    categories: [go-binary, internal-tool]

  # .kb/marketplace.lock hygiene — catches drift (a package dir was deleted
  # or moved but its lock entry wasn't) and corruption (malformed id/path
  # from a buggy install) before it silently rots. Same lock the MKT-02 e2e
  # diagnostics test and `kb marketplace doctor` both read.
  # The check resolves the lock's scope from the runtime's platform/project roots.
  # A shared development root is platform-owned; use the reported scope when syncing.
  # Runs once at the declared @kb-labs/devkit anchor.
  # Standalone: node scripts/checks/check-marketplace-lock.mjs
  - name: check-marketplace-lock
    run: node scripts/checks/check-marketplace-lock.mjs
    on: [check]
    anchor_packages: ["@kb-labs/devkit"]
    requires_build: ["@kb-labs/core-discovery", "@kb-labs/core-workspace"]

  # Architecture boundary + command-naming lints (tasks 0.2, 0.3, 0.5).
  # Pre-existing violations are listed with a date and reason in
  # scripts/checks/boundary-exceptions.json; anything not listed is an error, and an
  # exception whose violation is gone is a warning (delete it). Do not add exceptions
  # to silence new code. These checks use the declared @kb-labs/devkit anchor.
  # Standalone: node scripts/checks/check-<name>.mjs [--json] [--no-exceptions]
  # Tests:      pnpm test:checks

  # services/*, studio/*, plugins/*/daemon must not spawn kb / kb-create / kb-dev / kb-devkit
  # via child_process (0.2b, docs/architecture/target/05-executables.md section 3).
  - name: platform-spawn
    run: node scripts/checks/check-platform-spawn.mjs
    on: [check]
    anchor_packages: ["@kb-labs/devkit"]

  # Plugin package membership and both directions of the plugin/platform edge are checked
  # against the live workspace registry. Runtime imports are parsed as TypeScript AST nodes.
  - name: plugin-boundaries
    run: node scripts/checks/check-plugin-boundaries.mjs
    on: [check]
    scope: workspace

  # kb.plugin/3 cli.commands: verb from the closed vocabulary, lowercase kebab-case segments,
  # 'mutate' commands declare --json (0.5, docs/architecture/target/06-command-naming.md 1-3).
  # Reads the build-emitted dist/manifest.json — unbuilt packages only produce a warning,
  # so run it after `kb-devkit run build`.
  - name: manifest-command-naming
    run: node scripts/checks/check-manifest-command-naming.mjs 1>&2
    on: [check]

# ──────────────────────────────────────────────────────────────────────────────
# COVERAGE THRESHOLDS
# Enforced by: node scripts/merge-coverage.mjs --check
# Run:         pnpm coverage:check  (check only, no test re-run)
#              pnpm coverage        (run tests + check)
# ──────────────────────────────────────────────────────────────────────────────
coverage:
  # Map package name glob → threshold category (first match wins).
  # Skip patterns must come before layer patterns to override correctly.
  categories:
    "*-types":              skip   # type definitions — minimal executable code
    "*-contracts":          skip   # public shapes — tested via consumers
    "@kb-labs/e2e-*":       skip   # e2e suites — no unit coverage
    "@kb-labs/core-ipc":    skip   # IPC proxies/transport — covered by integration, hard to unit-test
    "@kb-labs/core-*":      core
    "@kb-labs/sdk*":        sdk
    "@kb-labs/shared-*":    shared
    "@kb-labs/cli-*":       shared
    "@kb-labs/adapters-*":  adapter
    "@kb-labs/studio-*":    studio
    "*-entry":              entry
    "*":                    plugin

  # current = floor matching today's data so CI is green immediately
  # target  = goal for Q3-2026, raise incrementally each quarter
  thresholds:
    #                   statements  functions  branches
    # current:               ~2%       67%       82%
    # target Q3-2026:        65%       75%       75%
    # Node 24/Vitest currently measures 59.7% for core; avoid a rounding-edge
    # failure while keeping the enforced floor meaningful.
    core:    { statements: 0,  functions: 59, branches: 60 }

    #                   statements  functions  branches
    # current:              49%       11%       83%
    # target Q3-2026:       65%       70%       60%
    # note: low fn% is expected — sdk is mostly re-exports
    sdk:     { statements: 45, functions: 10, branches: 80 }

    #                   statements  functions  branches
    # current:               ~9%      38%       61%
    # target Q3-2026:        50%      55%       50%
    # shared-http currently measures 33.3% functions in the full workspace run.
    shared:  { statements: 8,  functions: 33, branches: 55 }

    # plugin: not enforced yet — too many 0% packages from missing tests
    # target Q3-2026: statements 40, functions 45, branches 40
    plugin:  null

    # entry: thin CLI shells, covered by journey tests
    # target Q3-2026: statements 25, functions 30, branches 25
    entry:   null

    #                   statements  functions  branches
    # current:                0%      38%       39%
    # target Q3-2026:        40%      45%       35%
    studio:  { statements: 0,  functions: 35, branches: 35 }

    # adapter: integration-tested by nature, unit coverage low by design
    # target Q3-2026: statements 20, functions 25, branches 15
    adapter: null

    skip:    null
