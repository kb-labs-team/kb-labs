  - name: pr-description
    run: |
      if [ -z "${GITHUB_EVENT_PATH:-}" ]; then
        node scripts/checks/lib/check-result.mjs
      else
        event_kind=$(node -e 'const fs = require("node:fs"); const event = JSON.parse(fs.readFileSync(process.env.GITHUB_EVENT_PATH, "utf8")); process.stdout.write(event.pull_request ? "pull_request" : "other")')
        event_status=$?
        if [ "$event_status" -ne 0 ]; then
          exit "$event_status"
        elif [ "$event_kind" != "pull_request" ]; then
          node scripts/checks/lib/check-result.mjs
        else
          node scripts/ci/validate-pr-description.mjs 1>&2
        fi
      fi
    on: [check]
    scope: workspace

