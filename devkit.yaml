schemaVersion: 2
extends:
  - builtin:kb-labs

workspace:
  packageManager: pnpm
  maxDepth: 3  # max recursion depth for ** globs; increase if packages are nested deeper
  exclude:
    - plugins/fixtures/*   # test fixtures — not real packages, no build/lint/test tasks
    - templates/*          # scaffold templates — not compiled, only copied to new projects
    - e2e/shared           # shared fixtures package — no runnable tasks, just TS sources
    - e2e/tests            # legacy monolithic e2e bundle — superseded by per-domain packages
  categories:
    # Plugin E2E suites — the per-plugin test matrix. Each domain's SUBJECT is a
    # specific plugin (it depends on that plugin's workspace:* packages), so
    # `kb-devkit run e2e --affected` runs ONLY the suites whose plugin changed:
    #   edit plugins/mind/** → e2e-mind affected → only its suite runs.
    # Must come BEFORE `e2e-suite` (first-match wins): this is the plugin matrix,
    # `e2e-suite` below is the infrastructure matrix. Both use the same preset.
    plugin-e2e-suite:
      match:
        - "e2e/mind"          # plugins/mind
        - "e2e/workflows"     # plugins/workflow (+ release)
        - "e2e/marketplace"   # plugins/marketplace
        - "e2e/plugins"       # plugins/{commit,review,scaffold}
      language: typescript
      preset: e2e-suite

    # Infrastructure E2E suites — one package per domain, each runs `playwright
    # test`. Subject is the platform/gateway/services layer, not a single plugin.
    # Same preset + the same workspace:* --affected tracking.
    e2e-suite:
      match:
        - "e2e/services"
        - "e2e/platform"
        - "e2e/gateway"
        - "e2e/marketplace-registry"
        - "e2e/studio"
        - "e2e/rest-api"
        - "e2e/mcp"
      language: typescript
      preset: e2e-suite

    # SPA apps (Rspack / Vite) — pnpm build, not tsup
    # Must come before ts-lib since categories use first-match semantics
    spa:
      match:
        - "studio/app"
      language: typescript
      preset: spa-app

    # Plugin entry packages — tsup (CLI/REST) + rspack (Studio widgets)
    # Must come before ts-lib — plugins/*/entry would otherwise match ts-lib first
    plugin-entry:
      match:
        - "plugins/*/entry"
        - "plugins/release/manager-cli"  # non-standard name, but has rspack studio build
      language: typescript
      preset: plugin-entry

    # Backend app entrypoints (daemons, servers)
    # Must come before ts-lib — plugins/*/*  would otherwise match first
    ts-app:
      match:
        - "plugins/*/daemon"
        - "plugins/*/server"
        - "plugins/*/app"
        - "services/*/app"
        - "services/*/daemon"
        - "services/rest-api/core"
      language: typescript
      preset: node-app

    # Adapter packages — node-lib + SDK-only dependency boundary.
    # Must come before ts-lib so adapters/* doesn't match ts-lib first.
    adapter:
      match:
        - "adapters/*"
      language: typescript
      preset: adapter-lib

    # TypeScript libraries — full ruleset
    ts-lib:
      match:
        - "core/*"
        - "sdk/*"
        - "cli/*"
        - "shared/*"
        - "plugins/*/*"
        - "services/*/*"
        - "infra/devkit"
        - "studio/*"
        - "templates/*"
      language: typescript
      preset: node-lib

    # Next.js / Nuxt site apps
    site:
      match:
        - "sites/*"
      language: typescript
      preset: site

    go-binary:
      match:
        - "tools/clikit"
        - "tools/kb-dev"
        - "tools/kb-devkit"
        - "tools/kb-create"
        - "tools/kb-deploy"
        - "tools/kb-monitor"
        - "tools/kb-env"
      language: go
      preset: go-binary

# ──────────────────────────────────────────────────────────────────────────────
# PRESETS
# ──────────────────────────────────────────────────────────────────────────────

presets:
  # Playwright e2e suite — minimal preset, only requires `e2e` script
  e2e-suite:
    language: typescript
    package_json:
      required_scripts:
        - e2e
      required_fields:
        - name
        - version
    dependencies:
      check_links: false
      check_circular: false

  # Plugin entry packages — node-lib + required test:cli script
  plugin-entry:
    language: typescript
    package_json:
      required_scripts:
        - build
        - dev
        - test
        - test:cli
        - lint
        - type-check
        - clean
      required_dev_deps:
        typescript: "^5"
        tsup: "^8"
        vitest: "^3"
        "@kb-labs/devkit": "*"
      required_fields:
        - name
        - version
        - type
        - engines
        - exports
      type: module
      engines:
        node: ">=24.0.0"
        pnpm: ">=9.0.0"
    tsconfig:
      must_extend_pattern: "@kb-labs/devkit/tsconfig/"
      forbid_paths: true
    tsup:
      must_use_preset: true
      dts_required: true
      tsconfig_must_be_build: false
    eslint:
      must_use_preset: true
    structure:
      required_files:
        - src/index.ts
        - README.md
    dependencies:
      check_links: true
      check_circular: true
      check_version_consistency: true

  node-lib:
    language: typescript
    package_json:
      required_scripts:
        - build
        - dev
        - test
        - lint
        - type-check
        - clean
      required_dev_deps:
        typescript: "^5"
        tsup: "^8"
        vitest: "^3"
        "@kb-labs/devkit": "*"
      required_fields:
        - name
        - version
        - type
        - engines
        - exports
      type: module
      engines:
        node: ">=24.0.0"
        pnpm: ">=9.0.0"
    tsconfig:
      must_extend_pattern: "@kb-labs/devkit/tsconfig/"
      forbid_paths: true
    tsup:
      must_use_preset: true
      dts_required: true
      tsconfig_must_be_build: false  # not all packages have tsconfig.build.json yet
    eslint:
      must_use_preset: true
    structure:
      required_files:
        - src/index.ts
        - README.md
    dependencies:
      check_links: true
      check_circular: true
      check_version_consistency: true

  # Adapter packages — extends node-lib with an SDK-only dependency boundary.
  # An adapter author may import only from @kb-labs/sdk (and its sub-paths);
  # all platform internals (core-*, cli-*, shared-*, plugin-*, etc.) are
  # surfaced through SDK barrels, not pulled directly.
  adapter-lib:
    extends: node-lib
    dependencies:
      check_links: true
      check_circular: true
      check_version_consistency: true
      allowed_kb_deps:
        - "@kb-labs/sdk"
        - "@kb-labs/sdk/*"
        - "@kb-labs/devkit"
        - "@kb-labs/gateway-auth"   # environment adapters sign JWTs via gateway-auth
        - "@kb-labs/adapters-sqlite" # low-level DB driver; higher-level adapters may build on it
      forbidden_kb_deps:
        - "@kb-labs/core-*"
        - "@kb-labs/cli-*"
        - "@kb-labs/shared-*"
        - "@kb-labs/plugin-*"
        - "@kb-labs/workflow-*"
        - "@kb-labs/rest-api-*"
        - "@kb-labs/studio-*"
        - "@kb-labs/gateway-*"
        - "@kb-labs/host-agent-*"
        - "@kb-labs/state-*"
        - "@kb-labs/tenant"
        - "@kb-labs/perm-*"
        - "@kb-labs/adapters-*"

  node-app:
    language: typescript
    package_json:
      required_scripts:
        - build
        - dev
      required_fields:
        - name
        - version
      required_dev_deps:
        typescript: "^5"
        "@kb-labs/devkit": "*"
    tsconfig:
      must_extend_pattern: "@kb-labs/devkit/tsconfig/"
      forbid_paths: false
    eslint:
      must_use_preset: true
    dependencies:
      check_links: true
      check_circular: true

  # SPA apps (Rspack / Vite) — no tsup, no exports, paths allowed
  spa-app:
    language: typescript
    package_json:
      required_scripts:
        - build
        - dev
      required_fields:
        - name
        - version
    tsconfig:
      forbid_paths: false
    eslint:
      must_use_preset: true
    dependencies:
      check_links: true
      check_circular: true

  # Next.js/Nuxt apps and their utility packages.
  # Only 'build' is universally required — apps have 'dev', utility packages don't.
  site:
    language: typescript
    package_json:
      required_scripts:
        - build
      required_fields:
        - name
        - version
    dependencies:
      check_links: false
      check_circular: false

  go-binary:
    language: go
    structure:
      required_files:
        - go.mod
        - Makefile
    go:
      min_version: "1.22"

# ──────────────────────────────────────────────────────────────────────────────
# STRUCTURE CHECKS — plugin/core package conventions
# ──────────────────────────────────────────────────────────────────────────────

structure_checks:
  # Every plugin group MUST have entry/, contracts/, core/
  plugin:
    scope: "plugins/*"
    required_packages:
      - name: entry
        description: "Plugin entry point — manifest, registerPlugin(), CLI commands, Studio pages"
        required_files:
          - src/index.ts
        must_depend_on:
          - "@kb-labs/sdk"
      - name: contracts
        description: "Type definitions — zero runtime dependencies"
        required_files:
          - src/index.ts
        rules:
          - no_runtime_deps   # only devDependencies + types allowed
      - name: core
        description: "Business logic"
        required_files:
          - src/index.ts
    optional_packages:
      - name: daemon
        description: "HTTP service (long-running process with port)"
        required_files:
          - src/bootstrap.ts
        must_depend_on:
          - "@kb-labs/gateway-contracts"
    dependency_rules:
      # contracts has zero internal deps
      - from: contracts
        to: []
      # core depends on contracts only (within the plugin)
      - from: core
        to: [contracts]
      # entry wires everything together
      - from: entry
        to: [contracts, core]
      # daemon depends on core + contracts
      - from: daemon
        to: [contracts, core]
      # nothing depends on entry (it's the leaf)
      - from: "*"
        not_to: [entry]

  # Core packages MUST have contracts/ (types/) as foundation
  core:
    scope: "core"
    required_packages:
      - name: types
        description: "Base type definitions for entire platform"
        rules:
          - no_runtime_deps
      - name: contracts
        description: "Platform contracts"
        rules:
          - no_runtime_deps

# ──────────────────────────────────────────────────────────────────────────────
# SCAFFOLDING — kb-devkit generate <template> --dest <path> --name <pkg-name>
# Sources: local | npm | git | url
# ──────────────────────────────────────────────────────────────────────────────

scaffolding:
  templates:
    node-lib:
      source: local
      path: templates/node-lib

    go-binary:
      source: local
      path: templates/go-binary

    # plugin:
    #   source: local
    #   path: infra/devkit/templates/plugin
    #
    # adapter:
    #   source: npm
    #   package: "@kb-labs/template-adapter"
    #
    # starter:
    #   source: git
    #   url: "https://github.com/org/repo"
    #   ref: "main"

# ──────────────────────────────────────────────────────────────────────────────
# SYNC — devkit assets
# ──────────────────────────────────────────────────────────────────────────────

sync:
  sources:
    devkit:
      type: local
      path: infra/devkit

  targets:
    - source: devkit
      from: agents/
      to: .kb/devkit/agents/
    - source: devkit
      from: assets/claude/skills/
      to: skills/

  exclude:
    - skills/my-custom-skill.ts
    - .vscode/launch.json

# ──────────────────────────────────────────────────────────────────────────────
# AFFECTED — how `kb-devkit run --affected` detects changed packages
# ──────────────────────────────────────────────────────────────────────────────

affected:
  # strategy: git (default) | submodules | command
  #   git        — single `git diff --name-only HEAD` from workspace root
  #                (uncommitted changes only — CI checkouts have clean tree!)
  #   submodules — walks .gitmodules, runs git diff inside each submodule
  #   command    — runs `command`, reads one file path per line from stdout
  #
  # We use `command` + .devkit/affected.sh so CI can override the base ref via
  # KB_DEVKIT_BASE_REF env var (e.g. origin/main...HEAD for PRs). Locally it
  # falls through to the same behaviour as the built-in git strategy.
  strategy: command
  command: .devkit/affected.sh

# ──────────────────────────────────────────────────────────────────────────────
# BUILD
# ──────────────────────────────────────────────────────────────────────────────

run:
  concurrency: 8

# ──────────────────────────────────────────────────────────────────────────────
# TASKS — execution engine (kb-devkit run <task>)
# content-addressable cache: hash(inputs) → skip if unchanged
# ──────────────────────────────────────────────────────────────────────────────

tasks:
  build:
    - categories: [plugin-entry]
      command: pnpm build
      inputs:
        - "src/**"
        - "tsup.config.ts"
        - "tsup.config.js"
        - "tsconfig*.json"
        - "rspack.studio.config.*"
        - "package.json"
        - "^dist/**"
      outputs:
        - "dist/**"
      deps:
        - "^build"

    - categories: [ts-lib, ts-app, adapter]
      command: tsup
      inputs:
        - "src/**"
        - "tsup.config.ts"
        - "tsup.config.js"
        - "tsconfig*.json"
        - "^dist/**"
      outputs:
        - "dist/**"
      deps:
        - "^build"   # deps' build must finish first

    - categories: [spa]
      command: pnpm build
      inputs:
        - "src/**"
        - "public/**"
        - "rspack.config.*"
        - "vite.config.*"
        - "tailwind.config.*"
        - "postcss.config.*"
        - "index.html"
        - "package.json"
        - "^dist/**"
      outputs:
        - "dist/**"
      deps:
        - "^build"

    - categories: [go-binary]
      command: make build
      inputs:
        - "**/*.go"
        - "go.mod"
        - "go.sum"
        - "Makefile"
        - "internal/manifest/manifest.json"
      outputs:
        - "kb-devkit"
        - "kb-dev"
        - "kb-create"
        - "kb-deploy"
        - "kb-monitor"

    - categories: [site]
      command: pnpm build
      inputs:
        - "app/**"
        - "components/**"
        - "messages/**"
        - "public/**"
        - "next.config.*"
        - "tailwind.config.*"
        - "package.json"
        - "^dist/**"
      outputs:
        - ".next/**"
      deps:
        - "^build"   # wait for ts-lib deps (e.g. @kb-labs/sdk)

    - categories: [site-pkg]
      command: tsc --noEmit
      inputs:
        - "src/**"
        - "tsconfig*.json"
        - "^dist/**"
      outputs: []
      deps:
        - "^build"

  lint:
    - categories: [ts-lib, ts-app]
      command: eslint src/
      inputs:
        - "src/**"
        - "eslint.config.*"
        - ".eslintrc*"
      outputs: []

    - categories: [go-binary]
      command: go vet ./...
      inputs:
        - "**/*.go"
        - "go.mod"
      outputs: []

    - categories: [site]
      command: pnpm lint
      inputs:
        - "app/**"
        - "components/**"
        - "eslint.config.*"
        - "package.json"
      outputs: []

    - categories: [site-pkg]
      command: eslint --no-error-on-unmatched-pattern src/
      inputs:
        - "src/**"
        - "eslint.config.*"
      outputs: []

  type-check:
    - categories: [ts-lib, ts-app]
      command: tsc --noEmit
      inputs:
        - "src/**"
        - "tsconfig*.json"
        - "^dist/**/*.d.ts"   # dep type declarations affect type resolution
      outputs: []
      deps:
        - "^build"   # needs deps' dist/**/*.d.ts

    - categories: [site]
      command: pnpm typecheck
      inputs:
        - "app/**"
        - "components/**"
        - "tsconfig*.json"
        - "package.json"
        - "^dist/**/*.d.ts"   # dep type declarations affect type resolution
      outputs: []
      deps:
        - "^build"

    - categories: [site-pkg]
      command: tsc --noEmit
      inputs:
        - "src/**"
        - "tsconfig*.json"
        - "^dist/**/*.d.ts"   # dep type declarations affect type resolution
      outputs: []
      deps:
        - "^build"

  # Playwright e2e suites.
  # Each domain package declares devDependencies on the services it tests.
  # This means `kb-devkit run e2e --affected` only runs suites whose
  # upstream packages changed — e.g. changing workflow-engine triggers
  # only @kb-labs/e2e-workflows, not gateway or marketplace.
  #
  # Local run (services already up via kb-dev start):
  #   kb-devkit run e2e --packages @kb-labs/e2e-workflows
  # Full run:
  #   kb-devkit run e2e
  # Affected only:
  #   kb-devkit run e2e --affected
  test:
    - categories: [ts-lib, ts-app]
      command: vitest run --passWithNoTests
      inputs:
        - "src/**"
        - "test/**"
        - "__tests__/**"
        - "vitest.config.*"
        - "^dist/**"   # dep outputs affect test results at runtime
      outputs:
        - "coverage/**"
      deps:
        - "build"

    - categories: [go-binary]
      command: make test
      inputs:
        - "**/*.go"
        - "go.mod"
        - "go.sum"
        - "Makefile"
        - "internal/manifest/manifest.json"
      outputs: []

  test:coverage:
    - categories: [ts-lib, ts-app]
      command: npx vitest run --passWithNoTests --coverage
      inputs:
        - "src/**"
        - "test/**"
        - "__tests__/**"
        - "vitest.config.*"
      outputs:
        - "coverage/**"
      deps:
        - "build"

    - categories: [go-binary]
      command: go test -short -coverprofile=coverage.out -covermode=atomic ./...
      inputs:
        - "**/*.go"
        - "go.mod"
      outputs:
        - "coverage.out"

  # e2e: Playwright domain suites + Go binary integration tests.
  # Playwright: kb-devkit run e2e --packages @kb-labs/e2e-workflows (one domain)
  #             kb-devkit run e2e --affected                         (changed only)
  #             kb-devkit run e2e                                    (all)
  # Go:         only kb-create has a real suite; others are no-ops for uniformity.
  # CLI handler tests — fast, no daemon required.
  # Run: kb-devkit run test:cli
  # Run affected only: kb-devkit run test:cli --affected
  test:cli:
    - categories: [plugin-entry]
      command: pnpm run test:cli
      inputs:
        - "src/__tests__/cli/**"
        - "src/commands/**"
        - "vitest.cli.config.*"
      outputs: []
      deps:
        - "build"
      cache: false

  e2e:
    # Both the infrastructure matrix (e2e-suite) and the per-plugin matrix
    # (plugin-e2e-suite) run the same `pnpm run e2e`. `--affected` then scopes
    # to whichever suites' workspace deps changed.
    - categories: [e2e-suite, plugin-e2e-suite]
      command: pnpm run e2e
      inputs:
        - "specs/**"
        - "scenarios/**"
        - "lib/**"
        - "playwright.config.ts"
        - "tsconfig.json"
      outputs: []
      deps:
        - "^build"
      # E2E correctness depends on live platform services, not just source.
      # Caching by input hash would return stale 'success' across runs even
      # though no test process actually executed — disabled, same as test:cli.
      cache: false

    - categories: [go-binary]
      command: make e2e
      inputs:
        - "**/*.go"
        - "go.mod"
        - "go.sum"
        - "Makefile"
        - "internal/manifest/manifest.json"
      outputs: []

# ──────────────────────────────────────────────────────────────────────────────
# CUSTOM CHECKS
# ──────────────────────────────────────────────────────────────────────────────
# Each entry runs for all packages that match its `categories` filter (or all
# packages if omitted). The script runs with cwd = package directory and
# receives the package JSON on stdin. It must exit 0 and print JSON:
#   { ok: boolean, items: [{ target, message, fix? }] }

custom_checks:
  - name: test-pyramid
    run: node scripts/checks/check-test-pyramid.mjs
    on: [check]
    categories: [plugin-entry]

  # i18n translation guard for @kb-labs/web-site.
  # Blocks CI on: EN↔RU key mismatch, missing keys, hardcoded Cyrillic in .tsx.
  # UNUSED keys are emitted as warnings (autoFixable — devkit fix removes them).
  # Suppress per-line with: // i18n-ignore
  # Script self-filters: skips all packages except @kb-labs/web-site.
  - name: i18n-check
    run: node sites/web/apps/web/scripts/i18n-check.mjs
    fix: node sites/web/apps/web/scripts/i18n-check.mjs
    on: [check]
    language: typescript

  # Broken-link guard for KB Labs sites (web + docs).
  # Blocks CI on: internal href with no matching Next.js route, or a controlled-domain
  # URL (kblabs.ru, docs.kblabs.ru, status.kblabs.ru) that returns 4xx.
  # 5xx / timeouts are warnings only.
  # Suppress per-line with: // link-ignore
  # Script self-filters: skips all packages except @kb-labs/web-site.
  - name: check-links
    run: node sites/web/apps/web/scripts/check-links.mjs
    on: [check]
    language: typescript

  # SEO guard for @kb-labs/web-site.
  # Blocks CI on: missing generateMetadata, imageSegment not set, opengraph-image.tsx absent,
  # OG image using non-.meta.* i18n keys, title/description out of length bounds.
  # JSON-LD absence is a warning only (future work).
  # Suppress per-file with: // seo-ignore <rule> (rules: og-image, og-keys, jsonld, title-brand)
  # Script self-filters: skips all packages except @kb-labs/web-site.
  - name: seo-check
    run: node sites/web/apps/web/scripts/seo-check.mjs
    on: [check]
    language: typescript

  # CLI manifest naming conventions (ADR-0018, docs/plans/cli-naming-audit.md)
  # Rules: no kebab in path segments, no reserved namespaces, single-word top-level.
  # Known violations are tracked in KNOWN_VIOLATIONS inside the script — warnings only.
  # Remove from allowlist as commands are renamed.
  - name: cli-naming
    run: node scripts/checks/check-cli-naming.mjs
    on: [check]
    categories: [plugin-entry]

  # SEO guard for kblabs.ru + docs.kblabs.ru.
  # Blocks CI on: page.tsx without metadata, sitemap routes with no matching page.
  # Warns on: blog posts missing ru/ translation.
  - name: seo-lint
    run: node sites/web/scripts/seo-check.mjs
    on: [check]

  # Docs structural audit for @kb-labs/docs-site.
  # Rules sourced from sites/web/apps/docs/CONVENTIONS.md.
  # Blocks CI on: slug without MDX file, missing title frontmatter, non-kebab-case names,
  #               directory without index.mdx, depth > 2.
  # Warns on:     orphaned MDX files, missing _meta.json, pages without owners.
  # Self-filters: skips all packages except @kb-labs/docs-site.
  # Standalone:   node sites/web/apps/docs/scripts/docs-audit.mjs
  - name: docs-audit
    run: node sites/web/apps/docs/scripts/docs-audit.mjs
    on: [check]
    language: typescript

  # Port allocation policy (ADR-0024).
  # Blocks CI on: port outside all ranges (UNKNOWN_RANGE), two services sharing a
  #   port (DUPLICATE_PORT), prod service missing its docker-compose ports: map
  #   (PROD_NO_COMPOSE_PORT) or smoke test (PROD_NO_SMOKE_TEST), smoke-test port not
  #   matching the registry (PROD_PORT_MISMATCH), or a stale docs/ports.md (STALE_PORTS_DOC).
  # Source of truth: infra/port-registry.yaml + .kb/devservices*.yaml.
  # Fix a stale glossary with: pnpm ports:generate
  # Self-filters: runs once, anchored to @kb-labs/devkit.
  # Standalone:   node scripts/checks/check-ports.mjs
  - name: check-ports
    run: node scripts/checks/check-ports.mjs
    on: [check]

  # Assembly hook enforcement.
  # Blocks CI if any service bootstrap.ts calls runService without
  # importing from @kb-labs/plugin-runtime (i.e. without makeAssemblyHook).
  # TypeScript enforces this at compile time (assemblyHook is a required field).
  # This check provides a human-readable CI gate with clear error messages.
  # Self-filters: runs once, anchored to @kb-labs/devkit.
  # Standalone:   node scripts/checks/check-assembly-hook.mjs
  - name: check-assembly-hook
    run: node scripts/checks/check-assembly-hook.mjs
    on: [check]

  # Tracked Go tool binaries (tools/<name>/<name>) must be rebuilt when their
  # source changes — they ship in git so `pnpm build`/`dev:start` work without a
  # Go toolchain. Diff-based (binaries aren't byte-reproducible due to ldflags):
  # fails a PR where a tool's source changed but its committed binary did not.
  # Fix: `pnpm tools:rebuild && git add tools/<name>/<name>`.
  - name: tool-binaries-fresh
    run: node scripts/checks/check-tool-binaries.mjs
    on: [check]
    categories: [go-binary]

  # .kb/marketplace.lock hygiene — catches drift (a package dir was deleted
  # or moved but its lock entry wasn't) and corruption (malformed id/path
  # from a buggy install) before it silently rots. Same lock the MKT-02 e2e
  # diagnostics test and `kb marketplace doctor` both read.
  # Fix: no CLI command prunes stale entries yet ("marketplace sync" only
  # adds, "rehash" only rebuilds discovery hashes) — edit
  # .kb/marketplace.lock by hand to remove the offending entry.
  # Self-filters: runs once, anchored to @kb-labs/devkit.
  # Standalone: node scripts/checks/check-marketplace-lock.mjs
  - name: check-marketplace-lock
    run: node scripts/checks/check-marketplace-lock.mjs
    on: [check]

  # Architecture boundary + command-naming lints (tasks 0.2, 0.3, 0.5).
  # Pre-existing violations are listed with a date and reason in
  # scripts/checks/boundary-exceptions.json; anything not listed is an error, and an
  # exception whose violation is gone is a warning (delete it). Do not add exceptions
  # to silence new code. All four self-filter: run once, anchored to @kb-labs/devkit.
  # Standalone: node scripts/checks/check-<name>.mjs [--json] [--no-exceptions]
  # Tests:      pnpm test:checks

  # Plugins must not import @kb-labs/core-* bypassing @kb-labs/sdk (0.2a).
  - name: plugin-imports
    run: node scripts/checks/check-plugin-imports.mjs
    on: [check]

  # services/*, studio/*, plugins/*/daemon must not spawn kb / kb-create / kb-dev / kb-devkit
  # via child_process (0.2b, docs/architecture/target/05-executables.md section 3).
  - name: platform-spawn
    run: node scripts/checks/check-platform-spawn.mjs
    on: [check]

  # Platform packages (@kb-labs/sdk, core-*, cli-*, shared-*, adapters-*, plugin-contracts/runtime/
  # execution*) must be peerDependencies, not dependencies, in plugins/* and the plugin template (0.3).
  - name: plugin-peer-deps
    run: node scripts/checks/check-plugin-peer-deps.mjs
    on: [check]

  # kb.plugin/3 cli.commands: verb from the closed vocabulary, lowercase kebab-case segments,
  # 'mutate' commands declare --json (0.5, docs/architecture/target/06-command-naming.md 1-3).
  # Reads the build-emitted dist/manifest.json — unbuilt packages only produce a warning,
  # so run it after `kb-devkit run build`.
  - name: manifest-command-naming
    run: node scripts/checks/check-manifest-command-naming.mjs
    on: [check]

# ──────────────────────────────────────────────────────────────────────────────
# COVERAGE THRESHOLDS
# Enforced by: node scripts/merge-coverage.mjs --check
# Run:         pnpm coverage:check  (check only, no test re-run)
#              pnpm coverage        (run tests + check)
# ──────────────────────────────────────────────────────────────────────────────
coverage:
  # Map package name glob → threshold category (first match wins).
  # Skip patterns must come before layer patterns to override correctly.
  categories:
    "*-types":              skip   # type definitions — minimal executable code
    "*-contracts":          skip   # public shapes — tested via consumers
    "@kb-labs/e2e-*":       skip   # e2e suites — no unit coverage
    "@kb-labs/core-ipc":    skip   # IPC proxies/transport — covered by integration, hard to unit-test
    "@kb-labs/core-*":      core
    "@kb-labs/sdk*":        sdk
    "@kb-labs/shared-*":    shared
    "@kb-labs/cli-*":       shared
    "@kb-labs/adapters-*":  adapter
    "@kb-labs/studio-*":    studio
    "*-entry":              entry
    "*":                    plugin

  # current = floor matching today's data so CI is green immediately
  # target  = goal for Q3-2026, raise incrementally each quarter
  thresholds:
    #                   statements  functions  branches
    # current:               ~2%       67%       82%
    # target Q3-2026:        65%       75%       75%
    # Node 24/Vitest currently measures 59.7% for core; avoid a rounding-edge
    # failure while keeping the enforced floor meaningful.
    core:    { statements: 0,  functions: 59, branches: 60 }

    #                   statements  functions  branches
    # current:              49%       11%       83%
    # target Q3-2026:       65%       70%       60%
    # note: low fn% is expected — sdk is mostly re-exports
    sdk:     { statements: 45, functions: 10, branches: 80 }

    #                   statements  functions  branches
    # current:               ~9%      38%       61%
    # target Q3-2026:        50%      55%       50%
    # shared-http currently measures 33.3% functions in the full workspace run.
    shared:  { statements: 8,  functions: 33, branches: 55 }

    # plugin: not enforced yet — too many 0% packages from missing tests
    # target Q3-2026: statements 40, functions 45, branches 40
    plugin:  null

    # entry: thin CLI shells, covered by journey tests
    # target Q3-2026: statements 25, functions 30, branches 25
    entry:   null

    #                   statements  functions  branches
    # current:                0%      38%       39%
    # target Q3-2026:        40%      45%       35%
    studio:  { statements: 0,  functions: 35, branches: 35 }

    # adapter: integration-tested by nature, unit coverage low by design
    # target Q3-2026: statements 20, functions 25, branches 15
    adapter: null

    skip:    null
