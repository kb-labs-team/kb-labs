schemaVersion: 2
extends:
  - builtin:kb-labs

workspace:
  packageManager: pnpm
  maxDepth: 3  # max recursion depth for ** globs; increase if packages are nested deeper
  exclude:
    - plugins/fixtures/*   # test fixtures — not real packages, no build/lint/test tasks
    - templates/*          # scaffold templates — not compiled, only copied to new projects
    - e2e/tests            # legacy monolithic e2e bundle — superseded by per-domain packages
  categories:
    # Plugin E2E suites — the per-plugin test matrix. Each domain's SUBJECT is a
    # specific plugin (it depends on that plugin's workspace:* packages), so
    # `kb-devkit run e2e --affected` runs ONLY the suites whose plugin changed:
    #   edit plugins/mind/** → e2e-mind affected → only its suite runs.
    # Must come BEFORE `e2e-suite` (first-match wins): this is the plugin matrix,
    # `e2e-suite` below is the infrastructure matrix. Both use the same preset.
    plugin-e2e-suite:
      match:
        - "e2e/mind"          # plugins/mind
        - "e2e/workflows"     # services/workflow (+ release)
        - "e2e/marketplace"   # services/marketplace and built-in CLI commands
        - "e2e/plugins"       # plugins/{commit,review,scaffold}
      language: typescript
      preset: e2e-suite

    # Candidate-pack extras are package fixtures, not production libraries.
    # They need valid package identities for packing but do not carry a
    # publishable Node library's scripts, tsconfig, tsup, lint, or source layout.
    # The adapter fixture also owns node:test files, so it gets its own
    # category for the test task; both share the fixture preset and build.
    fixture-adapter:
      match:
        - "e2e/fixtures/adapters/*"
      language: javascript
      preset: candidate-fixture

    fixture:
      match:
        - "e2e/journey/fixtures/*"
      language: javascript
      preset: candidate-fixture

    e2e-node-tests:
      match:
        - "e2e/shared"
        - "e2e/delivery"
      language: javascript
      preset: e2e-node-tests

    # The platform package owns node:test files as well as the live Playwright
    # entrypoint, so it has its own category and participates in both tasks.
    e2e-platform:
      match:
        - "e2e/platform"
      language: javascript
      preset: e2e-node-tests

    # Infrastructure E2E suites — Playwright tasks run only through `e2e`,
    # which requires the platform services to be running.
    e2e-suite:
      match:
        - "e2e/services"
        - "e2e/gateway"
        - "e2e/marketplace-registry"
        - "e2e/studio"
        - "e2e/rest-api"
        - "e2e/mcp"
      language: typescript
      preset: e2e-suite

    # SPA apps (Rspack / Vite) — pnpm build, not tsup
    # Must come before ts-lib since categories use first-match semantics
    spa:
      match:
        - "studio/app"
      language: typescript
      preset: spa-app

    # Plugin roots — one sealed package per manifest identity.
    # Must come before ts-lib so every plugins/<id> package gets this boundary.
    plugin-entry:
      match:
        - "plugins/*"
      language: typescript
      preset: plugin-entry

    # Backend app entrypoints (daemons, servers)
    # Must come before ts-lib — plugin roots are classified by the earlier plugin rule.
    ts-app:
      match:
        - "plugins/*/daemon"
        - "plugins/*/server"
        - "plugins/*/app"
        - "services/*/app"
        - "services/*/daemon"
        - "services/rest-api/core"
      language: typescript
      preset: node-app

    # Adapter packages — node-lib + SDK-only dependency boundary.
    adapter:
      match:
        - "adapters/*"
      language: typescript
      preset: adapter-lib

    # Runtime is the sole platform owner permitted to construct the backend.
    core-runtime:
      match:
        - "core/runtime"
      language: typescript
      preset: runtime-core

    # TypeScript libraries — full ruleset
    # The UI kit owns generated component documentation as an explicit build prerequisite.
    studio-ui-kit:
      match:
        - "studio/ui-kit"
      language: typescript
      preset: node-lib

    ts-lib:
      match:
        - "core/*"
        - "sdk/*"
        - "cli/*"
        - "cli/*/*"
        - "shared/*"
        - "services/*/*"
        - "infra/devkit"
        - "studio/*"
        - "templates/*"
      language: typescript
      preset: node-lib

    # Product apps (marketing site, docs): not part of the platform, so a plain
    # `kb-devkit run build` leaves their build out (defaultBuild: false) and says
    # so. Build them with --packages, or let --affected select them.
    #
    # Next.js / Nuxt site apps
    site:
      match:
        - "sites/*"
      language: typescript
      preset: site
      defaultBuild: false

    site-config:
      match:
        - "sites/*/packages/config"
      language: typescript
      preset: site-pkg
      defaultBuild: false

    # `next build` writes .next with absolute workspace paths embedded
    # (required-server-files.json and compiled chunks), so its output cannot be
    # restored into another checkout. Apps therefore get their own build variant
    # that always executes; the libraries below keep exit-code caching.
    site-app:
      match:
        - "sites/*/apps/*"
      language: typescript
      preset: site-pkg
      defaultBuild: false

    site-pkg:
      match:
        - "sites/*/packages/*"
      language: typescript
      preset: site-pkg
      defaultBuild: false

    internal-tool:
      match:
        - "tools/kb-runner"
      language: go
      preset: go-binary
      releaseLane: internal-tool

    go-binary:
      match:
        - "tools/clikit"
        - "tools/kb-dev"
        - "tools/kb-devkit"
        - "tools/kb-create"
        - "tools/kb-deploy"
        - "tools/kb-monitor"
        - "tools/kb-env"
      language: go
      preset: go-binary

# ──────────────────────────────────────────────────────────────────────────────
# PRESETS
# ──────────────────────────────────────────────────────────────────────────────

presets:
  # Playwright e2e suite — minimal preset, only requires `e2e` script
  e2e-suite:
    extends: backend-construction-boundary
    language: typescript
    package_json:
      required_scripts:
        - e2e
      required_fields:
        - name
        - version
    dependencies:
      check_links: false
      check_circular: false

  e2e-node-tests:
    language: javascript
    package_json:
      required_scripts:
        - test
      required_fields:
        - name
        - version
    dependencies:
      check_links: false
      check_circular: false

  # Plugin entry packages — node-lib. CLI test requirements follow the plugin manifest.
  plugin-entry:
    extends: backend-construction-boundary
    language: typescript
    package_json:
      required_scripts:
        - build
        - dev
        - test
        - lint
        - type-check
        - clean
      required_dev_deps:
        typescript: "^5"
        tsup: "^8"
        vitest: "^4"
        "@kb-labs/devkit": "*"
      required_fields:
        - name
        - version
        - type
        - engines
        - exports
      type: module
      engines:
        pnpm: ">=9.0.0"
    tsconfig:
      must_extend_pattern: "@kb-labs/devkit/tsconfig/"
      forbid_paths: true
    tsup:
      must_use_preset: true
      dts_required: true
      tsconfig_must_be_build: false
    eslint:
      must_use_preset: true
    structure:
      required_files:
        - src/index.ts
        - README.md
    dependencies:
      check_links: true
      check_circular: true
      check_version_consistency: true
      allowed_kb_deps:
        - "@kb-labs/sdk"
        - "@kb-labs/devkit"
        - "@kb-labs/studio-plugin-tools"

  node-lib:
    extends: backend-construction-boundary
    language: typescript
    package_json:
      required_scripts:
        - build
        - dev
        - test
        - lint
        - type-check
        - clean
      required_dev_deps:
        typescript: "^5"
        tsup: "^8"
        vitest: "^4"
        "@kb-labs/devkit": "*"
      required_fields:
        - name
        - version
        - type
        - engines
        - exports
      type: module
      engines:
        pnpm: ">=9.0.0"
    tsconfig:
      must_extend_pattern: "@kb-labs/devkit/tsconfig/"
      forbid_paths: true
    tsup:
      must_use_preset: true
      dts_required: true
      tsconfig_must_be_build: false  # not all packages have tsconfig.build.json yet
    eslint:
      must_use_preset: true
    structure:
      required_files:
        - src/index.ts
        - README.md
    dependencies:
      check_links: true
      check_circular: true
      check_version_consistency: true

  # Candidate fixtures only require the manifest identity consumed by packers.
  candidate-fixture:
    language: javascript
    package_json:
      required_fields:
        - name
        - version

  # The execution backend constructor is a runtime-owned capability.
  runtime-core:
    extends: node-lib
    dependencies:
      allowed_kb_imports:
        - "@kb-labs/plugin-execution-factory/construct"

  # Adapter packages — extends node-lib with an SDK-only dependency boundary.
  # An adapter author may import only from @kb-labs/sdk (and its sub-paths);
  # all platform internals (core-*, cli-*, shared-*, plugin-*, etc.) are
  # surfaced through SDK barrels, not pulled directly.
  adapter-lib:
    extends: node-lib
    dependencies:
      check_links: true
      check_circular: true
      check_version_consistency: true
      allowed_kb_deps:
        - "@kb-labs/sdk"
        - "@kb-labs/sdk/*"
        - "@kb-labs/devkit"
        - "@kb-labs/gateway-auth"   # environment adapters sign JWTs via gateway-auth
        - "@kb-labs/adapters-sqlite" # low-level DB driver; higher-level adapters may build on it
      forbidden_kb_deps:
        - "@kb-labs/core-*"
        - "@kb-labs/cli-*"
        - "@kb-labs/shared-*"
        - "@kb-labs/plugin-*"
        - "@kb-labs/workflow-*"
        - "@kb-labs/rest-api-*"
        - "@kb-labs/studio-*"
        - "@kb-labs/gateway-*"
        - "@kb-labs/host-agent-*"
        - "@kb-labs/state-*"
        - "@kb-labs/tenant"
        - "@kb-labs/perm-*"
        - "@kb-labs/adapters-*"

  node-app:
    extends: backend-construction-boundary
    language: typescript
    package_json:
      required_scripts:
        - build
        - dev
      required_fields:
        - name
        - version
      required_dev_deps:
        typescript: "^5"
        "@kb-labs/devkit": "*"
    tsconfig:
      must_extend_pattern: "@kb-labs/devkit/tsconfig/"
      forbid_paths: false
    eslint:
      must_use_preset: true
    dependencies:
      check_links: true
      check_circular: true

  # SPA apps (Rspack / Vite) — no tsup, no exports, paths allowed
  spa-app:
    extends: backend-construction-boundary
    language: typescript
    package_json:
      required_scripts:
        - build
        - dev
      required_fields:
        - name
        - version
    tsconfig:
      forbid_paths: false
    eslint:
      must_use_preset: true
    dependencies:
      check_links: true
      check_circular: true

  # Next.js/Nuxt apps and their utility packages.
  # Site roots can aggregate app packages; each app package owns its lifecycle scripts.
  site:
    extends: backend-construction-boundary
    language: typescript
    package_json:
      required_fields:
        - name
        - version
    dependencies:
      check_links: false
      check_circular: false

  site-pkg:
    extends: backend-construction-boundary
    language: typescript
    package_json:
      required_fields:
        - name
        - version
    dependencies:
      check_links: false
      check_circular: false

  go-binary:
    language: go
    structure:
      required_files:
        - go.mod
        - Makefile
    go:
      min_version: "1.22"

  # All TypeScript package presets inherit the runtime-only construction boundary.
  backend-construction-boundary:
    dependencies:
      forbidden_kb_imports:
        - "@kb-labs/plugin-execution-factory/construct"

# ──────────────────────────────────────────────────────────────────────────────
# STRUCTURE CHECKS — plugin/core package conventions
# ──────────────────────────────────────────────────────────────────────────────

structure_checks:
  # Core packages MUST have contracts/ (types/) as foundation
  core:
    scope: "core"
    required_packages:
      - name: types
        description: "Base type definitions for entire platform"
        rules:
          - no_runtime_deps
      - name: contracts
        description: "Platform contracts"
        rules:
          - no_runtime_deps

# ──────────────────────────────────────────────────────────────────────────────
# SCAFFOLDING — kb-devkit generate <template> --dest <path> --name <pkg-name>
# Sources: local | npm | git | url
# ──────────────────────────────────────────────────────────────────────────────

scaffolding:
  templates:
    node-lib:
      source: local
      path: templates/node-lib

    go-binary:
      source: local
      path: templates/go-binary

    # plugin:
    #   source: local
    #   path: infra/devkit/templates/plugin
    #
    # adapter:
    #   source: npm
    #   package: "@kb-labs/template-adapter"
    #
    # starter:
    #   source: git
    #   url: "https://github.com/org/repo"
    #   ref: "main"

# ──────────────────────────────────────────────────────────────────────────────
# SYNC — devkit assets
# ──────────────────────────────────────────────────────────────────────────────

sync:
  sources:
    devkit:
      type: local
      path: infra/devkit

  targets:
    - source: devkit
      from: agents/
      to: .kb/devkit/agents/
    - source: devkit
      from: assets/claude/skills/
      to: skills/

  exclude:
    - skills/my-custom-skill.ts
    - .vscode/launch.json

# ──────────────────────────────────────────────────────────────────────────────
# AFFECTED — how `kb-devkit run --affected` detects changed packages
# ──────────────────────────────────────────────────────────────────────────────

affected:
  # strategy: git (default) | submodules | command
  #   git        — single `git diff --name-only HEAD` from workspace root
  #                (uncommitted changes only — CI checkouts have clean tree!)
  #   submodules — walks .gitmodules, runs git diff inside each submodule
  #   command    — runs `command`, reads one file path per line from stdout
  #
  # We use `command` + .devkit/affected.sh so CI can override the base ref via
  # KB_DEVKIT_BASE_REF env var (e.g. origin/main...HEAD for PRs). Locally it
  # falls through to the same behaviour as the built-in git strategy.
  strategy: command
  command: .devkit/affected.sh
  # These generated-contract sources affect consumers beyond their owning package.
  fullInputs:
    - core/platform/src/error-envelope/errors.catalog.json
    - core/plugin-contracts/src/color-policy.mjs

# ──────────────────────────────────────────────────────────────────────────────
# BUILD
# ──────────────────────────────────────────────────────────────────────────────

run:
  # Upper bound on parallel tasks; memory admission may run fewer.
  concurrency: 8
  # Largest observed task-process RSS (2_536_468_480 bytes) in run 40424362740,
  # from the 30-second resource samples: 2419 MiB.
  task_memory_mb: 2419

# ──────────────────────────────────────────────────────────────────────────────
# TASKS — execution engine (kb-devkit run <task>)
# content-addressable cache: hash(inputs) → skip if unchanged
# ──────────────────────────────────────────────────────────────────────────────

tasks:
  docs:generate:
    - categories: [studio-ui-kit]
      command: tsx scripts/generate-component-docs.ts
      inputs:
        - "src/**/*.tsx"
        - "scripts/generate-component-docs.ts"
        - "README.md"
      outputs:
        - "README.md"
        - "src/catalog.generated.ts"

  build:
    - categories: [studio-ui-kit]
      command: tsup
      inputs:
        - "src/**"
        - "scripts/generate-component-docs.ts"
        - "tsup.config.ts"
        - "tsup.config.js"
        - "tsconfig*.json"
        - "package.json"
        - "README.md"
        - "src/catalog.generated.ts"
        - "^dist/**"
      outputs:
        - "dist/**"
      deps:
        - "docs:generate"
        - "^build"

    - categories: [plugin-entry]
      command: pnpm run build
      inputs:
        - "src/**"
        - "tsup.config.ts"
        - "tsup.config.js"
        - "tsconfig*.json"
        - "rspack.studio.config.*"
        - "package.json"
        - "^dist/**"
      outputs:
        - "dist/**"
      deps:
        - "^build"

    - categories: [fixture, fixture-adapter]
      command: node ../../../scripts/build-pack-extra.mjs
      inputs:
        - "manifest.js"
        - "src/**"
        - "package.json"
      outputs:
        - "dist/**"
      cache: false

    - categories: [ts-lib, ts-app, adapter, core-runtime]
      command: tsup
      inputs:
        - "src/**"
        - "tsup.config.ts"
        - "tsup.config.js"
        - "tsconfig*.json"
        - "^dist/**"
      outputs:
        - "dist/**"
      deps:
        - "^build"   # deps' build must finish first

    - categories: [spa]
      command: pnpm run build
      inputs:
        - "src/**"
        - "public/**"
        - "rspack.config.*"
        - "vite.config.*"
        - "tailwind.config.*"
        - "postcss.config.*"
        - "index.html"
        - "package.json"
        - "^dist/**"
      outputs:
        - "dist/**"
      deps:
        - "^build"

    - categories: [go-binary, internal-tool]
      command: make build
      inputs:
        - "**/*.go"
        - "go.mod"
        - "go.sum"
        - "Makefile"
        - "internal/manifest/manifest.json"
      outputs:
        - "kb-devkit"
        - "kb-dev"
        - "kb-create"
        - "kb-deploy"
        - "kb-monitor"
        - "kb-runner"
      deps:
        - "^build"

    - categories: [site-pkg, site-config]
      command: pnpm run build
      inputs:
        - "src/**"
        - "tsconfig*.json"
        - "package.json"
        - "^dist/**"
      outputs: []
      deps:
        - "^build"

    - categories: [site-app]
      command: pnpm run build
      inputs:
        - "src/**"
        - "tsconfig*.json"
        - "package.json"
        - "^dist/**"
      cache: false
      deps:
        - "^build"

  lint:
    - categories: [ts-lib, ts-app]
      command: eslint src/
      inputs:
        - "src/**"
        - "tsconfig*.json"
        - "eslint.config.*"
        - ".eslintrc*"
      outputs: []

    - categories: [go-binary, internal-tool]
      command: go vet ./...
      inputs:
        - "**/*.go"
        - "go.mod"
      outputs: []

    - categories: [site-pkg, site-app]
      command: eslint --no-error-on-unmatched-pattern src/
      inputs:
        - "src/**"
        - "eslint.config.*"
      outputs: []

  type-check:
    - categories: [ts-lib, ts-app]
      command: tsc --noEmit -p tsconfig.json
      inputs:
        - "src/**"
        - "tsconfig*.json"
        - "^dist/**/*.d.ts"   # dep type declarations affect type resolution
      outputs: []
      deps:
        - "^build"   # needs deps' dist/**/*.d.ts

    - categories: [site-pkg, site-app]
      command: tsc --noEmit -p tsconfig.json
      inputs:
        - "src/**"
        - "tsconfig*.json"
        - "^dist/**/*.d.ts"   # dep type declarations affect type resolution
      outputs: []
      deps:
        - "^build"

  # Playwright e2e suites.
  # Each domain package declares devDependencies on the services it tests.
  # This means `kb-devkit run e2e --affected` only runs suites whose
  # upstream packages changed — e.g. changing workflow-engine triggers
  # only @kb-labs/e2e-workflows, not gateway or marketplace.
  #
  # Local run (services already up via kb-dev start):
  #   kb-devkit run e2e --packages @kb-labs/e2e-workflows
  # Full run:
  #   kb-devkit run e2e
  # Affected only:
  #   kb-devkit run e2e --affected
  test:
    - categories: [e2e-node-tests, e2e-platform]
      command: pnpm run test
      inputs:
        - "**/*.test.mjs"
        - "package.json"
      outputs: []

    - categories: [fixture-adapter]
      command: pnpm run test
      inputs:
        - "*.test.js"
        - "package.json"
      outputs: []

    - categories: [ts-lib, ts-app]
      command: vitest run --passWithNoTests
      inputs:
        - "src/**"
        - "test/**"
        - "__tests__/**"
        - "tsconfig*.json"
        - "vitest.config.*"
        - "^dist/**"   # dep outputs affect test results at runtime
      outputs:
        - "coverage/**"
      deps:
        - "build"

    - categories: [go-binary, internal-tool]
      command: make test
      inputs:
        - "**/*.go"
        - "go.mod"
        - "go.sum"
        - "Makefile"
        - "internal/manifest/manifest.json"
        - "^dist/**"
      outputs: []
      deps:
        - "^build"

  test:coverage:
    - categories: [ts-lib, ts-app]
      command: npx vitest run --passWithNoTests --coverage
      inputs:
        - "src/**"
        - "test/**"
        - "__tests__/**"
        - "tsconfig*.json"
        - "vitest.config.*"
      outputs:
        - "coverage/**"
      deps:
        - "build"

    - categories: [go-binary, internal-tool]
      command: go test -short -coverprofile=coverage.out -covermode=atomic ./...
      inputs:
        - "**/*.go"
        - "go.mod"
      outputs:
        - "coverage.out"

  # e2e: Playwright domain suites + Go binary integration tests.
  # Playwright: kb-devkit run e2e --packages @kb-labs/e2e-workflows (one domain)
  #             kb-devkit run e2e --affected                         (changed only)
  #             kb-devkit run e2e                                    (all)
  # Go:         only kb-create has a real suite; others are no-ops for uniformity.
  # CLI handler tests — fast, no daemon required. Commandless plugins have no script;
  # plugin-cli-test-policy requires one for manifests that declare CLI commands.
  # Run: kb-devkit run test:cli
  # Run affected only: kb-devkit run test:cli --affected
  test:cli:
    - categories: [plugin-entry]
      command: pnpm run --if-present test:cli
      inputs:
        - "src/__tests__/cli/**"
        - "src/commands/**"
        - "vitest.cli.config.*"
      outputs: []
      deps:
        - "build"
      cache: false

  e2e:
    # The infrastructure matrix (including e2e-platform's node-test category)
    # and per-plugin matrix run the same `pnpm run e2e`. `--affected` scopes to
    # whichever suites' workspace deps changed.
    - categories: [e2e-suite, e2e-platform, plugin-e2e-suite]
      command: pnpm run e2e
      inputs:
        - "specs/**"
        - "scenarios/**"
        - "lib/**"
        - "playwright.config.ts"
        - "tsconfig.json"
      outputs: []
      deps:
        - "^build"
      # E2E correctness depends on live platform services, not just source.
      # Caching by input hash would return stale 'success' across runs even
      # though no test process actually executed — disabled, same as test:cli.
      cache: false

    - categories: [go-binary]
      command: make e2e
      inputs:
        - "**/*.go"
        - "go.mod"
        - "go.sum"
        - "Makefile"
        - "internal/manifest/manifest.json"
      outputs: []

# ──────────────────────────────────────────────────────────────────────────────
# CUSTOM CHECKS
# ──────────────────────────────────────────────────────────────────────────────
# Each entry runs for packages matching its `categories` filter, or once at
# workspace scope. External checks receive the check context on stdin and emit
# the issue shape defined by tools/kb-devkit/internal/checks/types.go.

checks:
  timeout_ms: 2400000

custom_checks:
  - name: process-launcher-owner
    run: go -C tools/kb-devkit run ./cmd/process-launcher-check
    on: [check]
    scope: workspace

  - name: new-tests
    run: node scripts/checks/new-tests.mjs
    on: [check]
    scope: workspace

  - name: repository-script-tests
