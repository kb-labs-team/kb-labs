# Include from nginx http{} (Debian /etc/nginx/conf.d/*.conf).
limit_req_zone $binary_remote_addr zone=kb_registry_resolve:10m rate=10r/s;
limit_req_status 429;
limit_conn_zone $binary_remote_addr zone=kb_registry_connections:10m;
limit_conn_status 429;

# Do not log query strings: Registry share tokens may arrive in ?token=.
log_format kb_api_safe '$remote_addr [$time_local] "$request_method $uri $server_protocol" '
                       '$status $body_bytes_sent';
