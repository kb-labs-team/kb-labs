# Production overlay for infra/docker-compose.backend.yml.
# Gateway and Registry are reachable from host Nginx only; State Daemon stays
# on the private Compose network and its journal survives container recreation.
services:
  kb-state-daemon:
    ports: !reset []
    environment:
      KB_STATE_DAEMON_DATA_ROOT: /app/.kb/data/state
    volumes:
      - registry_state:/app/.kb/data/state

  kb-gateway:
    ports: !override
      - 127.0.0.1:4000:4000
    environment:
      KB_STATE_DAEMON_URL: http://kb-state-daemon:7777
    volumes:
      - ../ops/marketplace-registry/gateway.override.json:/app/.kb/kb.config.override.json:ro

  kb-marketplace-registry:
    ports: !override
      - 127.0.0.1:5071:5071
    environment:
      KB_REGISTRY_HOST: 0.0.0.0
      KB_REGISTRY_URL: https://api.kblabs.ru/api/v1/marketplace-registry
      KB_STATE_DAEMON_URL: http://kb-state-daemon:7777
      KB_REGISTRY_SIGNING_KEY: ${KB_REGISTRY_SIGNING_KEY:?set KB_REGISTRY_SIGNING_KEY in the deployment secret configuration}
    volumes:
      - ../ops/marketplace-registry/registry.override.json:/app/.kb/kb.config.override.json:ro

volumes:
  registry_state:
