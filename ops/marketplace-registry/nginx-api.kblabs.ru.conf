# API edge for the secured Gateway. Install only after the combined config
# passes `nginx -t` against the host's live configuration.
server {
    listen 80;
    listen [::]:80;
    server_name api.kblabs.ru;
    access_log /var/log/nginx/api.kblabs.access.log kb_api_safe;
    error_log /var/log/nginx/api.kblabs.error.log crit;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/html;
        default_type text/plain;
        try_files $uri =404;
    }

    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name api.kblabs.ru;
    ssl_certificate /etc/letsencrypt/live/api.kblabs.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.kblabs.ru/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
    client_max_body_size 55m;
    access_log /var/log/nginx/api.kblabs.access.log kb_api_safe;
    error_log /var/log/nginx/api.kblabs.error.log crit;

    # Public and authenticated reads needed by Hub/site/Marketplace. Keep the
    # API edge read-only: first publish currently claims an unowned handle, so
    # authenticated publish must stay on a trusted/private author ingress.
    # Nginx location matching uses the normalized path, where an encoded slash
    # in a scoped name becomes `/@scope/name`; account for both path segments.
    # proxy_pass has no URI replacement, preserving the original encoded URI.
    location ~ ^/api/v1/(registry/packages(/[^/]+/(@[^/]+/)?[^/]+(/stats)?)?|marketplace-registry/api/v1/(resolve|packages(/[^/]+/(@[^/]+/)?[^/]+(/stats|/[^/]+/tarball)?)?))/?$ {
        limit_except GET HEAD { deny all; }
        limit_req zone=kb_registry_resolve burst=30 nodelay;
        limit_conn kb_registry_connections 8;
        proxy_pass http://127.0.0.1:4000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 300s;
        proxy_buffering off;
    }

    # No wildcard Gateway proxy on the public API host: this deliberately
    # excludes publish, user/admin services, project resolution, and future
    # routes unless each read-only route is reviewed and added above.
    location / { return 404; }
}
