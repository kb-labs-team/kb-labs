# API edge for the secured Gateway. Install only after the combined config
# passes `nginx -t` against the host's live configuration.
server {
    listen 80;
    listen [::]:80;
    server_name api.kblabs.ru;
    access_log /var/log/nginx/api.kblabs.access.log kb_api_safe;
    error_log /var/log/nginx/api.kblabs.error.log crit;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/html;
        default_type text/plain;
        try_files $uri =404;
    }

    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name api.kblabs.ru;
    ssl_certificate /etc/letsencrypt/live/api.kblabs.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.kblabs.ru/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
    client_max_body_size 55m;
    access_log /var/log/nginx/api.kblabs.access.log kb_api_safe;
    error_log /var/log/nginx/api.kblabs.error.log crit;

    # Includes resolve (including its slash alias) and package reads; cap
    # catalog scans and buffered tarball delivery at the edge.
    location ~ ^/api/v1/(registry|marketplace-registry/api/v1)/(resolve|packages)(/|$) {
        limit_req zone=kb_registry_resolve burst=30 nodelay;
        proxy_pass http://127.0.0.1:4000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 300s;
        proxy_buffering off;
    }

    location / {
        # Preserve Gateway paths and encoded package names; no identity headers
        # are injected at this public edge.
        proxy_pass http://127.0.0.1:4000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 300s;
        proxy_buffering off;
    }
}
