# Public, read-only Marketplace Registry ingress. The author API stays behind
# the loopback-only Gateway port and is never exposed by this vhost.
limit_req_zone $binary_remote_addr zone=kb_registry_resolve:10m rate=10r/s;
limit_conn_zone $binary_remote_addr zone=kb_registry_connections:10m;
log_format kb_api_safe '$remote_addr [$time_local] "$request_method $uri $server_protocol" $status $body_bytes_sent';

server {
    listen 80;
    listen [::]:80;
    server_name api.kblabs.ru;

    access_log /var/log/nginx/api.kblabs.ru.access.log kb_api_safe;
    error_log /var/log/nginx/api.kblabs.ru.error.log crit;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/html;
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name api.kblabs.ru;

    ssl_certificate /etc/letsencrypt/live/api.kblabs.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.kblabs.ru/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
    client_max_body_size 55m;

    access_log /var/log/nginx/api.kblabs.ru.access.log kb_api_safe;
    error_log /var/log/nginx/api.kblabs.ru.error.log crit;

    # These are the only public Registry reads. Nginx location matching uses
    # normalized paths, where encoded scoped names contain a slash. Keep the
    # proxy_pass URI-less so the original encoded request URI reaches Gateway.
    location ~ ^/api/v1/(registry/packages(/[^/]+/(@[^/]+/)?[^/]+(/stats)?)?|marketplace-registry/api/v1/(resolve|packages(/[^/]+/(@[^/]+/)?[^/]+(/stats|/[^/]+/tarball)?)?))/?$ {
        limit_except GET HEAD { deny all; }
        limit_req zone=kb_registry_resolve burst=30 nodelay;
        limit_conn kb_registry_connections 8;
        limit_req_status 429;
        limit_conn_status 429;

        proxy_pass http://127.0.0.1:4000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host "";
        proxy_set_header Forwarded "";
        proxy_set_header Connection "";
        proxy_connect_timeout 5s;
        proxy_read_timeout 300s;
        proxy_buffering off;
    }

    # No wildcard Gateway proxy: publish, user/admin routes, projects, and
    # unreviewed routes remain unreachable through the public API hostname.
    location / {
        return 404;
    }
}
