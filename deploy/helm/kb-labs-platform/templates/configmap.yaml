{{/*
Composition ConfigMap. Deployment topology is chart-owned and cannot be
overridden by users. The image composition remains the source of service
defaults; this file carries the topology and user-supplied config overlay.

${VAR} placeholders inside `.Values.config` are rendered as-is — Helm does
not touch them. They are resolved by the running process at boot from the
env this chart wires via secretRefs (see deployment.yaml).
*/}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}-composition
  labels:
    app.kubernetes.io/part-of: kb-labs-platform
    app.kubernetes.io/instance: {{ .Release.Name }}
data:
  kb.config.override.json: |
{{ $config := deepCopy .Values.config -}}
{{- $platform := (index $config "platform") | default dict -}}
{{- $_ := set $platform "deployment" (dict "topology" "k8s") -}}
{{- $_ := set $config "platform" $platform -}}
{{- $gateway := (index $config "gateway") | default dict -}}
{{- $access := (index $gateway "access") | default dict -}}
{{- $auth := (index $gateway "auth") | default dict -}}
{{- if or (eq (index $access "mode") "local") (eq (index $auth "enabled") false) -}}
{{- fail "KB_DEPLOYMENT_AUTH_REQUIRED: set gateway.access.mode to secured and remove gateway.auth.enabled=false from config" -}}
{{- end -}}
{{- $_ := set $gateway "access" (mergeOverwrite (dict "mode" "secured") $access) -}}
{{- $_ := set $config "gateway" $gateway -}}
{{ toJson $config | indent 4 }}
{{- if .Values.marketplaceLock }}
  marketplace.lock: |
{{ .Values.marketplaceLock | toJson | indent 4 }}
{{- end }}
