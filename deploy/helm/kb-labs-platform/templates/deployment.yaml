{{- range $name, $svc := .Values.services }}
{{- if $svc.enabled }}
{{- if or (eq $name "gateway") (eq $name "rest-api") (eq $name "marketplace-registry") }}
{{- if not $.Values.internalSecretSecretName }}
{{- fail (printf "GATEWAY_INTERNAL_SECRET is required: create a Kubernetes Secret with key GATEWAY_INTERNAL_SECRET and set internalSecretSecretName") }}
{{- end }}
{{- end }}
{{- if and (eq $name "workflow") (gt (int $svc.replicas) 1) }}
{{- fail (printf "services.workflow.replicas is %d, must stay 1: JobBroker/CronScheduler run in-process (services/workflow/daemon/src/bootstrap.ts) and a second replica double-fires every scheduled job. See docs/adr/0037-containers-are-canonical-cloud-delivery.md." (int $svc.replicas)) }}
{{- end }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "kb-labs-platform.fullname" (dict "Release" $.Release "name" $name) }}
  labels:
    {{- include "kb-labs-platform.labels" (dict "Release" $.Release "name" $name) | nindent 4 }}
spec:
  replicas: {{ $svc.replicas }}
  selector:
    matchLabels:
      {{- include "kb-labs-platform.selectorLabels" (dict "Release" $.Release "name" $name) | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "kb-labs-platform.selectorLabels" (dict "Release" $.Release "name" $name) | nindent 8 }}
    spec:
      {{- if $svc.dependsOn }}
      initContainers:
        {{- range $dep := $svc.dependsOn }}
        {{- $depSvc := index $.Values.services $dep }}
        - name: wait-for-{{ $dep }}
          image: busybox:1.36
          command:
            - sh
            - -c
            - >-
              until nc -z {{ include "kb-labs-platform.fullname" (dict "Release" $.Release "name" $dep) }} {{ $depSvc.port }};
              do echo waiting for {{ $dep }}; sleep 2; done
        {{- end }}
      {{- end }}
      containers:
        - name: {{ $name }}
          image: {{ include "kb-labs-platform.image" (dict "Values" $.Values "svc" $svc) }}
          imagePullPolicy: {{ $.Values.image.pullPolicy }}
          {{- if or (eq $name "gateway") (eq $name "rest-api") (eq $name "marketplace-registry") (eq $name "state-daemon") }}
          env:
            {{- if eq $name "state-daemon" }}
            - name: KB_STATE_DAEMON_PORT
              value: {{ $svc.port | quote }}
            {{- end }}
            {{- if or (eq $name "gateway") (eq $name "rest-api") (eq $name "marketplace-registry") }}
            - name: GATEWAY_INTERNAL_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ $.Values.internalSecretSecretName }}
                  key: GATEWAY_INTERNAL_SECRET
            {{- end }}
          {{- end }}
          ports:
            - name: http
              containerPort: {{ $svc.port }}
          {{- if $.Values.secretRefs }}
          envFrom:
            {{- range $ref := $.Values.secretRefs }}
            - secretRef:
                name: {{ $ref }}
            {{- end }}
          {{- end }}
          livenessProbe:
            httpGet:
              path: {{ $svc.healthPath }}
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: {{ $svc.healthPath }}
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
          volumeMounts:
            - name: composition
              mountPath: /app/.kb/kb.config.override.json
              subPath: kb.config.override.json
            {{- if $.Values.marketplaceLock }}
            - name: composition
              mountPath: /app/.kb/marketplace.lock
              subPath: marketplace.lock
            {{- end }}
      volumes:
        - name: composition
          configMap:
            name: {{ $.Release.Name }}-composition
{{- end }}
{{- end }}
