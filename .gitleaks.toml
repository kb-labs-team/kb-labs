title = "KB Labs gitleaks config"

# Run gitleaks' built-in rule set, then allow known false positives by path.
# (A bare config with no rules and no [extend] silently disables all detection,
#  so useDefault=true is required for scanning to actually happen.)
[extend]
useDefault = true

# Allowlist of intentional test fixtures, e2e certificates, fake test secrets,
# and committed build artifacts — NOT real credentials. Path-based so it stays
# stable across squash-merges (commit-fingerprint allowlists break when SHAs
# change). New secrets in production code are still caught.
[allowlist]
description = "Test fixtures, e2e certs, fake test secrets, build artifacts"
paths = [
  # e2e/oidc-idp — self-signed CA + server certs for OIDC e2e tests
  '''e2e/oidc-idp/certs/.*''',
  # e2e/delivery — SSH key used only in delivery e2e fixtures
  '''e2e/delivery/keys/.*''',
  # gateway auth unit tests — fake JWT secrets/passwords in assertions
  '''plugins/gateway/auth/src/__tests__/.*''',
  # e2e / unit test specs — fake API tokens in test helpers
  '''e2e/rest-api/specs/internal\.spec\.ts''',
  '''plugins/host-agent/entry/src/__tests__/cli/register\.cli\.test\.ts''',
  '''e2e/tests/specs/studio/realtime\.spec\.ts''',
  '''core/platform/src/wrappers/pii-detector\.test\.ts''',
  '''plugins/agents/core/tests/tracer/incremental-trace-writer\.test\.ts''',
  '''plugins/agents/mcp/src/__tests__/mcp-tool-pack\.test\.ts''',
  # gateway access-mode e2e — fake JWT signing secret/admin password fixtures
  '''services/gateway/app/src/__tests__/access-modes\.e2e\.test\.ts''',
  # QA scenario docs — example curl commands with placeholder bearer tokens
  '''docs/qa/scenarios/GW-006-auth\.md''',
  # committed build artifacts / generated data — not secrets
  '''sites/.*/\.next/.*''',
  '''\.kb/lock\.json''',
  '''plugins/fixtures/.*''',
]
