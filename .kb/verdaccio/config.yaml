# Verdaccio config for the local release-checks staging registry.
#
# Checked in and mounted read-only into the `verdaccio` kb-dev service
# (.kb/devservices.dev.yaml) — no manual one-time setup (no editing
# ~/.config/verdaccio/config.yaml, no ~/.npmrc auth token). Anonymous publish
# is allowed on purpose: this registry only ever holds the release plan's
# not-yet-published planned versions for the duration of one `release
# checks` run (see scripts/gates/check-pack-install.sh and
# plugins/release/manager-cli/src/cli/commands/stage-plan.ts) — never
# real credentials, never promoted to real npm from here.
storage: /verdaccio/storage

auth:
  htpasswd:
    file: /verdaccio/storage/htpasswd
    max_users: -1

uplinks:
  npmjs:
    url: https://registry.npmjs.org/

packages:
  # Only the CURRENT flow's own plan packages get staged here (see header
  # above) — anything a plan package depends on OUTSIDE its own flow (e.g.
  # sdk's peerDependency on @kb-labs/core-platform, or platform's steward
  # plugin importing from @kb-labs/sdk) is never staged this run and must
  # fall through to the real npmjs uplink to resolve at all. A prior version
  # of this rule dropped `proxy: npmjs` entirely to dodge a first-request
  # uplink sync once measured at 15-60s — but that unconditionally broke
  # every cross-flow dependency instead: pack-install would 404/ETARGET on
  # a real, already-published sibling package just because it wasn't part
  # of the flow being checked (hit live: sdk's checks failing to resolve
  # @kb-labs/core-platform@>=2.0.0 even though 2.117.0 was live on npmjs).
  # Verdaccio checks local storage first and only proxies on a miss, so a
  # plan's own staged packages (served locally, published moments earlier
  # by the Stage step) are unaffected — measured live re-adding this line:
  # a 2-package flow's full pack-install (including one real cross-flow
  # uplink resolution) completed in ~51s, comfortably inside the 120s
  # per-package clean-install timeout.
  '@kb-labs/*':
    access: $all
    publish: $all
    unpublish: $all
    proxy: npmjs

  '@*/*':
    access: $all
    publish: $all
    unpublish: $all
    proxy: npmjs

  '**':
    access: $all
    publish: $all
    unpublish: $all
    proxy: npmjs

# Real tarballs in this workspace (e.g. studio-app) run to tens of MB —
# Verdaccio's default max_body_size (10mb) rejects those publishes outright.
max_body_size: 200mb

logs: { type: stdout, format: pretty, level: warn }
