# Release promotion is a workflow-engine decision. The CI workflow invoked by
# the final step only verifies and delivers the already-built candidate.
name: release-promote
version: 1.0.0
description: Promote one immutable release candidate through the delivery plane
on:
  manual: true

inputs:
  candidateRunId:
    type: string
    description: Successful release-build-candidate workflow run ID
    required: true
  candidateId:
    type: string
    description: Candidate ID recorded in the bundle provenance
    required: true
  flow:
    type: string
    description: Release flow in the candidate bundle
    required: true
  version:
    type: string
    description: Exact version in the candidate bundle
    required: true
  target:
    type: string
    description: Delivery target, canary or stable
    required: true

phases:
  verify:
    label: Verify
    description: Validate the candidate identity and promotion target
  approval:
    label: Approval
    description: Human approval for the target transition
  deliver:
    label: Deliver
    description: Dispatch the immutable bundle to the CI delivery workflow
  promote:
    label: Promote
    description: Atomically advance installable npm and binary channels after CI smoke is green

jobs:
  promote:
    runsOn: local
    steps:
      - name: Validate target
        phase: verify
        run: |
          set -euo pipefail
          case '${{ inputs.target }}' in canary|stable) ;; *) echo 'unsupported promotion target' >&2; exit 2 ;; esac
          case '${{ inputs.flow }}' in platform|sdk) ;; *) echo 'unsupported release flow' >&2; exit 2 ;; esac
          test '${{ inputs.candidateRunId }}' -eq '${{ inputs.candidateRunId }}'

      - name: Confirm promotion
        phase: approval
        uses: builtin:approval
        with:
          title: "Promote ${{ inputs.candidateId }} to ${{ inputs.target }}?"
          instructions: "The delivery workflow will publish only the candidate bundle identified by this run and candidate ID."

      - name: Deliver candidate
        phase: deliver
        timeoutMs: 3600000
        run: |
          set -euo pipefail
          node .kb/workflows/scripts/dispatch-release-delivery.mjs \
            --candidate-run-id '${{ inputs.candidateRunId }}' \
            --candidate-id '${{ inputs.candidateId }}' \
            --flow '${{ inputs.flow }}' \
            --version '${{ inputs.version }}' \
            --target '${{ inputs.target }}' \
            --repository "${GITHUB_REPOSITORY:-kb-labs-team/kb-labs}"

      - name: Advance verified channel
        # 20 minutes was tight for sdk's 2 packages but too short for
        # platform's ~167 — confirmed live: this step ran ~32 minutes moving
        # dist-tags across all platform packages (each with its own retry
        # loop for registry replication lag) and was killed by the timeout
        # mid-run, which the engine then rejected as an illegal status
        # transition once the script's own next update arrived. Match
        # "Deliver candidate"'s budget instead of platform-flow-sizing this
        # one differently.
        phase: promote
        timeoutMs: 3600000
        run: |
          set -euo pipefail
          node .kb/workflows/scripts/promote-release-channel.mjs \
            --candidate-run-id '${{ inputs.candidateRunId }}' \
            --candidate-id '${{ inputs.candidateId }}' \
            --flow '${{ inputs.flow }}' \
            --version '${{ inputs.version }}' \
            --channel '${{ inputs.target }}' \
            --repository "${GITHUB_REPOSITORY:-kb-labs-team/kb-labs}"
