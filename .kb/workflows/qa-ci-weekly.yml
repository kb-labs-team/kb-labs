name: qa-ci-weekly-reliability
version: 1.0.0
description: Collect GitHub CI evidence and publish an agent-ready weekly reliability brief

on:
  schedule:
    cron: "0 9 * * 1"
    timezone: Europe/Moscow
  manual: true

phases:
  collect:
    label: Evidence collection
    description: Download only CI dossiers missing from the local QA cache
  analyze:
    label: Reliability analysis
    description: Build a compact brief; agents can drill into a specific run afterwards

jobs:
  weekly-ci-reliability:
    runsOn: local
    steps:
      - name: Sync new E2E CI evidence
        id: sync
        phase: collect
        summary: Uses GitHub artifact IDs as the immutable per-run evidence source
        run: |
          kb qa ci evidence update --workflow e2e-platform.yml --output .kb/qa/ci/evidence --json

      - name: Build weekly reliability brief
        id: brief
        phase: analyze
        summary: Produces a compact JSON contract for agents, MCP, REST, and human drill-down
        run: |
          WEEK=$(date -u +%G-W%V)
          REPORT=".kb/qa/weekly/${WEEK}.json"
          kb qa ci overview show --input .kb/qa/ci/evidence --output "$REPORT" --json
          echo "::kb-output::$(cat "$REPORT")"
        artifacts:
          weekly-ci-brief:
            type: json
            source: steps.brief.outputs
            label: Weekly CI reliability brief
            digest: Compact QA findings with evidence references for follow-up investigation
            showInSummary: true
