# deploy targets — managed by kb-deploy
registry: ghcr.io/kb-labs-team

infrastructure:
  qdrant:
    type: docker-image
    image: qdrant/qdrant:latest
    ssh:
      host: ${SSH_HOST}
      user: ${SSH_USER}
      key_env: SSH_KEY
    volumes:
      - qdrant_data:/qdrant/storage
    ports:
      - "6333:6333"
    restart: unless-stopped
    strategy: manual

  redis:
    type: docker-image
    image: redis:7-alpine
    ssh:
      host: ${SSH_HOST}
      user: ${SSH_USER}
      key_env: SSH_KEY
    volumes:
      - redis_data:/data
    restart: unless-stopped
    strategy: manual

targets:
  kb-gateway:
    watch:
      - services/gateway/**
      - adapters/openai/**
      - adapters/redis/**
      - adapters/sqlite/**
      - adapters/pino/**
      - adapters/fs/**
      - adapters/log-sqlite/**
      - adapters/log-ringbuffer/**
      - adapters/eventbus-cache/**
      - core/**
      - shared/**
    image: kb-gateway
    dockerfile: services/gateway/app/Dockerfile
    context: .
    ssh:
      host: ${SSH_HOST}
      user: ${SSH_USER}
      key_env: SSH_KEY
    remote:
      compose_file: ~/kb-labs/docker-compose.backend.yml
      service: kb-gateway
      container_name: kb-gateway
    permissions:
      logs: true
      health: true
      exec: false
      rollback: true

  kb-marketplace-registry:
    watch:
      - services/marketplace-registry/**
      - adapters/s3/**
      - adapters/redis/**
      - adapters/pino/**
      - adapters/log-ringbuffer/**
      - core/**
      - shared/**
    image: kb-marketplace-registry
    dockerfile: services/marketplace-registry/app/Dockerfile
    context: .
    ssh:
      host: ${SSH_HOST}
      user: ${SSH_USER}
      key_env: SSH_KEY
    remote:
      compose_file: ~/kb-labs/docker-compose.backend.yml
      service: kb-marketplace-registry
      container_name: kb-marketplace-registry
    permissions:
      logs: true
      health: true
      exec: false
      rollback: true

  kb-labs-web:
    watch:
      - sites/web/**
    image: kb-site-web
    dockerfile: sites/web/apps/web/Dockerfile
    context: .
    bundle: "@kb-labs/web-site"
    ssh:
      host: ${SSH_HOST}
      user: ${SSH_USER}
      key_env: SSH_KEY
    remote:
      compose_file: ~/kb-labs/docker-compose.yml
      service: web
      container_name: kb-labs-web
    permissions:
      logs: true
      health: true
      exec: false
      rollback: true

  kb-labs-docs:
    watch:
      - sites/web/apps/docs/**
    image: kb-site-docs
    dockerfile: sites/web/apps/docs/Dockerfile
    context: .
    bundle: "@kb-labs/docs-site"
    ssh:
      host: ${SSH_HOST}
      user: ${SSH_USER}
      key_env: SSH_KEY
    remote:
      compose_file: ~/kb-labs/docker-compose.yml
      service: docs
      container_name: kb-labs-docs
    permissions:
      logs: true
      health: true
      exec: false
      rollback: true
