version: 2

project_name: kb-deploy

before:
  hooks:
    - go mod tidy

builds:
  - id: kb-deploy
    main: .
    binary: kb-deploy
    env:
      - CGO_ENABLED=0
    ldflags:
      - -s -w
      - -X main.version={{.Version}}
      - -X main.commit={{.Commit}}
      - -X main.date={{.Date}}
    goos:
      - darwin
      - linux
    goarch:
      - amd64
      - arm64
archives:
  - id: default
    format: tar.gz
    name_template: "kb-deploy-{{ .Os }}-{{ .Arch }}"
    files:
      - none*

checksum:
  name_template: checksums.txt
  algorithm: sha256

snapshot:
  version_template: "{{ .Tag }}-snapshot"

changelog:
  disable: true

release:
  draft: true
  replace_existing_draft: true
