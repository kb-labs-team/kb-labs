packages:
  - e2e/*
  - core/*
  - sdk/*
  - cli/*
  - cli/scaffold/*
  - shared/*
  - plugins/*
  - '!plugins/fixtures/*'
  - services/*/*
  - adapters/*
  - infra/devkit
  - tools/kb-create
  - studio/*
  - sites/*
  - sites/*/apps/*
  - sites/*/packages/*
  - templates/*

auditConfig:
  ignoreCves:
    - CVE-2026-14257

minimumReleaseAge: 10080
strictDepBuilds: true
blockExoticSubdeps: true

allowBuilds:
  '@parcel/watcher': true
  '@swc/core': true
  better-sqlite3: true
  esbuild: true
  unrs-resolver: true

overrides:
  react: ^19.0.0
  react-dom: ^19.0.0
  '@types/react': ^19.0.0
  '@types/react-dom': ^19.0.0
  zod: ^3.25.76
  '@fastify/reply-from': '>=12.6.2'
  '@fastify/static': '>=10.1.1'
  # Request body replacement via async validation result collision (fixed in 5.12.2).
  fastify: '>=5.12.2'
  follow-redirects: '>=1.16.0'
  # GHSA-gqvv-2mrq-wpjv, GHSA-g6gw-c38x-mqfc, GHSA-crvj-82cr-hjcx (MCP SDK transitives).
  hono: '>=4.13.5'
  '@hono/node-server': '>=2.0.5'
  koa: '>=2.16.4'
  webpack-dev-server: 5.2.6
  ws: '>=8.21.0'
  # GHSA-hrr3-gc8f-f4qj and GHSA-jvvf-x445-j334 (fast-uri v4 security fixes).
  'fast-uri@^4.0.0': '4.2.1'
  # GHSA-qw65-cvwx-89v3, GHSA-58mr-gqgx-xq4g, and GHSA-hrr3-gc8f-f4qj (fast-uri v3 security fixes).
  'fast-uri@^3.0.0': '3.1.8'
  shell-quote: '>=1.9.0'
  browserslist: '>=4.28.7'
  fflate: '>=0.8.3'
  '@humanfs/node': '>=0.16.8'
  react-router: '>=7.18.1'
  react-router-dom: '>=7.18.1'
  postcss: '>=8.5.23'
  'nanoid@<3.3.18': '>=3.3.18'
  # GHSA-rpw4-54j3-4h4q and GHSA-2vr4-cq9g-pvrc (socks transitives).
  ip-address: '>=10.5.1'
  uuid: '>=11.1.1'
  qs: '>=6.15.4'
  # GHSA-rgj7-g3m4-5g8c (Next.js image processing).
  sharp: '>=0.35.4'
  find-my-way: '>=9.7.0'
  # GHSA-2883-xcg3-v3hh; gray-matter needs the 3.x API, so keep it on patched 3.x.
  'gray-matter>js-yaml': '>=3.15.2 <4'
  # GHSA-2883-xcg3-v3hh for the 4.x eslint and workspace dependency trees.
  js-yaml: '^4.3.2'
  # GHSA-q2hr-2g5m-vwhr (brace-expansion v5 transitives).
  'brace-expansion@^5.0.5': '5.0.12'
  'brace-expansion@^2.0.2': '2.1.4'
  # GHSA-qhr7-859c-m2p7, GHSA-6j4f-fj2g-mc7p, and GHSA-q2hr-2g5m-vwhr (brace-expansion v1 transitives).
  'brace-expansion@^1.1.7': '1.1.21'
  'minimatch@3.1.5>brace-expansion': '1.1.21'
  'minimatch@9.0.9>brace-expansion': '2.1.4'
  'minimatch@10.2.5>brace-expansion': '5.0.12'
  '@babel/core': '>=7.29.6'
  'body-parser@>=2.0.0 <2.3.0': '>=2.3.0'
  'tar@<=7.5.18': '>=7.5.19'
  esbuild: ^0.28.1
  # GHSA-82fw-gwwq-j7x9; Vitest 4.1.11 still accepts the affected patch release.
  '@vitest/mocker': '>=4.1.11'
  # GHSA-3wwx-pv8p-q78v; keep each consumer on its existing major.
  'undici@>=8.1.0 <8.10.2': '8.10.2'
  'undici@^7.0.0': '7.29.1'
  'undici@^6.23.0': '6.28.1'
  'undici@<6.28.1': '6.28.1'
  '@qdrant/js-client-rest>undici': '6.28.1'
  # GHSA-8m3c-c648-2xjj, GHSA-wmmp-3585-3rmp, GHSA-2x7j-588g-ccc2,
  # GHSA-cc9r-2j5m-2m83, and GHSA-6vj9-mwq6-2f5v (inbox/imapflow).
  nodemailer: '>=10.0.2'
  # GHSA-7w5x-hrqm-74c2 (knip transitive).
  smol-toml: '>=1.7.1'
  launch-editor: '>=2.14.1'
  'http-proxy-middleware@>=0.16.0 <2.0.10': 2.0.10
  'form-data@>=4.0.0 <4.0.6': '>=4.0.6'
  # GHSA-vwc7-r8mq-g2x9 and GHSA-7q85-xj36-vmfc (module federation dts plugin).
  'adm-zip@<0.6.1': '>=0.6.1'
